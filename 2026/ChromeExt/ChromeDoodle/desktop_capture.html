<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ChromeDoodle - Desktop / Window キャプチャ</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181b;
      color: #f4f4f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 40px);
      text-align: center;
      gap: 14px;
    }
    h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    p {
      margin: 0;
      font-size: 12px;
      color: #a1a1aa;
      line-height: 1.5;
    }
    button {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover {
      background: #4f46e5;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      font-size: 12px;
      color: #38bdf8;
    }
    .error {
      color: #f87171;
    }
  </style>
</head>
<body>
  <h2>🖥️ Desktop / Window 画面採取</h2>
  <p>このサイトでは直接キャプチャが制限されているため、拡張機能の安全な画面から採取します。</p>
  <button id="capture-btn">画面 / ウィンドウを選択して撮影</button>
  <div id="status" class="status"></div>
  <script src="desktop_capture.js"></script>
</body>
</html>
