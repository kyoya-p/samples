<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ChromeDoodle - クリップボードコピー</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181b;
      color: #f4f4f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 32px);
      text-align: center;
      gap: 10px;
    }
    h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }
    #status {
      font-size: 12px;
      color: #a1a1aa;
      line-height: 1.4;
    }
    #status.error {
      color: #f87171;
    }
    button {
      display: none;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #4f46e5;
    }
  </style>
</head>
<body>
  <h2>📋 クリップボードへコピー</h2>
  <div id="status">画像をクリップボードに書き込んでいます...</div>
  <button id="copy-btn">📋 クリップボードにコピー</button>
  <script src="clipboard_helper.js"></script>
</body>
</html>
