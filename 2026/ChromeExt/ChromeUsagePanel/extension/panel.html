<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fafaf7">
  <title>AI Usage Panel</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-main">
      <div class="brand">
        <h1>AI Usage Panel</h1>
        <div class="tabs" role="tablist" aria-label="表示対象">
          <button type="button" class="tab-btn" data-provider="both">両方</button>
          <button type="button" class="tab-btn" data-provider="claude">Claude Code</button>
          <button type="button" class="tab-btn" data-provider="agy">Antigravity</button>
        </div>
      </div>
      <div class="controls">
        <button type="button" id="btn-sample" class="btn btn-primary">今すぐ /usage 実行</button>
        <button type="button" id="btn-reload" class="btn">データ再読込</button>
        <label class="ctrl-group">
          <span class="mut">自動 /usage:</span>
          <select id="interval-select" aria-label="自動採取間隔">
            <option value="0">OFF</option>
            <option value="5">5分ごと</option>
            <option value="10">10分ごと</option>
            <option value="15">15分ごと</option>
            <option value="30">30分ごと</option>
          </select>
        </label>
        <span class="ctrl-checks" aria-label="自動採取の対象">
          <label class="chk"><input type="checkbox" id="chk-claude"><span>Claude</span></label>
          <label class="chk"><input type="checkbox" id="chk-agy"><span>Agy</span></label>
        </span>
      </div>
    </div>
    <div class="statusbar">
      <span id="host-badge" class="status-pill">確認中...</span>
      <span id="status-text" class="mut"></span>
      <span id="next-alarm-text" class="mut"></span>
      <span id="error-text" class="err-text" hidden></span>
    </div>
    <div id="setup-banner" class="setup-banner" hidden>
      <div>
        <strong>Native Messaging Host が未登録、または接続できません。</strong>
        <span class="mut">以下のコマンドを PowerShell / ターミナルで一度実行してから「再接続テスト」を押してください。</span>
      </div>
      <div class="setup-cmd-row">
        <code id="setup-cmd">node C:\Users\kyoya\projs\samples\2026\ChromeUsagePanel\host\install.js</code>
        <button type="button" id="btn-copy-setup" class="btn btn-sm">コピー</button>
        <button type="button" id="btn-ping-host" class="btn btn-sm">再接続テスト</button>
      </div>
    </div>
  </header>

  <main id="sections">
    <section id="section-claude" class="provider-section">
      <div class="section-head">
        <h2>Claude Code</h2>
        <span id="claude-meta" class="mut"></span>
      </div>
      <div class="grid" id="claude-grid"></div>
    </section>

    <section id="section-agy" class="provider-section">
      <div class="section-head">
        <h2>Antigravity</h2>
        <span id="agy-meta" class="mut"></span>
      </div>
      <div class="grid" id="agy-grid"></div>
    </section>
  </main>

  <script src="panel.js"></script>
</body>
</html>
