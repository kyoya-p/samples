<!doctype html>
<meta charset="utf-8">
<title>Tab Transcriber 設定 (AI-generated)</title>
<style>
  body { font: 14px/1.6 system-ui, 'Segoe UI', sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
  label { display: block; margin: 12px 0 2px; font-weight: 600; }
  select, input { font: inherit; padding: 3px 6px; width: 100%; box-sizing: border-box; }
  small { color: #555; }
  #msg { color: #060; margin-left: 8px; }
</style>
<h1 style="font-size:18px">Tab Transcriber 設定 <small>🤖 AI 生成</small></h1>
<label for="engine">エンジン</label>
<select id="engine">
  <option value="auto">自動 (Gemini Nano → 不可なら Whisper)</option>
  <option value="nano">Gemini Nano のみ</option>
  <option value="whisper">Whisper のみ</option>
</select>
<label for="language">音声の言語 (固定 / 自動判定。Whisper と翻訳元に使用)</label>
<select id="language">
  <option value="auto">自動判定 (初期値)</option>
  <option value="ja">日本語</option>
  <option value="en">English</option>
  <option value="zh">中文</option>
  <option value="ko">한국어</option>
  <option value="es">Español</option>
  <option value="fr">Français</option>
  <option value="de">Deutsch</option>
</select>
<label for="translateTo">翻訳先 (固定)</label>
<select id="translateTo">
  <option value="ja">日本語 (初期値)</option>
  <option value="en">English</option>
  <option value="none">翻訳しない</option>
</select>
<small>翻訳元が翻訳先と同じ言語なら翻訳しない。翻訳は Chrome の翻訳モデルが取得済みならそれを使い、なければブラウザ内のローカルモデルを使う (初回のみモデル取得。日・英・中・韓・西・仏・独の相互翻訳に対応、NLLB は約 600MB)。</small>
<label for="model">Whisper モデル (Hugging Face の ID)</label>
<input id="model" list="models">
<datalist id="models">
  <option value="onnx-community/whisper-tiny">
  <option value="onnx-community/whisper-base">
  <option value="onnx-community/whisper-small">
</datalist>
<small>変更は次回の開始から有効。モデルは初回のみ Hugging Face から取得してブラウザにキャッシュする。</small>
<p><button id="save">保存</button><span id="msg"></span></p>
<script src="options.js"></script>
