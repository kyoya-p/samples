[tools]
java = "21" # 🤖AI: 2026-11-11 ユーザー指示で 25 から変更
coreutils = "latest"
7zip = "26.05"

[vars]
APP_VERSION = "1.0.13"

[tasks]
app = '.\kotlin run'
test = '.\kotlin test'
layoutExecutable = { sources = ['composeApp/src/**/*', 'composeApp/module.yaml', 'project.yaml', 'packaging/PAU.cmd'], outputs = ['build/layout/PAU.cmd'], run = [
    '.\kotlin.bat package -f executable-jar',
    'coreutils rm -rf build/layout build/layout-x',
    'coreutils mkdir -p build/layout/app build/layout-x',
    '%SystemRoot%\System32\tar.exe -xf build/tasks/_composeApp_executableJarJvm/composeApp-jvm-executable.jar -C build/layout-x',
    'coreutils cp build/layout-x/BOOT-INF/lib/*.jar build/layout/app/',
    'coreutils cp build/tasks/_composeApp_jarJvm/composeApp-jvm.jar build/layout/app/app.jar',
    'coreutils rm -rf build/layout-x',
    '''for /f %m in ('jdeps --print-module-deps --ignore-missing-deps --multi-release base build\layout\app\*.jar') do jlink --add-modules %m,jdk.charsets,jdk.localedata,jdk.crypto.ec --strip-debug --no-header-files --no-man-pages --compress zip-6 --output build\layout\runtime''',
    'coreutils cp packaging/PAU.cmd build/layout/PAU.cmd',
] }
executable = { depends = ['layoutExecutable'], run = 'build\layout\PAU.cmd' }
fetchSfx = { outputs = ['build/sfx/7zSD.sfx'], run = 'pwsh -NoProfile -File packaging\PatchSfx.ps1 -Out build\sfx\7zSD.sfx' }
build = { depends = ["makeSfxExe"] }
makeSfxExe = { depends = ['layoutExecutable', 'fetchSfx'], sources = ['build/layout/**/*', 'build/sfx/7zSD.sfx', 'packaging/sfx.conf'], outputs = ['build/PAU-{{vars.APP_VERSION}}-sfx.exe'], run = [
    'coreutils rm -f build/sfx/PAU.7z build/PAU-{{vars.APP_VERSION}}-sfx.exe',
    'cmd /c "cd build\layout && 7za a -t7z -mx=5 ..\sfx\PAU.7z app runtime"',
    'cmd /c copy /b build\sfx\7zSD.sfx + packaging\sfx.conf + build\sfx\PAU.7z build\PAU-{{vars.APP_VERSION}}-sfx.exe',
] }
sfxExe = { depends = ['makeSfxExe'], run = 'build\PAU-{{vars.APP_VERSION}}-sfx.exe' }
