<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Nano Translate 設定</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header>
    <h1>Nano Translate 設定</h1>
  </header>

  <section>
    <h2>翻訳先言語</h2>
    <p class="note">ポップアップ・右クリック・ショートカット・ページ内翻訳の翻訳先。既定はブラウザの言語設定 (UI 言語 → 受け入れ言語の順で、対応する最初の言語。どれも非対応なら English)。ポップアップで翻訳先を変えると、ここの設定も変わる。</p>
    <div class="tools">
      <label>翻訳先 <select id="target"></select></label>
    </div>
  </section>

  <section>
    <h2>辞書 (翻訳キャッシュ)</h2>
    <p class="note">翻訳済みの原文と訳文を端末内 (<code>chrome.storage.local</code>) に保存。同じ原文・翻訳先なら再翻訳せずに辞書の訳文を使う。訳文を編集すると以後の翻訳に反映される。</p>

    <div class="tools">
      <input id="filter" type="search" placeholder="原文・訳文を絞り込み">
      <select id="lang">
        <option value="">翻訳先: すべて</option>
      </select>
      <span id="count" class="muted"></span>
      <span id="msg" class="muted" aria-live="polite"></span>
      <button id="clear-all" type="button" class="danger">全件クリア</button>
    </div>

    <table>
      <thead>
        <tr><th>翻訳先</th><th>原文</th><th>訳文 (編集可)</th><th>保存日時</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="muted" hidden>該当する項目なし</p>
    <p id="more" class="muted" hidden></p>
  </section>

  <script src="prompt.js"></script>
  <script src="options.js"></script>
</body>
</html>
