[tools]
kotlin = "2.4"

# 実行ファイルは build-release/ を使う。学習中は exe がロックされるため、
# 別の出力先 (例: build-tools/) へビルドしたいときは build-release タスクに --dir を渡す。
# 各タスクの末尾の -- 以降は、そのまま valuerl / playmat の引数として渡す (例: mise run train --depth 2 -- --iters 10)

[tasks.build]
description = "Build valuerl (debug)"
run = '.\kotlin.bat build'

[tasks."build-release"]
description = "Build valuerl (release, ~7x faster than debug)"
usage = '''
flag "--dir <dir>" default="build-release" help="出力先 (学習中で build-release がロックされているときは build-tools 等)"
'''
run = '.\kotlin.bat build -m valuerl -v release --build-dir {{usage.dir}}'

[tasks.selftest]
description = "Run self tests (BPTT gradient check, save/load, game, compact action enumeration, lambda-return)"
run = '.\build-release\tasks\_valuerl_linkMingwX64Release\valuerl.exe selftest'

[tasks.train]
description = "TD(lambda) self-play training with N-ply minimax (e.g. mise run train --depth 2 --resume init_h1-best.gru.weight)"
usage = '''
flag "--depth <n>" default="1" help="ミニマックス探索の深さ N。自己対戦・評価対局・リーグ共通 (1=1手先読み。1つ深くするごとに約10倍の時間)"
flag "--width <k>" default="1" help="探索の幅 (1=最善の1手だけ深く読む。0=制限なし)。深さ2以上で、各局面で深く読む手を1手先読みの上位 k 手に絞る"
flag "--step-penalty <c>" default="0" help="1手ごとの報酬 −c (0 で無効。Lv単位の列挙は循環しないので通常は不要)"
flag "--threads <n>" help="同時に指す局数 (省略時は論理プロセッサ数)"
flag "--iters <n>" default="50" help="反復数"
flag "--games <n>" default="16" help="1反復あたりの自己対戦の局数"
flag "--resume <file>" help="開始する重みファイル (省略時は新規作成)"
flag "--out <file>" help="出力名 (省略時は自動採番)"
flag "--pool <files>" help="リーグに初期加入させる重みファイル (カンマ区切り)"
flag "--seed <n>" default="1" help="乱数シード"
arg "[rest]..." var=#true help="その他の train オプション"
'''
run = '.\build-release\tasks\_valuerl_linkMingwX64Release\valuerl.exe train --depth {{usage.depth}} --width {{usage.width}} --step-penalty {{usage.step_penalty}}{% if usage.threads %} --threads {{usage.threads}}{% endif %} --iters {{usage.iters}} --games {{usage.games}} --seed {{usage.seed}}{% if usage.resume %} --resume {{usage.resume}}{% endif %}{% if usage.out %} --out {{usage.out}}{% endif %}{% if usage.pool %} --pool {{usage.pool}}{% endif %}{% if usage.rest %} {{usage.rest | join(sep=" ")}}{% endif %}'

[tasks."train-init"]
description = "Train from scratch: 50 iterations x 16 games (e.g. mise run train-init --depth 2)"
usage = '''
flag "--depth <n>" default="1" help="ミニマックス探索の深さ N"
flag "--width <k>" default="1" help="探索の幅 (1=最善の1手だけ深く読む。0=制限なし)"
'''
run = '.\build-release\tasks\_valuerl_linkMingwX64Release\valuerl.exe train --iters 50 --games 16 --eval-every 5 --eval-games 20 --seed 1 --depth {{usage.depth}} --width {{usage.width}}'

[tasks.match]
description = "Match two agents with alternating first player (e.g. mise run match --a h1_h2-best.gru.weight --b init_h1-best.gru.weight --depth 2)"
usage = '''
flag "--a <file>" required=#true help="A の重みファイル (random も可)"
flag "--b <file>" default="random" help="B の重みファイル (random も可)"
flag "--games <n>" default="20" help="局数"
flag "--depth <n>" default="1" help="両者の探索の深さ N"
flag "--depth-a <n>" help="A だけの探索の深さ (省略時は --depth)"
flag "--depth-b <n>" help="B だけの探索の深さ (省略時は --depth)"
flag "--width <k>" default="1" help="両者の探索の幅 (1=最善の1手だけ深く読む。0=制限なし)"
flag "--width-a <k>" help="A だけの探索の幅 (省略時は --width)"
flag "--width-b <k>" help="B だけの探索の幅 (省略時は --width)"
flag "--temp <t>" default="0.05" help="序盤の温度"
flag "--temp-turns <n>" default="4" help="温度を使うターン数"
arg "[rest]..." var=#true help="その他の match オプション (--seed, --log 等)"
'''
run = '.\build-release\tasks\_valuerl_linkMingwX64Release\valuerl.exe match --a {{usage.a}} --b {{usage.b}} --games {{usage.games}} --depth {{usage.depth}}{% if usage.depth_a %} --depth-a {{usage.depth_a}}{% endif %}{% if usage.depth_b %} --depth-b {{usage.depth_b}}{% endif %} --width {{usage.width}}{% if usage.width_a %} --width-a {{usage.width_a}}{% endif %}{% if usage.width_b %} --width-b {{usage.width_b}}{% endif %} --temp {{usage.temp}} --temp-turns {{usage.temp_turns}}{% if usage.rest %} {{usage.rest | join(sep=" ")}}{% endif %}'

[tasks.league]
description = "Round-robin league with joint Elo estimation (e.g. mise run league --models a.gru.weight,b.gru.weight --depth 2)"
usage = '''
flag "--models <files>" required=#true help="重みファイル (カンマ区切り、2つ以上)"
flag "--games <n>" default="20" help="1組あたりの局数"
flag "--depth <n>" default="1" help="全員の探索の深さ N"
flag "--width <k>" default="1" help="全員の探索の幅 (1=最善の1手だけ深く読む。0=制限なし)"
arg "[rest]..." var=#true help="その他の league オプション (--seed, --temp 等)"
'''
run = '.\build-release\tasks\_valuerl_linkMingwX64Release\valuerl.exe league --models {{usage.models}} --games {{usage.games}} --depth {{usage.depth}} --width {{usage.width}}{% if usage.rest %} {{usage.rest | join(sep=" ")}}{% endif %}'

[tasks.depthbench]
description = "Measure thinking time per move for minimax depth 1..N on the same positions"
usage = '''
flag "--weights <file>" default="init_h1-best.gru.weight" help="重みファイル"
flag "--max-depth <n>" default="4" help="計測する最大の深さ N"
flag "--widths <list>" default="1" help="計測する探索の幅 (カンマ区切り、0=制限なし。例: 0,3,5)"
flag "--games <n>" default="4" help="局面を集める対局数"
flag "--every <n>" default="10" help="何手おきに局面を集めるか"
flag "--budget <sec>" default="120" help="1深さあたりの計測時間の上限 (秒)"
'''
run = '.\build-release\tasks\_valuerl_linkMingwX64Release\valuerl.exe depthbench --weights {{usage.weights}} --max-depth {{usage.max_depth}} --widths {{usage.widths}} --games {{usage.games}} --every {{usage.every}} --budget {{usage.budget}}'

[tasks.inspect]
description = "Show weight file statistics (e.g. mise run inspect -- init_g1.gru.weight)"
run = '.\build-release\tasks\_valuerl_linkMingwX64Release\valuerl.exe inspect'

[tasks.value]
description = "Show V(s) of the initial position and candidate evaluations (e.g. mise run value -- init_g1.gru.weight)"
run = '.\build-release\tasks\_valuerl_linkMingwX64Release\valuerl.exe value'

[tasks."build-playmat"]
description = "Build the BSToolsCla Playmat server (release)"
run = '.\kotlin.bat build -m playmat -v release --build-dir build-release'

[tasks.playmat]
description = "Start BSToolsCla Playmat at http://localhost:8090 (e.g. mise run playmat --weights h1_h2-best.gru.weight --depth 2)"
usage = '''
flag "--port <n>" default="8090" help="ポート番号"
flag "--weights <file>" help="両プレイヤーの重みファイル (省略時は g1_g2-best.gru.weight)"
flag "--depth <n>" default="1" help="選択肢の評価に使う探索の深さ N (1〜4。画面の評価設定からも変更可)"
flag "--width <k>" default="1" help="探索の幅 (1=最善の1手だけ深く読む。0=制限なし。画面の評価設定からも変更可)"
arg "[rest]..." var=#true help="その他の playmat オプション (--weights-p1, --weights-p2, --actions compact)"
'''
run = '.\build-release\tasks\_playmat_linkMingwX64Release\playmat.exe --port {{usage.port}} --depth {{usage.depth}} --width {{usage.width}}{% if usage.weights %} --weights {{usage.weights}}{% endif %}{% if usage.rest %} {{usage.rest | join(sep=" ")}}{% endif %}'

[tasks."eval-d2w3"]
description = "Round-robin league at depth 2 / width 3 (each model reads its top-3 moves 2 plies deep)"
usage = '''
flag "--models <files>" default="g2_g3-p1.gru.weight,g2_g3-p2.gru.weight,g2_g3-p3.gru.weight,g1_g2-best.gru.weight" help="評価する重みファイル (カンマ区切り、2つ以上)"
flag "--games <n>" default="100" help="1組あたりの局数 (先後交互)"
flag "--seed <n>" default="1" help="乱数シード"
'''
run = '.\build-release\tasks\_valuerl_linkMingwX64Release\valuerl.exe league --models {{usage.models}} --games {{usage.games}} --depth 2 --width 3 --seed {{usage.seed}}'
