# Google Antigravity (agy) & Claude Code 関連タスク

["agy-panel"]
description = "AgyTools の使用率パネル (agy-panel.html) を更新してブラウザで開く"
dir = "AgyTools"
run = [
    "node usage_sample.js",
    "node usage_panel.js",
    "node ../open-panel.mjs agy-panel.html",
]

["claude-panel"]
description = "ClaudeCodeTools の使用率パネル (claude-panel.html) を更新してブラウザで開く"
dir = "ClaudeCodeTools"
run = [
    "node usage_sample.js",
    "node usage_panel.js",
    "node ../open-panel.mjs claude-panel.html",
]

[agents-panels]
alias = "agents-panel"
description = "AgyTools・ClaudeCodeTools 両方のパネルをブラウザで開く"
depends = ["agy-panel", "claude-panel"]

["agy-hook"]
description = "Antigravity (T3 Code & CLI) に AgyTools の Stop フックを登録"
dir = "AgyTools"
run = '''node -e "const fs=require('fs'),os=require('os'),p=require('path');const cmd='node '+p.join(process.cwd(),'usage_hook.js');const reg=f=>{const j=fs.existsSync(f)?JSON.parse(fs.readFileSync(f,'utf8')):{};j['agy-usage']={Stop:[{type:'command',command:cmd,timeout:300}]};fs.mkdirSync(p.dirname(f),{recursive:true});fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n');console.log('Registered agy-usage Stop hook in',f);};reg(p.join(os.homedir(),'.gemini','config','hooks.json'));const t3p=p.join(os.homedir(),'.t3','userdata','providers','antigravity');if(fs.existsSync(t3p)){for(const d of fs.readdirSync(t3p)){const prof=p.join(t3p,d);if(fs.existsSync(p.join(prof,'antigravity-acp')))reg(p.join(prof,'config','hooks.json'));}}"'''

["claude-hook"]
description = "Claude Code (~/.claude/settings.json) に ClaudeCodeTools の Stop フックを登録"
dir = "ClaudeCodeTools"
run = '''node -e "const fs=require('fs'),os=require('os'),p=require('path'),f=p.join(os.homedir(),'.claude','settings.json'),cmd='node '+p.join(process.cwd(),'usage_hook.js').replace(/\\/g,'/'),j=fs.existsSync(f)?JSON.parse(fs.readFileSync(f,'utf8')):{};j.hooks=j.hooks||{};j.hooks.Stop=(j.hooks.Stop||[]).filter(x=>!JSON.stringify(x).includes('usage_hook.js'));j.hooks.Stop.unshift({hooks:[{type:'command',command:cmd,timeout:300,async:true}]});fs.mkdirSync(p.dirname(f),{recursive:true});fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n');console.log('Registered ClaudeCodeTools Stop hook in',f);"'''

["enable-hook"]
alias = ["enable-hooks", "agents-hooks"]
description = "Antigravity (T3 Code & CLI) および Claude Code の Usage 採取フックを一括登録"
depends = ["agy-hook", "claude-hook"]

["usage-ext-install"]
description = "ChromeUsagePanel の Native Messaging Host を Chrome / Edge に登録"
dir = "ChromeExt/ChromeUsagePanel/host"
run = "node install.js"
