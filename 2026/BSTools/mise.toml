[tools]
kotlin = "2.4"
rust = "latest"

[tasks.build]
description = "Build all Kotlin/Native tools"
run = ".\\kotlin.bat build"

[tasks."game-server"]
description = "Run GameServer (Kotlin/Native)"
run = ".\\kotlin.bat run -m GameServer"

[tasks.playmats]
description = "Run Playmats (Kotlin/Native)"
run = ".\\kotlin.bat run -m Playmats"

[tasks."survey-x"]
description = "Run SurveyX (JVM / Clikt)"
run = ".\\kotlin.bat run -m SurveyX --"
