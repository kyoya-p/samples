[tools]
kotlin = "2.4"
rust = "latest"

[tasks.build]
description = "Build all Kotlin/Native tools"
run = ".\\kotlin build"

[tasks."game-server"]
description = "Run GameServer (Kotlin/Native)"
run = ".\\kotlin run -m GameServer"

[tasks."playmats"]
description = "Serve Playmats/index.html from disk via npx (no Kotlin rebuild needed to see HTML/CSS/JS changes) and proxy /api/* to the game-server task on :8080 (http://localhost:8082)"
run = "npx --yes local-web-server --port 8082 --directory Playmats --rewrite \"/api/(.*) -> http://localhost:8080/api/$1\""

[tasks."survey-x"]
description = "Run SurveyX (JVM / Clikt)"
run = ".\\kotlin.bat run -m SurveyX --"

[tasks."match-w2-w3"]
description = "Evaluate match between w1_w2 and w2_w3 across 10 games with alternating turns"
run = ".\\build\\tasks\\_GameServer_linkMingwX64Debug\\GameServer.exe --kann-match --p1-weights w2_w3.kann.weight --p2-weights w1_w2.kann.weight --games 10"

[tasks."match-run2-run3"]
description = "Alias for match-w2-w3"
run = ".\\build\\tasks\\_GameServer_linkMingwX64Debug\\GameServer.exe --kann-match --p1-weights w2_w3.kann.weight --p2-weights w1_w2.kann.weight --games 10"

[tasks.match]
description = "Evaluate match between KANN weights with alternating turns and turn count diagnostics"
run = ".\\build\\tasks\\_GameServer_linkMingwX64Debug\\GameServer.exe --kann-match"

[tasks.train]
description = "Train KANN weights via ES self-play"
run = ".\\build\\tasks\\_GameServer_linkMingwX64Debug\\GameServer.exe --kann-es-train"

[tasks."train-w3"]
description = "Train w4 weights starting from w2_w3.kann.weight via ES self-play"
run = ".\\build\\tasks\\_GameServer_linkMingwX64Debug\\GameServer.exe --kann-es-train --resume w2_w3.kann.weight --out w3_w4.kann.weight --generations 20 --games 12 --sigma 0.04 --seed 100 --max-steps 300"

[tasks."train-run3"]
description = "Alias for train-w3"
run = ".\\build\\tasks\\_GameServer_linkMingwX64Debug\\GameServer.exe --kann-es-train --resume w2_w3.kann.weight --out w3_w4.kann.weight --generations 20 --games 12 --sigma 0.04 --seed 100 --max-steps 300"

[tasks."train-w4"]
description = "Train w5 weights starting from w3_w4.kann.weight via ES self-play"
run = ".\\build\\tasks\\_GameServer_linkMingwX64Debug\\GameServer.exe --kann-es-train --resume w3_w4.kann.weight --out w4_w5.kann.weight --generations 20 --games 12 --sigma 0.04 --seed 200 --max-steps 300"

[tasks."train-run4"]
description = "Alias for train-w4"
run = ".\\build\\tasks\\_GameServer_linkMingwX64Debug\\GameServer.exe --kann-es-train --resume w3_w4.kann.weight --out w4_w5.kann.weight --generations 20 --games 12 --sigma 0.04 --seed 200 --max-steps 300"

[tasks.inspect]
description = "Inspect KANN weights file statistics"
run = ".\\build\\tasks\\_GameServer_linkMingwX64Debug\\GameServer.exe --kann-inspect"

[tasks."match-w3-w4"]
description = "Evaluate match between w2_w3 and w3_w4 across 10 games with alternating turns"
run = ".\\build\\tasks\\_GameServer_linkMingwX64Debug\\GameServer.exe --kann-match --p1-weights w3_w4.kann.weight --p2-weights w2_w3.kann.weight --games 10"

[tasks."match-run3-run4"]
description = "Alias for match-w3-w4"
run = ".\\build\\tasks\\_GameServer_linkMingwX64Debug\\GameServer.exe --kann-match --p1-weights w3_w4.kann.weight --p2-weights w2_w3.kann.weight --games 10"

[tasks."match-w4-w5"]
description = "Evaluate match between w3_w4 and w4_w5 across 10 games with alternating turns and choice logging"
run = ".\\build\\tasks\\_GameServer_linkMingwX64Debug\\GameServer.exe --kann-match --p1-weights w4_w5.kann.weight --p2-weights w3_w4.kann.weight --games 10"

[tasks."match-run4-run5"]
description = "Alias for match-w4-w5"
run = ".\\build\\tasks\\_GameServer_linkMingwX64Debug\\GameServer.exe --kann-match --p1-weights w4_w5.kann.weight --p2-weights w3_w4.kann.weight --games 10"

[tasks."train-loop"]
description = "Run multi-cycle reinforcement learning via ES self-play (default: 3 cycles from w3_w4 to w4_w5)"
run = ".\\build\\tasks\\_GameServer_linkMingwX64Debug\\GameServer.exe --kann-es-train --resume w3_w4.kann.weight --out w4_w5.kann.weight --cycles 3 --generations 20 --games 12 --sigma 0.04 --seed 200 --max-steps 300"

[tasks."train-loop-pipeline"]
description = "Build -> Run multi-cycle RL (3 cycles) -> Inspect -> Final match evaluation"
run = [
    ".\\kotlin build",
    ".\\build\\tasks\\_GameServer_linkMingwX64Debug\\GameServer.exe --kann-es-train --resume w3_w4.kann.weight --out w4_w5.kann.weight --cycles 3 --generations 20 --games 12 --sigma 0.04 --seed 200 --max-steps 300",
    ".\\build\\tasks\\_GameServer_linkMingwX64Debug\\GameServer.exe --kann-inspect w4_w5.kann.weight",
    ".\\build\\tasks\\_GameServer_linkMingwX64Debug\\GameServer.exe --kann-match --p1-weights w4_w5.kann.weight --p2-weights w3_w4.kann.weight --games 10"
]





