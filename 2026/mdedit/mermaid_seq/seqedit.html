<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>シーケンス図エディタ</title>
<style>
:root{
  --bg:#e9ebef; --panel:#ffffff; --panel-2:#f4f5f8; --ink:#14171d; --muted:#5f6875;
  --line:#d5d9e1; --line-2:#9aa3b2; --accent:#2d5bb9; --accent-ink:#fff; --accent-soft:rgba(45,91,185,.14);
  --danger:#a8362e; --note:#fff4b8; --box:#eaf0fc; --bar:#dfe6f5; --tab:#e3e7ef;
  --ui:ui-sans-serif,system-ui,"Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif;
  --mono:ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101317; --panel:#181b21; --panel-2:#1e222a; --ink:#e7eaf0; --muted:#98a1ae;
    --line:#2b3039; --line-2:#5a6474; --accent:#82a9f0; --accent-ink:#0e1117; --accent-soft:rgba(130,169,240,.2);
    --danger:#e2867d; --note:#4a4220; --box:#263044; --bar:#37425a; --tab:#2a303b;
  }
}
:root[data-theme="dark"]{
  --bg:#101317; --panel:#181b21; --panel-2:#1e222a; --ink:#e7eaf0; --muted:#98a1ae;
  --line:#2b3039; --line-2:#5a6474; --accent:#82a9f0; --accent-ink:#0e1117; --accent-soft:rgba(130,169,240,.2);
  --danger:#e2867d; --note:#4a4220; --box:#263044; --bar:#37425a; --tab:#2a303b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--ui);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
header .sp{flex:1}
header .grp{display:flex;gap:4px;align-items:center;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
button,select{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default;border-color:var(--line)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{flex:1;min-height:0;display:flex}
.src{width:38%;min-width:240px;position:relative;background:var(--panel);border-right:1px solid var(--line)}
#ln{position:absolute;left:0;top:0;bottom:0;width:44px;overflow:hidden;z-index:1;pointer-events:none;background:var(--panel-2);border-right:1px solid var(--line)}
#lnI{padding:8px 6px 8px 0;text-align:right;color:var(--muted);font:12px/20px var(--mono)}
#lnI div{height:20px}
#lnI .e{color:#fff;background:var(--danger);font-weight:700;padding-right:6px;margin-right:-6px}
#lnI .s{color:var(--accent);font-weight:700}
#errs{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.errl{position:absolute;left:0;right:0;height:20px;background:rgba(200,60,50,.18);border-left:4px solid var(--danger)}
.errl span{position:absolute;right:16px;top:1px;font:11px/18px var(--ui);color:#fff;background:var(--danger);padding:0 6px;border-radius:3px;white-space:nowrap}
#hl{position:absolute;left:0;right:0;height:20px;background:var(--accent-soft);pointer-events:none;display:none}
#src{position:absolute;inset:0;width:100%;height:100%;border:0;resize:none;outline:0;background:transparent;color:var(--ink);
  font:13px/20px var(--mono);padding:8px 8px 8px 52px;white-space:pre;overflow:auto;tab-size:2}
#stage{flex:1;min-width:0;overflow:auto;position:relative;padding:12px;background:var(--panel)}
#view svg{display:block;background:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
#menu{position:fixed;z-index:20;display:none;min-width:210px;max-width:320px;padding:4px;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.22);font-size:13px}
#menu>button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:5px 10px;border-radius:5px}
#menu>button:hover:not(:disabled),#menu .row button:hover{background:var(--accent-soft)}
#menu .row{display:flex;flex-wrap:wrap;gap:3px;padding:4px 8px}
#menu .row span{width:100%;color:var(--muted);font-size:11px}
#menu .row button{padding:2px 7px;font-family:var(--mono);font-size:12px}
#menu button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
#editId{position:absolute;z-index:6;width:120px;font:12px var(--mono);padding:2px 6px;border:2px solid var(--accent);border-radius:4px;background:var(--panel-2);color:var(--ink);outline:0}
#edit{position:absolute;z-index:5;resize:none;overflow:hidden;white-space:pre;font:13px/17px var(--ui);padding:3px 6px;border:2px solid var(--accent);border-radius:4px;background:var(--panel);color:var(--ink);outline:0}
footer{padding:4px 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
footer .err{color:var(--danger);cursor:pointer}
.drop{outline:3px dashed var(--accent);outline-offset:-6px}
@media (max-width:820px){main{flex-direction:column}.src{width:100%;height:40%;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <div class="grp">
    <button id="bPart" title="参加者を追加">＋参加者</button>
    <button id="bMsg" title="選択行の下にメッセージを追加">＋メッセージ</button>
    <button id="bNote" title="Noteを追加">＋Note</button>
    <select id="bBlock" title="選択行を囲む / 末尾に追加">
      <option value="">囲む…</option><option>loop</option><option>alt</option><option>opt</option><option>par</option><option>critical</option><option>break</option>
    </select>
  </div>
  <div class="grp">
    <button id="bUp" title="選択行を上へ">↑</button>
    <button id="bDown" title="選択行を下へ">↓</button>
    <button id="bDup" title="選択行を複製">複製</button>
    <button id="bFlip" title="送信元と宛先を入替">⇄</button>
    <button id="bArrow" title="矢印種別を切替 (->> / -->> / -> / --> / -x / -))">矢印</button>
    <button id="bDel" title="選択行を削除 (Delete)">削除</button>
  </div>
  <div class="grp">
    <label title="メッセージに連番を自動付与 (autonumber 行の追加 / 削除)" style="display:flex;gap:4px;align-items:center;cursor:pointer"><input type="checkbox" id="cAuto">autonumber</label>
  </div>
  <div class="grp">
    <button id="bZm" title="図を縮小(図の上で Ctrl+ホイールでも可)">−</button><span id="zv">100%</span><button id="bZp" title="図を拡大(図の上で Ctrl+ホイールでも可)">＋</button>
  </div>
  <span class="sp"></span>
  <span id="fn" style="color:var(--muted);font-size:12px"></span>
  <select id="sBlk" title="この .md 内のどのシーケンス図を編集するか" hidden></select>
  <button id="bOpen" title=".md / .mmd を開く(.md は mermaid シーケンス図ブロックのみ編集)。ダイアログは最後に使ったフォルダから開始">開く</button>
  <input id="file" type="file" accept=".mmd,.md,.txt" hidden>
</header>
<main>
  <div class="src"><div id="errs"></div><div id="ln"><div id="lnI"></div></div><div id="hl"></div><textarea id="src" spellcheck="false" wrap="off" aria-label="Mermaid sequenceDiagram ソース"></textarea></div>
  <div id="stage"><div id="view"></div></div>
</main>
<footer>
  <span id="st">—</span>
  <span>ドラッグ: ライフライン間＝追加 / 要素＝上下移動 / 矢印の端＝付替 / 参加者＝並替 / Note端・ブロック下端＝範囲 ｜ ダブルクリック＝編集(Enter＝確定 / Shift+Enter＝改行、参加者は ID 欄と表示名欄) ｜ 右クリック＝メニュー</span>
</footer>

<script>
"use strict";
const $=s=>document.querySelector(s);
const ta=$('#src'), view=$('#view'), stage=$('#stage'), hl=$('#hl'), st=$('#st');
const FONT='"Yu Gothic UI","Hiragino Sans",Meiryo,ui-sans-serif,system-ui,sans-serif';
const LH=20, PAD=8;
const ctx=document.createElement('canvas').getContext('2d'); ctx.font='13px '+FONT;
const SAMPLE=`sequenceDiagram
  title 注文フロー
  autonumber
  actor U as ユーザー
  participant W as Web
  participant A as API
  participant D as DB
  U->>W: 注文する
  W->>+A: POST /orders
  A->>+D: 在庫確認
  D-->>-A: 結果
  alt 在庫あり
    A->>D: 注文保存
  else 在庫なし
    A-->>W: 409 Conflict
  end
  A-->>-W: レスポンス
  Note over U,W: 画面更新
  loop 3回まで
    W->>W: リトライ待ち
  end
  W-->>U: 結果表示
`;
let model=null, sel=null, pendingSel=null, pendingEdit=null, geo=null, zoom=1, theme='auto', editEl=null;

/* ---------- parser ---------- */
const MSG=/^(.+?)\s*(<<-->>|<<->>|-->>|->>|--x|-x|--\)|-\)|-->|->)\s*([+-]?)\s*([^\s:]+?)\s*(?::\s*(.*))?$/;
const ARROWS=['->>','-->>','->','-->','-x','-)','<<->>','<<-->>'];
function parse(text){
  const L=text.split('\n'), items=[], parts=[], map={}, errors=[], byLine={};
  let title='', titleLine=null, depth=0;
  const part=(id,label,type,line)=>{
    let p=map[id];
    if(!p){p=map[id]={id,label:id,type:'participant',idx:parts.length,line:null};parts.push(p)}
    if(label!=null)p.label=label;
    if(type)p.type=type;
    if(line!=null&&p.line==null){p.line=line;byLine[line]={k:'part',raw:p.label}}
    return p;
  };
  const br=s=>s.replace(/<br\s*\/?>/gi,'\n');
  L.forEach((raw,n)=>{
    const t=raw.trim(); if(!t||t.startsWith('%%'))return;
    let m;
    if(/^sequenceDiagram\b/i.test(t))return;
    if(m=t.match(/^title\s*:?\s*(.*)$/i)){title=br(m[1]);titleLine=n;byLine[n]={k:'title',raw:m[1]};return}
    if(/^autonumber\b/i.test(t)){items.push({k:'auto',line:n});return}
    if(m=t.match(/^(participant|actor)\s+(\S+?)(?:\s+as\s+(.+))?$/i)){
      part(m[2],m[3]!=null?br(m[3]):null,m[1].toLowerCase(),n);
      if(m[3]!=null){const p=map[m[2]];if(p.line===n)byLine[n].raw=m[3]}else if(map[m[2]].line===n)byLine[n].raw=m[2];
      return}
    if(m=t.match(/^note\s+(left of|right of|over)\s+([^:]+?)\s*:\s*(.*)$/i)){
      const ps=m[2].split(',').map(s=>part(s.trim()));
      const it={k:'note',pos:m[1].toLowerCase(),ps,raw:m[3],text:br(m[3]),line:n};
      items.push(it);byLine[n]={k:'note',raw:m[3]};return}
    if(m=t.match(/^(activate|deactivate)\s+(\S+)$/i)){
      items.push({k:'act',on:m[1].toLowerCase()==='activate',p:part(m[2]),line:n});byLine[n]={k:'act'};return}
    if(m=t.match(/^(loop|alt|opt|par|critical|break|rect)\b\s*(.*)$/i)){
      depth++;items.push({k:'bstart',type:m[1].toLowerCase(),raw:m[2],text:br(m[2]),line:n});byLine[n]={k:'block',raw:m[2]};return}
    if(m=t.match(/^(else|and|option)\b\s*(.*)$/i)){
      items.push({k:'bsep',type:m[1].toLowerCase(),raw:m[2],text:br(m[2]),line:n});byLine[n]={k:'block',raw:m[2]};return}
    if(/^end$/i.test(t)){
      if(depth>0){depth--;items.push({k:'bend',line:n});byLine[n]={k:'end'}}else errors.push({line:n,msg:'対応するブロックが無い end'});
      return}
    if(m=t.match(MSG)){
      const f=part(m[1].trim()),to=part(m[4]);
      const raw=m[5]||'';
      items.push({k:'msg',f,t:to,arrow:m[2],act:m[3],raw,text:br(raw),line:n});byLine[n]={k:'msg',raw};return}
    errors.push({line:n,msg:'解釈できない行: '+t.slice(0,30)});
  });
  if(depth>0)errors.push({line:L.length-1,msg:'end が不足 ('+depth+')'});
  return {items,parts,errors,title,titleLine,byLine,nLines:L.length};
}

/* ---------- layout / svg ---------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function layout(m){
  const P=m.parts,n=P.length,LHT=16;
  const lines=s=>String(s).split('\n');
  const tw=s=>Math.max(0,...lines(s).map(l=>ctx.measureText(l).width));
  if(!n)return null;
  const BH=Math.max(38,...P.map(p=>lines(p.label).length*LHT+22));
  const bw=P.map(p=>Math.max(84,tw(p.label)+(p.type==='actor'?46:28)));
  const gap=[];for(let i=0;i<n-1;i++)gap.push((bw[i]+bw[i+1])/2+24);
  let leftX=0,rightX=0;
  const x=[30+leftX+bw[0]/2];for(let i=1;i<n;i++)x.push(x[i-1]+gap[i-1]);
  const W=x[n-1]+bw[n-1]/2+30+rightX;
  const top=m.title?40:12;
  let cursor=top+BH+22;
  const bg=[],life=[],bars=[],fg=[],ys=[];
  let minL=0,maxR=W;
  const act=P.map(()=>[]);
  const stack=[];
  let num=0,auto=false;
  const closeBar=(i,y)=>{const s=act[i].pop();if(s)bars.push({i,level:act[i].length+1,y0:s.y0,y1:y,line:s.line})};
  const touch=(a,b)=>{for(const s of stack){s.minX=Math.min(s.minX,a);s.maxX=Math.max(s.maxX,b)}};
  const edge=(i,l,side)=>l===0?x[i]:side>0?x[i]+5+(l-1)*5:x[i]-5;
  const al=(txt,cx)=>lines(txt).length>1?`x="${cx-tw(txt)/2}" text-anchor="start"`:`x="${cx}" text-anchor="middle"`;
  const textLines=(txt,cx,yBottom,anchor)=>anchor==='middle'?lines(txt).map((l,i,a)=>`<text class="t" ${al(txt,cx)} y="${yBottom-(a.length-1-i)*LHT}">${esc(l)}</text>`).join(''):lines(txt).map((l,i,a)=>`<text class="t" x="${cx}" y="${yBottom-(a.length-1-i)*LHT}" text-anchor="${anchor}">${esc(l)}</text>`).join('');
  const closeBlock=(y,b)=>{
    const pad=18+10*b.inner,inner=b.inner;
    if(b.minX===Infinity){b.minX=x[0];b.maxX=x[0]}
    const x0=b.minX-pad,x1=b.maxX+pad,w=x1-x0;
    minL=Math.min(minL,x0);maxR=Math.max(maxR,x1);
    const tabW=tw(b.type)+20;
    let s=`<g class="el" data-kind="bstart" data-line="${b.line}"><rect class="blk" x="${x0}" y="${b.y0}" width="${w}" height="${y-b.y0}"/>`+
      `<path class="tab" d="M${x0} ${b.y0}h${tabW}v12l-8 8h${-(tabW-8)}z"/><text class="t" x="${x0+8}" y="${b.y0+14}" font-weight="600">${esc(b.type)}</text>`+
      (b.label?lines('['+b.label+']').map((l,k)=>`<text class="t" x="${x0+tabW+8}" y="${b.y0+15+k*LHT}">${esc(l)}</text>`).join(''):'')+`</g>`;
    if(b.type==='rect'){const col=(b.label||'').replace(/[^\w#(),.%\s-]/g,'')||'transparent';
      s=`<g class="el" data-kind="bstart" data-line="${b.line}"><rect class="blk" x="${x0}" y="${b.y0}" width="${w}" height="${y-b.y0}" style="fill:${col};fill-opacity:.45" pointer-events="none"/>`+
        `<rect x="${x0}" y="${b.y0}" width="${w}" height="${y-b.y0}" fill="none" stroke="transparent" stroke-width="8" pointer-events="stroke"/></g>`}
    for(const sp of b.seps){
      s+=`<g class="el" data-kind="bsep" data-line="${sp.line}"><line class="sep" x1="${x0}" x2="${x1}" y1="${sp.y}" y2="${sp.y}"/>`+
        `<line class="hit" x1="${x0}" x2="${x1}" y1="${sp.y}" y2="${sp.y}" stroke="transparent" stroke-width="12"/>`+
        (sp.label?lines('['+sp.label+']').map((l,k)=>`<text class="t" x="${x0+tabW+8}" y="${sp.y+16+k*LHT}">${esc(l)}</text>`).join(''):'')+`</g>`;
    }
    if(b.endLine!=null)s+=`<g class="el" data-kind="bend" data-line="${b.endLine}"><line class="hit" x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="transparent" stroke-width="10"/></g>`;
    bg.push(s);
    return inner;
  };
  for(const it of m.items){
    ys.push({line:it.line,y:cursor});
    if(it.k==='auto'){auto=true;num=0;continue}
    if(it.k==='msg'){
      const a=it.f.idx,b=it.t.idx,Ln=lines(it.text).length;
      let txt=it.text;if(auto){num++;txt=num+'. '+txt}
      const bi=it.arrow.startsWith('<<'),ar=bi?it.arrow.slice(2):it.arrow,dash=ar.startsWith('--'),kind=ar.replace(/^--?/,'');
      const ms=bi?' marker-start="url(#mF)"':'';
      const mk=kind==='>>'?'url(#mF)':kind==='x'?'url(#mX)':kind===')'?'url(#mO)':'';
      const cls='msg'+(dash?' dash':'');
      if(it.act==='+')act[b].push({y0:0,line:it.line});
      const lvS=act[a].length,lvT=act[b].length;
      let y,g;
      if(a===b){
        y=cursor+Ln*LHT+6;
        if(it.act==='+')act[b][act[b].length-1].y0=y;
        const x1=edge(a,lvT,1);
        g=`<g class="el" data-kind="msg" data-self="1" data-x1="${x1}" data-x2="${x1+36}" data-line="${it.line}"><path class="${cls}" d="M${x1} ${y}H${x1+36}V${y+20}H${x1+2}" marker-end="${mk}"${ms}/>`+
          `<path class="hit" d="M${x1} ${y}H${x1+36}V${y+20}H${x1}" fill="none" stroke="transparent" stroke-width="14"/>`+
          textLines(txt,x1+8,y-6,'start')+`</g>`;
        {const r=x1+8+tw(txt)+4;touch(x1,Math.max(x1+36,r));maxR=Math.max(maxR,r)}
        if(it.act==='-')closeBar(a,y+10);
        cursor=y+34;
      }else{
        y=cursor+Ln*LHT+8;
        if(it.act==='+')act[b][act[b].length-1].y0=y;
        const dir=b>a?1:-1,x1=edge(a,lvS,dir),x2=edge(b,lvT,-dir);
        g=`<g class="el" data-kind="msg" data-x1="${x1}" data-x2="${x2}" data-line="${it.line}"><line class="${cls}" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" marker-end="${mk}"${ms}/>`+
          `<line class="hit" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="transparent" stroke-width="14"/>`+
          textLines(txt,(x1+x2)/2,y-6,'middle')+`</g>`;
        {const c=(x1+x2)/2,hw=tw(txt)/2+4,l=Math.min(x1,x2,c-hw),r=Math.max(x1,x2,c+hw);touch(l,r);minL=Math.min(minL,l);maxR=Math.max(maxR,r)}
        if(it.act==='-')closeBar(a,y);
        cursor=y+18;
      }
      fg.push(g);
    }else if(it.k==='note'){
      const Ln=lines(it.text).length,W2=Math.max(70,tw(it.text)+24),h=Ln*LHT+10;
      let x0,x1;const i=it.ps[0].idx;
      if(it.pos==='left of'){x1=x[i]-8;x0=x1-W2}
      else if(it.pos==='right of'){x0=x[i]+8;x1=x0+W2}
      else{
        const a=Math.min(...it.ps.map(p=>x[p.idx])),b=Math.max(...it.ps.map(p=>x[p.idx]));
        x0=a-10;x1=b+10;if(x1-x0<W2){const c=(a+b)/2;x0=c-W2/2;x1=c+W2/2}
      }
      const y=cursor+4;
      fg.push(`<g class="el" data-kind="note" data-x0="${x0}" data-x1="${x1}" data-line="${it.line}"><path class="note" d="M${x0} ${y}H${x1-8}l8 8V${y+h}H${x0}z"/>`+
        lines(it.text).map((l,k)=>`<text class="t" ${al(it.text,(x0+x1)/2)} y="${y+16+k*LHT-2}">${esc(l)}</text>`).join('')+`</g>`);
      touch(x0,x1);minL=Math.min(minL,x0);maxR=Math.max(maxR,x1);
      cursor=y+h+14;
    }else if(it.k==='act'){
      const i=it.p.idx;
      if(it.on)act[i].push({y0:cursor-4,line:it.line});else closeBar(i,cursor-4);
      cursor+=6;
    }else if(it.k==='bstart'){
      stack.push({type:it.type,label:it.text,line:it.line,y0:cursor,minX:Infinity,maxX:-Infinity,inner:0,seps:[]});
      cursor+=30+(it.type==='rect'?0:(lines(it.text).length-1)*LHT);
    }else if(it.k==='bsep'){

  const defs=`<defs><marker id="mF" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse"><path d="M0 1.5L10.5 6L0 10.5z" fill="${C.ink}"/></marker>`+

    `<marker id="mX" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="7" refY="6" orient="auto"><path d="M2 1L12 11M12 1L2 11" fill="none" stroke="${C.ink}" stroke-width="1.6"/></marker></defs>`;

    style+defs+titleS+bg.join('')+life.join('')+barS+fg.join('')+boxes.join('')+`</svg>`;

/* ---------- text edit helpers ---------- */
function lineOffsets(){const L=ta.value.split('\n'),off=[0];for(const l of L)off.push(off[off.length-1]+l.length+1);return {L,off}}

/* ---------- inline editor ---------- */
/* 参加者: ID / 表示名 を別々に編集(null は変更なし)。ID 変更時は参照箇所も置換 */

  const p=model.parts.find(p=>p.line===n);if(!p)return;
  const raw=model.byLine[n].raw;

  label=label==null?(raw===p.id?id:raw):label.trim().replace(/\r?\n/g,'<br/>');
  if(!id||/\s/.test(id)||/[:,;]/.test(id)||/^(end|note|title|loop|alt|opt|par|rect|else|and)$/i.test(id)||/-[->x)]|<</.test(id)){flash('⚠ ID に使えない文字/語: '+id);return}
  if(id!==p.id&&model.parts.some(q=>q.id===id)){flash('⚠ ID 重複: '+id);return}
  const L=getL(),sw=x=>x===p.id?id:x;

    if(k==='msg'&&(o=msgP(l))){if(o.f===p.id||o.t===p.id){o.f=sw(o.f);o.t=sw(o.t);L[i]=msgS(o)}}

  rewrite(L,n);
}
let editWhat=null;

/* ---------- view interaction ---------- */
const NS='http://www.w3.org/2000/svg';
const NOTE=/^note\s+(left of|right of|over)\s+([^:]+?)\s*:\s*(.*)$/i;
const BSTART=/^(loop|alt|opt|par|critical|break|rect)\b/i;
const BLOCKS=['loop','alt','opt','par','critical','break'];
const getL=()=>ta.value.split('\n');
function msgP(l){const m=l.trim().match(MSG);return m&&{ind:indentOf(l),f:m[1].trim(),a:m[2],act:m[3],t:m[4],x:m[5]}}
const msgS=o=>`${o.ind}${o.f}${o.a}${o.act}${o.t}${o.x!=null?': '+o.x:''}`;
function noteP(l){const m=l.trim().match(NOTE);return m&&{ind:indentOf(l),pos:m[1].toLowerCase(),ps:m[2].split(',').map(s=>s.trim()),x:m[3]}}
const noteS=o=>`${o.ind}Note ${o.pos} ${o.ps.join(',')}: ${o.x}`;
function blockEnd(L,n){let d=0;for(let i=n;i<L.length;i++){const t=L[i].trim();if(BSTART.test(t))d++;else if(/^end$/i.test(t)){d--;if(d<=0)return i}}return L.length-1}
function lastContent(L){let n=L.length-1;while(n>0&&!L[n].trim())n--;return n}
function topIndent(L){const l=L.find(l=>l.trim()&&!/^\s*sequenceDiagram\b/i.test(l));return l?indentOf(l):'  '}
function flash(msg){st.textContent=msg;setTimeout(()=>model&&status(),2500)}
function rewrite(L,selLine,editLine){
  const v=L.join('\n');if(v===ta.value)return false;
  if(parse(v).errors.length>model.errors.length){flash('⚠ その操作は構文が崩れるため中止');return false}
  pendingSel=selLine??null;pendingEdit=editLine??null;
  const o=ta.value;let a=0,eo=o.length,en=v.length;
  while(a<eo&&a<en&&o[a]===v[a])a++;
  while(eo>a&&en>a&&o[eo-1]===v[en-1]){eo--;en--}
  edit(a,eo,v.slice(a,en));return true;
}
/* move lines a..b to the position indicated by y */
function dropTarget(y,a,b){return geo.ys.find(o=>o.y>y&&(o.line<a||o.line>b))}
function headEnd(L){
  let e=L.findIndex(l=>/^\s*sequenceDiagram\b/i.test(l))+1;
  for(let i=e;i<L.length;i++){const t=L[i].trim();if(!t)continue;if(/^(title|autonumber|participant|actor|%%)/i.test(t))e=i+1;else break}
  return e;
}
function moveRange(L,a,b,y){
  const tg=dropTarget(y,a,b);
  let ins=tg?tg.line:lastContent(L)+1;
  while(ins>0&&!L[ins-1].trim()&&(ins-1<a||ins-1>b))ins--;
  const he=headEnd(L);if(ins<he&&a>=he)ins=he;
  if(ins>=a&&ins<=b+1)return null;
  let ind;
  if(a===b&&/^(end|else|and|option)\b/i.test(L[a].trim()))ind=indentOf(L[a]);
  else if(tg&&tg.line>=he){const t=L[tg.line].trim();ind=indentOf(L[tg.line])+(/^(end|else|and|option)\b/i.test(t)?'  ':'')}
  else ind=topIndent(L);
  const chunk=L.slice(a,b+1),base=Math.min(...chunk.filter(l=>l.trim()).map(l=>indentOf(l).length));
  const moved=chunk.map(l=>l.trim()?ind+l.slice(base):l);
  let out=L.slice(0,a).concat(L.slice(b+1)),at=ins>b?ins-chunk.length:ins;

  if(a===b&&/^end$/i.test(L[a].trim())&&at>a&&!out[a].trim()){out.splice(a,1);at--}
  out.splice(at,0,...moved);
  let pos=at;const n=moved.length,ra=a<at?a:a+n;
  const depthAt=k=>{let d=0;for(let i=0;i<k;i++){const t=out[i].trim();if(BSTART.test(t))d++;else if(/^end$/i.test(t))d--}return d};
  for(const k of [...new Set([at,at+n,ra])].sort((x,y)=>y-x)){
    if(k<=0||k>=out.length)continue;
    const p=out[k-1].trim(),q=out[k].trim();
    if(!p&&!q){out.splice(k,1);if(k<pos)pos--}
    else if(p&&q&&depthAt(k)===0&&(/^end$/i.test(p)||BSTART.test(q))){out.splice(k,0,'');if(k<=pos)pos++}
  }

}
/* rebuild participant declarations in the given order (also declares implicit ones) */
function reorderParts(L,from,to){
  const ids=model.parts.map(p=>p.id);const id=ids.splice(from,1)[0];ids.splice(to,0,id);
  const isDecl=l=>/^\s*(participant|actor)\s+\S/i.test(l);
  const decl={};model.parts.forEach(p=>{decl[p.id]=p.line!=null?L[p.line].trim():'participant '+p.id});
  let pos=L.findIndex(isDecl),ind;
  if(pos<0){
    let h=L.findIndex(l=>/^\s*sequenceDiagram\b/i.test(l));
    for(let i=h+1;i<L.length&&/^\s*(title|autonumber|%%)/i.test(L[i]);i++)h=i;
    pos=h+1;ind=topIndent(L);
  }else ind=indentOf(L[pos]);
  const out=L.filter(l=>!isDecl(l));

function wrap(a,b,type){
  const L=getL(),ind=indentOf(L[a]);
  for(let i=a;i<=b;i++)if(L[i].trim())L[i]='  '+L[i];
  L.splice(b+1,0,ind+'end');L.splice(a,0,ind+type+' 条件');
  rewrite(L,a,a);
}
function rangeOf(n){const L=getL();return BSTART.test((L[n]||'').trim())?[n,blockEnd(L,n)]:[n,n]}
function renamePart(i,what){const p=model.parts[i];what=what||'label';if(p.line!=null)return startEdit(p.line,what);const r=reorderParts(getL(),i,i);editWhat=what;rewrite(r.L,r.at,r.at)}
function setPartType(i,type){const r=reorderParts(getL(),i,i);r.L[r.at]=r.L[r.at].replace(/^(\s*)(participant|actor)\b/i,'$1'+type);rewrite(r.L,r.at)}
function deletePart(i){
  const id=model.parts[i].id,L=getL(),kill=new Set();
  L.forEach((l,k)=>{const m=l.trim().match(/^(participant|actor)\s+(\S+?)(\s+as\s|$)/i);if(m&&m[2]===id)kill.add(k)});
  for(const it of model.items){
    if((it.k==='msg'&&(it.f.id===id||it.t.id===id))||(it.k==='act'&&it.p.id===id))kill.add(it.line);
    else if(it.k==='note'&&it.ps.some(p=>p.id===id)){
      /* Note は対象一覧からその参加者だけ外す。他に対象が無ければ Note ごと削除 */
      if(it.ps.every(p=>p.id===id))kill.add(it.line);
      else L[it.line]=L[it.line].replace(/^(\s*note\s+(?:left of|right of|over)\s+)([^:]+?)(\s*:)/i,(a,p,list,c)=>p+list.split(',').map(x=>x.trim()).filter(x=>x!==id).join(',')+c);

  const vl=(x,w=3)=>`<line x1="${x}" x2="${x}" y1="0" y2="${vb.height}" stroke="${A}" stroke-width="${w}" opacity=".45"/>`;
  const ln=(x1,x2,y)=>`<line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" stroke="${A}" stroke-width="2" stroke-dasharray="5 3"/>`;
  const tgY=()=>{const t=dropTarget(p.y,drag.a,drag.b);return t?t.y-2:geo.bottom}
  let s='';
  switch(drag.mode){
    case 'new':{const j=nearestPart(p.x,40);s=ln(geo.x[drag.i],p.x,drag.sy)+(j>=0?vl(geo.x[j]):'');break}
    case 'to':case 'from':{const j=nearestPart(p.x,40);s=ln(drag.fx,p.x,drag.sy)+(j>=0?vl(geo.x[j]):'');break}

function endDrag(e){

  switch(drag.mode){
    case 'new':{

    case 'move':{const r=moveRange(L,drag.a,drag.b,p.y);if(r)rewrite(r.L,r.at);break}

        const dd=Math.max(-lo,Math.min(model.parts.length-1-hi,d));

      }
      rewrite(L2,at);break}
    case 'nL':case 'nR':{
      const o=noteP(L[drag.line]);if(!o)break;
      const idx=o.ps.map(id=>model.parts.findIndex(q=>q.id===id)),j=nearestPart(p.x);
      let lo=Math.min(...idx),hi=Math.max(...idx);
      if(drag.mode==='nR')hi=j;else lo=j;if(lo>hi)[lo,hi]=[hi,lo];

      L[drag.line]=noteS(o);rewrite(L,drag.line);break}
    case 'part':{

      const r=reorderParts(L,from,to);rewrite(r.L,r.at);break}
  }

    return (i+1)+': '+(ti?ti[1]:hd?hd[1]:'シーケンス図').trim().slice(0,48)});
  const b0=hit.index+hit[0].indexOf('\n')+1,b1=b0+hit[3].length;
  return {pre:t.slice(0,b0),post:t.slice(b1),body:lf(hit[3]).replace(/\n$/,''),crlf:/\r\n/.test(hit[3]),md:true,cnt,idx,blocks};
}
function fullText(){const b=doc.crlf?ta.value.replace(/\n/g,'\r\n'):ta.value;return doc.md?doc.pre+b+(doc.crlf?'\r\n':'\n')+doc.post:b}
function showName(){const n=(doc.name||'無題')+(doc.md?' [mermaid ブロック]':'')+'';$('#fn').textContent=n;document.title=n+' - シーケンス図エディタ'}
function loadText(t,name,handle){
  const d=splitDoc(t);
  if(/\.(md|markdown)$/i.test(name||'')&&!d.md){flash('⚠ mermaid の sequenceDiagram ブロックが無いため開けません(図以外は編集不可)');return}
  doc={pre:d.pre,post:d.post,crlf:d.crlf,md:d.md,idx:d.idx,name:name||'',handle:handle||null,orig:t};
  ta.value=d.body;savedSrc=d.body;sel=null;update();fillBlocks(d);keepHandle();
  if(d.cnt>1)flash('シーケンス図 '+d.cnt+' 個: 右上のプルダウンで編集対象を選択');

}
function fillBlocks(d){const e=$('#sBlk');e.hidden=!(d&&d.cnt>1);e.innerHTML='';if(e.hidden)return;
  d.blocks.forEach((b,i)=>{const o=document.createElement('option');o.value=i;o.textContent=b;e.appendChild(o)});e.value=d.idx}
function refreshBlocks(){fillBlocks(doc.md?splitDoc(fullText(),doc.idx):null)}
/* 編集対象の図を切替。編集中の内容は文書側に保持(保存は Ctrl+S で全体) */
function switchBlock(k){
  if(!doc.md)return;stopEdit(true);
  const dirty=ta.value!==savedSrc,d=splitDoc(fullText(),k);
  doc={...doc,pre:d.pre,post:d.post,md:d.md,crlf:d.crlf,idx:d.idx};
  ta.value=d.body;savedSrc=dirty?null:d.body;sel=null;ta.scrollTop=0;update();fillBlocks(d);
}
$('#sBlk').onchange=e=>{switchBlock(+e.target.value);e.target.blur()};
async function saveFile(){
  if(!doc.handle)return saveMdAs();
  const data=fullText();
  try{
    if(doc.handle){
      if(doc.handle.requestPermission&&await doc.handle.requestPermission({mode:'readwrite'})!=='granted')throw new Error('書込権限なし');
      if(doc.orig!=null){const cur=await (await doc.handle.getFile()).text();
        if(cur!==doc.orig&&!confirm('ファイルが読込後に外部で変更されています。上書きしますか?'))return}
      else if(doc.md){const d=splitDoc(await (await doc.handle.getFile()).text(),doc.idx);
        if((d.pre!==doc.pre||d.post!==doc.post)&&!confirm('ファイルの図以外の部分が、エディタの保持内容と異なります(外部で変更された可能性)。上書きしますか?'))return}
      const w=await doc.handle.createWritable();await w.write(data);await w.close();
      doc.name=doc.handle.name;doc.orig=data;keepHandle();
    }else dl(doc.name||'seq.mmd',data,'text/plain');
    savedSrc=ta.value;showName();save();refreshBlocks();flash('保存: '+(doc.name||'seq.mmd'));
  }catch(e){if(e.name!=='AbortError')flash('保存失敗: '+e.message)}
}
/* 名前を付けて .md 保存。.md 由来でなければ図を ```mermaid フェンスで包む */
async function saveMdAs(){
  const F='`'.repeat(3),wrap=!doc.md,data=wrap?F+'mermaid\n'+ta.value+'\n'+F+'\n':fullText();
  const name=(doc.name||'sequence').replace(/\.(mmd|txt|md|markdown)$/i,'')+'.md';
  try{
    if(window.showSaveFilePicker){
      const h=await pick(showSaveFilePicker,{suggestedName:name,types:[{description:'Markdown',accept:{'text/markdown':['.md']}}]});
      const w=await h.createWritable();await w.write(data);await w.close();
      if(wrap)doc={...doc,pre:F+'mermaid\n',post:F+'\n',md:true,crlf:false,idx:0};
      doc.handle=h;doc.name=h.name;doc.orig=data;keepHandle();
    }else dl(name,data,'text/markdown');
    savedSrc=ta.value;showName();save();refreshBlocks();flash('保存: '+(doc.handle?doc.name:name));
  }catch(e){if(e.name!=='AbortError')flash('保存失敗: '+e.message)}
}
/* 保存機能は一旦無効(saveFile / saveMdAs は未使用のまま残置) */
const PICK_ID='seqedit-md';
async function pick(fn,opts){
  const o={id:PICK_ID,...opts};if(doc.handle)o.startIn=doc.handle;
  try{return await fn(o)}
  catch(e){if(e.name==='AbortError'||!o.startIn)throw e;delete o.startIn;return fn(o)}   /* 無効なハンドル等 → 記憶フォルダで再試行 */
}
$('#bOpen').onclick=async()=>{
  if(!window.showOpenFilePicker)return $('#file').click();
  try{const [h]=await pick(showOpenFilePicker,{types:[{description:'Markdown / Mermaid',accept:{'text/plain':['.md','.mmd','.txt']}}]});
    loadText(await (await h.getFile()).text(),h.name,h)}
  catch(e){if(e.name!=='AbortError')flash('読込失敗: '+e.message)}
};
$('#file').onchange=e=>{const f=e.target.files[0];if(f)loadFile(f);e.target.value=''};
function loadFile(f,h){f.text().then(t=>loadText(t,f.name,h))}
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drop')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drop')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drop');
  const f=e.dataTransfer.files[0],it=e.dataTransfer.items&&e.dataTransfer.items[0];if(!f)return;
  const hp=it&&it.getAsFileSystemHandle?it.getAsFileSystemHandle().catch(()=>null):Promise.resolve(null);
  hp.then(h=>loadFile(f,h&&h.kind==='file'?h:null))});

/* ---------- persistence ---------- */
let saveT=null,packSeq=0;
async function pack(t){
  const b=new Uint8Array(await new Response(new Blob([t]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
  let bin='';for(let i=0;i<b.length;i++)bin+=String.fromCharCode(b[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function unpack(z){
  const bin=atob(z.replace(/-/g,'+').replace(/_/g,'/')),u=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
}
function setHash(){
  const t=ta.value,plain=()=>{try{history.replaceState(null,'','#src='+encodeURIComponent(t))}catch(e){}};
  if(!window.CompressionStream)return plain();
  const q=++packSeq;pack(t).then(z=>{if(q===packSeq)history.replaceState(null,'','#z='+z)}).catch(plain);
}
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    setHash();
    try{localStorage.setItem('seqedit.src',ta.value);localStorage.setItem('seqedit.doc',JSON.stringify({pre:doc.pre,post:doc.post,name:doc.name,crlf:doc.crlf,md:doc.md,idx:doc.idx,saved:savedSrc}))}catch(e){}
  },300);
}
function update(){
  model=parse(ta.value);
  if(pendingSel!==null){sel=pendingSel;pendingSel=null}
  if(sel!=null&&!model.byLine[sel])sel=null;
  render();status();showName();save();$('#cAuto').checked=model.items.some(i=>i.k==='auto');
  if(pendingEdit!==null){const l=pendingEdit;pendingEdit=null;if(model.byLine[l])startEdit(l)}
}
(async function init(){
  let src=null;
  const h=location.hash.match(/^#(src|z)=(.*)$/);
  if(h){try{src=h[1]==='z'?await unpack(h[2]):decodeURIComponent(h[2])}catch(e){}}
  let ls=null;try{ls=localStorage.getItem('seqedit.src')}catch(e){}
  if(src==null)src=ls;
  if(src!=null&&src===ls){try{const d=JSON.parse(localStorage.getItem('seqedit.doc')||'null');if(d){doc={...doc,pre:d.pre,post:d.post,name:d.name,crlf:d.crlf,md:d.md,idx:d.idx|0};savedSrc=d.saved}}catch(e){}}
  ta.value=src||SAMPLE;update();refreshBlocks();
  if(doc.name&&!doc.handle){const d0=doc;try{const h=await idb('readonly',st=>st.get('handle'));if(h&&h.name===d0.name&&doc===d0){doc.handle=h;showName()}}catch(e){}}
})();
</script>
