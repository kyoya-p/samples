<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>シーケンス図エディタ</title>
<style>
:root{
  --bg:#e9ebef; --panel:#ffffff; --panel-2:#f4f5f8; --ink:#14171d; --muted:#5f6875;
  --line:#d5d9e1; --line-2:#9aa3b2; --accent:#2d5bb9; --accent-ink:#fff; --accent-soft:rgba(45,91,185,.14);
  --danger:#a8362e; --note:#eaf0fc; --box:#eaf0fc; --bar:#dfe6f5; --tab:#e3e7ef;
  --ui:ui-sans-serif,system-ui,"Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif;
  --mono:ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101317; --panel:#181b21; --panel-2:#1e222a; --ink:#e7eaf0; --muted:#98a1ae;
    --line:#2b3039; --line-2:#5a6474; --accent:#82a9f0; --accent-ink:#0e1117; --accent-soft:rgba(130,169,240,.2);
    --danger:#e2867d; --note:#263044; --box:#263044; --bar:#37425a; --tab:#2a303b;
  }
}
:root[data-theme="dark"]{
  --bg:#101317; --panel:#181b21; --panel-2:#1e222a; --ink:#e7eaf0; --muted:#98a1ae;
  --line:#2b3039; --line-2:#5a6474; --accent:#82a9f0; --accent-ink:#0e1117; --accent-soft:rgba(130,169,240,.2);
  --danger:#e2867d; --note:#263044; --box:#263044; --bar:#37425a; --tab:#2a303b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--ui);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
header .sp{flex:1}
header .grp{display:flex;gap:4px;align-items:center;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
button,select{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default;border-color:var(--line)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{flex:1;min-height:0;display:flex}
.src{width:38%;min-width:160px;position:relative;background:var(--panel);flex-shrink:0;overflow:hidden}
#split{width:5px;cursor:col-resize;background:transparent;border-right:1px solid var(--line);flex-shrink:0;touch-action:none}
#split:hover,#split.on{background:var(--accent-soft);border-right-color:var(--accent)}
#ln{position:absolute;left:0;top:0;bottom:0;width:44px;overflow:hidden;z-index:1;pointer-events:none;background:var(--panel-2);border-right:1px solid var(--line)}
#lnI{padding:8px 6px 8px 0;text-align:right;color:var(--muted);font:12px/20px var(--mono)}
#lnI div{height:20px}
#lnI .e{color:#fff;background:var(--danger);font-weight:700;padding-right:6px;margin-right:-6px}
#lnI .s{color:var(--accent);font-weight:700}
#lnI .b{color:var(--ink);font-weight:600}
#blkHl{position:absolute;left:0;right:0;background:rgba(45,91,185,.07);border-left:3px solid var(--accent);pointer-events:none;display:none}
#errs{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.errl{position:absolute;left:0;right:0;height:20px;background:rgba(200,60,50,.18);border-left:4px solid var(--danger)}
.errl span{position:absolute;right:16px;top:1px;font:11px/18px var(--ui);color:#fff;background:var(--danger);padding:0 6px;border-radius:3px;white-space:nowrap}
#hl,#hl2{position:absolute;left:0;right:0;height:20px;background:var(--accent-soft);pointer-events:none;display:none}
#src{position:absolute;inset:0;width:100%;height:100%;border:0;resize:none;outline:0;background:transparent;color:var(--ink);
  font:13px/20px var(--mono);padding:8px 8px 8px 52px;white-space:pre;overflow:auto;tab-size:2}
#stage{flex:1;min-width:0;overflow:auto;position:relative;padding:12px;background:var(--panel)}
#view svg{display:block;background:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
#menu{position:fixed;z-index:20;display:none;min-width:210px;max-width:320px;padding:4px;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.22);font-size:13px}
#menu>button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:5px 10px;border-radius:5px}
#menu>button:hover:not(:disabled),#menu .row button:hover{background:var(--accent-soft)}
#menu .row{display:flex;flex-wrap:wrap;gap:3px;padding:4px 8px}
#menu .row span{width:100%;color:var(--muted);font-size:11px}
#menu .row button{padding:2px 7px;font-family:var(--mono);font-size:12px}
#menu button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
#menu .sw{width:19px;height:19px;padding:0;border-radius:4px;border:1px solid var(--line-2);position:relative;overflow:hidden;flex-shrink:0}
#menu .sw.on{outline:2px solid var(--accent);outline-offset:1px}
.sw-bg{background-image:conic-gradient(#d8dce4 25%,#fff 25% 50%,#d8dce4 50% 75%,#fff 75%);background-size:8px 8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sw-bg{background-image:conic-gradient(#343b48 25%,#232832 25% 50%,#343b48 50% 75%,#232832 75%)}}
:root[data-theme="dark"] .sw-bg{background-image:conic-gradient(#343b48 25%,#232832 25% 50%,#343b48 50% 75%,#232832 75%)}
#colPop{position:fixed;z-index:25;display:none;width:278px;padding:12px;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.12);font-size:12px;user-select:none}
#colPop .cp-hd{display:flex;align-items:center;gap:6px;margin-bottom:10px;cursor:grab}
#colPop .cp-hd:active{cursor:grabbing}
#colPop .cp-ttl{flex:1;font-weight:600;font-size:12px;letter-spacing:.01em}
#colPop .cp-clr{font-size:11px;padding:2px 7px;border-radius:5px;color:var(--muted)}
#colPop .cp-x{width:22px;height:22px;padding:0;border:0;background:transparent;color:var(--muted);border-radius:5px;font-size:15px;line-height:1;display:grid;place-items:center}
#colPop .cp-x:hover{background:var(--panel-2);color:var(--ink)}
#cpSV{position:relative;width:100%;height:146px;border-radius:8px;overflow:hidden;cursor:crosshair;touch-action:none;margin-bottom:10px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.22)}
#cpSV::before{content:"";position:absolute;inset:0;background:linear-gradient(to right,#fff,transparent)}
#cpSV::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000,transparent)}
#cpSVK{position:absolute;z-index:2;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45),0 2px 5px rgba(0,0,0,.35);transform:translate(-50%,-50%);pointer-events:none}
#colPop .cp-mid{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#cpPv{position:relative;width:34px;height:34px;border-radius:8px;overflow:hidden;flex-shrink:0;border:1px solid var(--line-2);cursor:pointer;display:flex;padding:0}
#cpPv span{flex:1;height:100%;display:block}
#colPop .cp-bars{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.cp-trk{position:relative;height:12px;border-radius:999px;cursor:pointer;touch-action:none;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
#cpH{background:linear-gradient(to right,#f00 0%,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00 100%)}
#cpAFill{position:absolute;inset:0;border-radius:999px;pointer-events:none}
.cp-knob{position:absolute;top:50%;z-index:2;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.38),0 1px 4px rgba(0,0,0,.35);transform:translate(-50%,-50%);pointer-events:none}
#cpEye{width:28px;height:34px;padding:0;border-radius:7px;display:grid;place-items:center;flex-shrink:0;color:var(--muted)}
#cpEye:hover{color:var(--ink)}
#colPop .cp-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
#colPop .cp-num{display:flex;flex-direction:column;align-items:center;gap:2px}
#colPop .cp-num input{width:100%;text-align:center;font:11.5px var(--mono);padding:4px 2px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);color:var(--ink);outline:0;appearance:textfield;-moz-appearance:textfield}
#colPop .cp-num input::-webkit-inner-spin-button,#colPop .cp-num input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
#colPop .cp-num input:focus{border-color:var(--accent)}
#colPop .cp-num span{font-size:10px;color:var(--muted);letter-spacing:.04em}
#colPop .cp-str{display:flex;gap:5px;align-items:center;margin-bottom:10px}
#cpFmt{font:10.5px var(--mono);font-weight:600;padding:4px 6px;border-radius:6px;flex-shrink:0;min-width:44px;color:var(--accent)}
#colPop .cp-txt{flex:1;min-width:0;font:11.5px var(--mono);padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);color:var(--ink);outline:0}
#colPop .cp-txt:focus{border-color:var(--accent)}
#colPop .cp-txt.bad{border-color:var(--danger)}
#colPop .cp-sws{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:10px}
#colPop .cp-sw{height:20px;padding:0;border-radius:5px;border:1px solid rgba(128,128,128,.28);cursor:pointer;position:relative;overflow:hidden;transition:transform .1s ease}
#colPop .cp-sw:hover{transform:scale(1.1);z-index:1;border-color:var(--accent)}
#colPop .cp-sw.on{outline:2px solid var(--accent);outline-offset:1px}
#colPop .cp-sw i{position:absolute;inset:0;display:block}
#colPop .cp-ft{display:flex;justify-content:flex-end;gap:6px}
#editId{position:absolute;z-index:6;width:120px;font:12px var(--mono);padding:2px 6px;border:2px solid var(--accent);border-radius:4px;background:var(--panel-2);color:var(--ink);outline:0}
#edit{position:absolute;z-index:5;resize:none;overflow:hidden;white-space:pre;font:13px/17px var(--ui);padding:3px 6px;border:2px solid var(--accent);border-radius:4px;background:var(--panel);color:var(--ink);outline:0}
#editCol{position:absolute;z-index:6;padding:3px 7px;font-size:12px;border:1px solid var(--line-2);border-radius:4px;background:var(--panel-2);color:var(--ink);cursor:pointer}
footer{padding:4px 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
footer .err{color:var(--danger);cursor:pointer}
.drop{outline:3px dashed var(--accent);outline-offset:-6px}
@media (max-width:820px){main{flex-direction:column}.src{width:100%;height:40%;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <div class="grp">
    <label title="メッセージに連番を自動付与 (autonumber 行の追加 / 削除)" style="display:flex;gap:4px;align-items:center;cursor:pointer"><input type="checkbox" id="cAuto">autonumber</label>
  </div>
  <div class="grp">
    <button id="bZm" title="図を縮小(図の上で Ctrl+ホイールでも可)">−</button><span id="zv">100%</span><button id="bZp" title="図を拡大(図の上で Ctrl+ホイールでも可)">＋</button>
  </div>
  <span class="sp"></span>
  <span id="fn" style="color:var(--muted);font-size:12px"></span>
  <select id="sBlk" title="この .md 内のどのシーケンス図を編集するか" hidden></select>
  <button id="bSample" title="全機能を網羅したデフォルトのサンプル図を読み込む">サンプル</button>
  <button id="bOpen" title=".md / .mmd を開く(.md は mermaid シーケンス図ブロックのみ編集)。ダイアログは最後に使ったフォルダから開始">開く</button>
  <button id="bReload" title="開いているファイルを再読込(カーソル・選択・スクロール維持)" hidden>再読込</button>
  <input id="file" type="file" accept=".mmd,.md,.txt" hidden>
</header>
<main>
  <div class="src"><div id="blkHl"></div><div id="errs"></div><div id="ln"><div id="lnI"></div></div><div id="hl"></div><div id="hl2"></div><textarea id="src" spellcheck="false" wrap="off" aria-label="Mermaid sequenceDiagram ソース"></textarea></div>
  <div id="split" title="ドラッグで幅変更"></div>
  <div id="stage"><div id="view"></div></div>
</main>
<footer>
  <span id="st">—</span>
  <span>ドラッグ: ライフライン間＝追加 / 要素＝上下移動 / 矢印の端＝付替 / 参加者＝並替 / Note端・ブロック下端＝範囲 ｜ ダブルクリック＝編集(Enter＝確定 / Shift+Enter＝改行、参加者は ID 欄と表示名欄) ｜ 右クリック＝メニュー</span>
</footer>

<script>
"use strict";
const $=s=>document.querySelector(s);
const ta=$('#src'), view=$('#view'), stage=$('#stage'), hl=$('#hl'), st=$('#st');
const FONT='"Yu Gothic UI","Hiragino Sans",Meiryo,ui-sans-serif,system-ui,sans-serif';
const LH=20, PAD=8;
const ctx=document.createElement('canvas').getContext('2d'); ctx.font='13px '+FONT;
const SAMPLE=`sequenceDiagram
  %% 1. タイトル・自動連番・グループ囲み (box)・参加者定義 (actor / participant / <br/>改行)
  title シーケンス図エディタ 全機能デモ<br/>（Box囲み・create/destroy・全矢印10種・活性区間・ブロック7種・Note3種）
  autonumber
  actor U as ユーザー<br/>(Actor)
  box rgba(45, 91, 185, 0.14) フロントエンド＆API層
    participant W as Web<br/>フロント
    participant A as API<br/>サーバー
  end
  box rgba(16, 185, 129, 0.22) データ層
    participant D as DB / Queue
  end

  %% 2. 矢印全10種 (->> / -->> / -> / --> / -x / --x / -) / --) / <<->> / <<-->> )
  U->W: 実線・矢じり無し (->)
  W-->U: 破線・矢じり無し (-->)
  U->>W: 実線・塗り矢印 (->>) 同期呼出
  W-->>U: 破線・塗り矢印 (-->>) 応答
  U->>U: 自己呼び出し (->>)
  W-xA: 実線・✕終端 (-x) 失敗/破棄
  A--xW: 破線・✕終端 (--x) エラー通知
  W-)A: 実線・開矢印 (-)) 非同期送信
  A--)W: 破線・開矢印 (--)) 非同期応答
  W<<->>A: 実線・双方向 (<<->>) 双方向同期
  A<<-->>D: 破線・双方向 (<<-->> ) 双方向ストリーム

  %% 3. 途中生成 (create) と 消滅 (destroy ✕)
  create participant Wk as 一時Worker<br/>(create)
  A->>+Wk: ジョブ生成 & 開始
  destroy Wk
  Wk-->>-A: 処理完了

  %% 4. 活性区間（+ / - ショートハンド、ネスト活性、activate / deactivate、自己呼び出し）
  U->>+W: 活性開始 (+W)
  W->>+A: ネスト活性開始 (+A)
  A->>+A: 自己呼び出し & ネスト活性 (+A)<br/>複数行ラベルの折り返し表示
  A-->>-A: 自己呼び出し終了 (-A)
  activate D
  A->>D: 明示的 activate / deactivate と長文ラベルの自動折り返し確認用メッセージ（全体図の左右端を超えないように自動クランプ＆折り返し）
  deactivate D
  A-->>-W: 活性終了 (-A)
  W-->>-U: 活性終了 (-W)

  %% 5. Note 3種 (left of / right of / over 単一・複数参加者・改行)
  Note left of U: 左側ノート (left of)<br/>2行目テキスト
  Note right of D: 右側ノート (right of)
  Note over W,A: 複数参加者またぎノート (over W,A)<br/>ドラッグで範囲変更・ダブルクリックで編集

  %% 6. 複合フラグメント・背景ハイライト全7種 (alt/else, loop, opt, par/and, critical/option, break, rect)
  rect rgba(45, 91, 185, 0.15)
    alt 条件分岐 (alt) : 正常系
      W->>A: 通常リクエスト
      rect rgb(245, 158, 11)
        loop ループ (loop) : 最大3回
          A->>D: クエリ実行
        end
      end
      opt オプション (opt) : キャッシュ更新
        A-)D: 非同期キャッシュ書込
      end
    else 分岐 (else) : 異常系
      A--xW: エラー応答
      break 中断 (break) : リトライ上限到達
        W--xU: 処理中断通知
      end
    end
  end

  par 並列処理 (par) : 通知A
    A-)U: メール通知送信
  and 並列分岐 (and) : 通知B
    A-)W: WebSocket Push通知
  end

  critical クリティカル区間 (critical) : 排他トランザクション
    A->>D: ロック取得 & 更新
  option 例外条件 (option) : デッドロック時
    D--xA: ロールバック
  end
`;
let model=null, sel=null, pendingSel=null, pendingEdit=null, geo=null, zoom=1, theme='auto', editEl=null;

/* ---------- parser ---------- */
const MSG=/^(.+?)\s*(<<-->>|<<->>|<<--|<<-|-->>|->>|--x|-x|--\)|-\)|<--|<-|\(--|\(-|-->|->)\s*([+-]?)\s*([^\s:]+?)\s*(?::\s*(.*))?$/;
const ARROWS=['->>','-->>','->','-->','-x','--x','-)','--)','<<->>','<<-->>','<-','<--','<<-','<<--','(-','(--'];
const REV_PAIR={'->>':'<<-','-->>':'<<--','->':'<-','-->':'<--','-)':'(-','--)':'(--','<<-':'->>','<<--':'-->>','<-':'->','<--':'-->','(-':'-)','(--':'--)'};
function parse(text){
  const L=text.split('\n'), items=[], parts=[], boxes=[], map={}, errors=[], byLine={};
  let title='', titleLine=null, depth=0, curBox=null, bstack=[];
  const part=(id,label,type,line)=>{
    let p=map[id];
    if(!p){p=map[id]={id,label:id,type:'participant',idx:parts.length,line:null,box:null,created:false,destroyed:false};parts.push(p)}
    if(label!=null)p.label=label;
    if(type)p.type=type;
    if(line!=null&&p.line==null){p.line=line;byLine[line]={k:'part',raw:p.label}}
    return p;
  };
  const br=s=>s.replace(/<br\s*\/?>/gi,'\n');
  const isCssCol=c=>/^transparent$/i.test(c)||(!/^#/.test(c)&&!/^\d+$/.test(c)&&typeof CSS!=='undefined'&&CSS.supports&&CSS.supports('color',c));
  const parseBox=s=>{
    s=s.trim();if(!s)return {color:'',title:''};
    const fm=s.match(/^([a-z-]+\s*\([^)]*\))(?:\s+(.*))?$/i);
    if(fm&&isCssCol(fm[1]))return {color:fm[1],title:br(fm[2]||'')};
    const m=s.match(/^(\S+)(?:\s+(.*))?$/);
    if(!m)return {color:'',title:br(s)};
    return isCssCol(m[1])?{color:m[1],title:br(m[2]||'')}:{color:'',title:br(s)};
  };
  L.forEach((raw,n)=>{
    const t=raw.trim(); if(!t||t.startsWith('%%'))return;
    let m;
    if(/^sequenceDiagram\b/i.test(t))return;
    if(m=t.match(/^title\s*:?\s*(.*)$/i)){title=br(m[1]);titleLine=n;byLine[n]={k:'title',raw:m[1]};return}
    if(/^autonumber\b/i.test(t)){items.push({k:'auto',line:n});return}
    if(m=t.match(/^box(?:\s+(.*))?$/i)){
      if(curBox){errors.push({line:n,msg:'box の入れ子は非対応です'});return}
      const arg=(m[1]||'').trim(),b=parseBox(arg);
      curBox={idx:boxes.length,color:b.color,title:b.title,raw:arg,line:n,endLine:null,parts:[]};
      boxes.push(curBox);byLine[n]={k:'pbox',raw:arg};return}
    if(m=t.match(/^create\s+(participant|actor)\s+(\S+?)(?:\s+as\s+(.+))?$/i)){
      const p=part(m[2],m[3]!=null?br(m[3]):null,m[1].toLowerCase(),n);
      p.created=true;
      if(m[3]!=null){if(p.line===n)byLine[n].raw=m[3]}else if(p.line===n)byLine[n].raw=m[2];
      items.push({k:'create',p,line:n});return}
    if(m=t.match(/^(participant|actor)\s+(\S+?)(?:\s+as\s+(.+))?$/i)){
      const p=part(m[2],m[3]!=null?br(m[3]):null,m[1].toLowerCase(),n);
      if(curBox&&p.box==null){p.box=curBox.idx;curBox.parts.push(p)}
      if(m[3]!=null){if(p.line===n)byLine[n].raw=m[3]}else if(p.line===n)byLine[n].raw=m[2];
      return}
    if(m=t.match(/^destroy\s+(\S+)$/i)){
      const p=part(m[1]);p.destroyed=true;
      items.push({k:'destroy',p,line:n});byLine[n]={k:'destroy'};return}
    if(m=t.match(/^note\s+(left of|right of|over)\s+([^:]+?)\s*:\s*(.*)$/i)){
      const ps=m[2].split(',').map(s=>part(s.trim()));
      const it={k:'note',pos:m[1].toLowerCase(),ps,raw:m[3],text:br(m[3]),line:n};
      items.push(it);byLine[n]={k:'note',raw:m[3]};return}
    if(m=t.match(/^(activate|deactivate)\s+(\S+)$/i)){
      items.push({k:'act',on:m[1].toLowerCase()==='activate',p:part(m[2]),line:n});byLine[n]={k:'act'};return}
    if(m=t.match(/^(loop|alt|opt|par|critical|break|rect)\b\s*(.*)$/i)){
      const bt=m[1].toLowerCase();depth++;bstack.push(bt);items.push({k:'bstart',type:bt,raw:m[2],text:br(m[2]),line:n});byLine[n]={k:'block',raw:m[2]};return}
    if(m=t.match(/^(else|and|option)\b\s*(.*)$/i)){
      const sep=m[1].toLowerCase(),cur=bstack[bstack.length-1],want=sep==='else'?'alt':sep==='and'?'par':'critical';
      if(cur!==want){errors.push({line:n,msg:`${sep} は ${want} ブロック内でのみ使用できます`});return}
      items.push({k:'bsep',type:sep,raw:m[2],text:br(m[2]),line:n});byLine[n]={k:'block',raw:m[2]};return}
    if(/^end$/i.test(t)){
      if(depth>0){depth--;bstack.pop();items.push({k:'bend',line:n});byLine[n]={k:'end'}}
      else if(curBox){curBox.endLine=n;byLine[n]={k:'pboxend'};curBox=null}
      else errors.push({line:n,msg:'対応するブロックが無い end'});
      return}
    if(m=t.match(MSG)){
      const f=part(m[1].trim()),to=part(m[4]);
      const raw=m[5]||'';
      items.push({k:'msg',f,t:to,arrow:m[2],act:m[3],raw,text:br(raw),line:n});byLine[n]={k:'msg',raw};return}
    errors.push({line:n,msg:'解釈できない行: '+t.slice(0,30)});
  });
  parts.sort((a,b)=>(a.line??Infinity)-(b.line??Infinity)||a.idx-b.idx);
  parts.forEach((p,i)=>p.idx=i);
  if(depth>0)errors.push({line:L.length-1,msg:'end が不足 ('+depth+')'});
  if(curBox)errors.push({line:L.length-1,msg:'box の end が不足'});
  return {items,parts,boxes,errors,title,titleLine,byLine,nLines:L.length};
}

/* ---------- layout / svg ---------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function layout(m){
  const P=m.parts,n=P.length,LHT=16;
  const lines=s=>String(s).split('\n');
  const tw=s=>Math.max(0,...lines(s).map(l=>ctx.measureText(l).width));
  if(!n)return null;
  const BH=Math.max(38,...P.map(p=>lines(p.label).length*LHT+22));
  const bw=P.map(p=>Math.max(84,tw(p.label)+(p.type==='actor'?46:28)));
  const gap=[];
  for(let i=0;i<n-1;i++){
    const diffBox=P[i].box!==P[i+1].box;
    gap.push((bw[i]+bw[i+1])/2+24+(diffBox?18:0));
  }
  let leftX=0,rightX=0;
  const x=[30+leftX+bw[0]/2];for(let i=1;i<n;i++)x.push(x[i-1]+gap[i-1]);
  const W=x[n-1]+bw[n-1]/2+30+rightX;
  const hasBox=m.boxes.some(b=>b.parts.length);
  const boxHeaderH=hasBox?(Math.max(1,...m.boxes.filter(b=>b.parts.length).map(b=>b.title?lines(b.title).length:1))*LHT+10):0;
  const top=(m.title?40:12)+boxHeaderH;
  let cursor=top+BH+22;
  const bg=[],life=[],bars=[],fg=[],ys=[];
  let minL=0,maxR=W;
  const act=P.map(()=>[]);
  const createY=P.map(()=>null), destroyY=P.map(()=>null);
  const stack=[];
  let num=0,auto=false;
  const closeBar=(i,y)=>{const s=act[i].pop();if(s)bars.push({i,level:act[i].length+1,y0:s.y0,y1:y,line:s.line})};
  const touch=(a,b)=>{for(const s of stack){s.minX=Math.min(s.minX,a);s.maxX=Math.max(s.maxX,b)}};
  const edge=(i,l,side)=>l===0?x[i]:side>0?x[i]+5+(l-1)*5:x[i]-5;
  const al=(txt,cx)=>lines(txt).length>1?`x="${cx-tw(txt)/2}" text-anchor="start"`:`x="${cx}" text-anchor="middle"`;
  const textLines=(txt,cx,yBottom,anchor)=>anchor==='middle'?lines(txt).map((l,i,a)=>`<text class="t" ${al(txt,cx)} y="${yBottom-(a.length-1-i)*LHT}">${esc(l)}</text>`).join(''):lines(txt).map((l,i,a)=>`<text class="t" x="${cx}" y="${yBottom-(a.length-1-i)*LHT}" text-anchor="${anchor}">${esc(l)}</text>`).join('');
  const dL=x[0]-bw[0]/2,dR=x[n-1]+bw[n-1]/2,maxW=Math.max(40,dR-dL);
  const wrapTxt=s=>lines(s).flatMap(l=>{
    if(ctx.measureText(l).width<=maxW)return [l];
    const out=[];let cur='';
    for(const ch of l){
      if(cur&&ctx.measureText(cur+ch).width>maxW){out.push(cur);cur=ch}
      else cur+=ch;
    }
    if(cur)out.push(cur);
    return out;
  }).join('\n');
  const formatMsgText=(it)=>wrapTxt(it.text);
  const drawMsg=(it,customY,createdIdx)=>{
    const a=it.f.idx,b=it.t.idx;
    const stepNum=auto?++num:null;
    const numBadge=(bx,by)=>stepNum!=null?`<g pointer-events="none"><circle class="nb" cx="${bx}" cy="${by}" r="7.5"/><text class="nbt" x="${bx}" y="${by+3.5}" text-anchor="middle">${stepNum}</text></g>`:'';
    const txt=formatMsgText(it),Ln=lines(txt).length;
    const bi=it.arrow.startsWith('<<')&&it.arrow.endsWith('>>');
    const rev=!bi&&(/^[<(]/.test(it.arrow));
    const dash=it.arrow.includes('--');
    let mk='';
    if(bi)mk='url(#mF)';
    else if(rev)mk=it.arrow.startsWith('(')?'url(#mO)':'url(#mF)';
    else{const kind=it.arrow.replace(/^--?/,'');mk=kind==='>>'?'url(#mF)':kind==='x'?'url(#mX)':kind===')'?'url(#mO)':''}
    const ms=bi?' marker-start="url(#mF)"':'';
    const cls='msg'+(dash?' dash':'');
    if(it.act==='+')act[b].push({y0:0,line:it.line});
    const lvS=act[a].length,lvT=act[b].length;
    let y,g;
    const clampCX=(c,w)=>w>=dR-dL?(dL+dR)/2:Math.max(dL+w/2,Math.min(dR-w/2,c));
    if(a===b){
      y=customY!=null?customY:cursor+Ln*LHT+4;
      if(it.act==='+')act[b][act[b].length-1].y0=y;
      if(rev){
        const x1=edge(a,lvT,-1),w=tw(txt),cx=clampCX(x1-18,w),hw=w/2+4;
        const d=`M${x1} ${y}H${x1-32}A4 4 0 0 0 ${x1-36} ${y+4}V${y+6}A4 4 0 0 0 ${x1-32} ${y+10}`;
        g=`<g class="el" data-kind="msg" data-self="-1" data-x1="${x1}" data-x2="${x1-36}" data-line="${it.line}"><path class="${cls}" d="${d}H${x1-2}" marker-end="${mk}"${ms}/>`+
          `<path class="hit" d="${d}H${x1}" fill="none" stroke="transparent" stroke-width="14"/>`+
          numBadge(x1,y)+`<circle class="mh" data-end="from" cx="${x1}" cy="${y}" r="5"/><circle class="mh" data-end="to" cx="${x1-2}" cy="${y+10}" r="5"/>`+
          textLines(txt,cx,y-5,'middle')+`</g>`;
        touch(x1-36,x1);minL=Math.min(minL,x1-36,cx-hw);maxR=Math.max(maxR,cx+hw);
      }else{
        const x1=edge(a,lvT,1),w=tw(txt),cx=clampCX(x1+18,w),hw=w/2+4;
        const d=`M${x1} ${y}H${x1+32}A4 4 0 0 1 ${x1+36} ${y+4}V${y+6}A4 4 0 0 1 ${x1+32} ${y+10}`;
        g=`<g class="el" data-kind="msg" data-self="1" data-x1="${x1}" data-x2="${x1+36}" data-line="${it.line}"><path class="${cls}" d="${d}H${x1+2}" marker-end="${mk}"${ms}/>`+
          `<path class="hit" d="${d}H${x1}" fill="none" stroke="transparent" stroke-width="14"/>`+
          numBadge(x1,y)+`<circle class="mh" data-end="from" cx="${x1}" cy="${y}" r="5"/><circle class="mh" data-end="to" cx="${x1+2}" cy="${y+10}" r="5"/>`+
          textLines(txt,cx,y-5,'middle')+`</g>`;
        touch(x1,x1+36);minL=Math.min(minL,cx-hw);maxR=Math.max(maxR,x1+36,cx+hw);
      }
      if(it.act==='-')closeBar(a,y+5);
      cursor=Math.max(cursor,y+16);
    }else{
      y=customY!=null?customY:cursor+Ln*LHT+4;
      if(it.act==='+')act[b][act[b].length-1].y0=createdIdx===b?y+BH/2:y;
      const src=rev?b:a,dst=rev?a:b,lv1=rev?lvT:lvS,lv2=rev?lvS:lvT;
      const dir=dst>src?1:-1;
      const x1=createdIdx===src?x[src]+dir*(bw[src]/2):edge(src,lv1,dir);
      const x2=createdIdx===dst?x[dst]-dir*(bw[dst]/2):edge(dst,lv2,-dir);
      const w=tw(txt),cx=clampCX((x1+x2)/2,w),hw=w/2+4;
      const fx=rev?x2:x1,tx=rev?x1:x2;
      g=`<g class="el" data-kind="msg" data-x1="${fx}" data-x2="${tx}" data-line="${it.line}"><line class="${cls}" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" marker-end="${mk}"${ms}/>`+
        `<line class="hit" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="transparent" stroke-width="14"/>`+
        numBadge(fx,y)+`<circle class="mh" data-end="from" cx="${fx}" cy="${y}" r="5"/><circle class="mh" data-end="to" cx="${tx}" cy="${y}" r="5"/>`+
        textLines(txt,cx,y-5,'middle')+`</g>`;
      {const l=Math.min(x1,x2,cx-hw),r=Math.max(x1,x2,cx+hw);touch(Math.min(x1,x2),Math.max(x1,x2));minL=Math.min(minL,l);maxR=Math.max(maxR,r)}
      if(it.act==='-')closeBar(a,y);
      cursor=Math.max(cursor,y+10);
    }
    fg.push(g);
    return y;
  };
  const closeBlock=(y,b)=>{
    const pad=18+10*b.inner,inner=b.inner;
    if(b.minX===Infinity){b.minX=x[0];b.maxX=x[n-1]}
    const x0=b.minX-pad,x1=b.maxX+pad,w=x1-x0;
    minL=Math.min(minL,x0);maxR=Math.max(maxR,x1);
    const tabW=tw(b.type)+20;
    let s=`<g class="el" data-kind="bstart" data-line="${b.line}"><rect class="blk" x="${x0}" y="${b.y0}" width="${w}" height="${y-b.y0}"/>`+
      `<path class="tab" d="M${x0} ${b.y0}h${tabW}v12l-8 8h${-(tabW-8)}z"/><text class="t" x="${x0+8}" y="${b.y0+14}" font-weight="600">${esc(b.type)}</text>`+
      (b.label?lines('['+b.label+']').map((l,k)=>`<text class="t" x="${x0+tabW+8}" y="${b.y0+15+k*LHT}">${esc(l)}</text>`).join(''):'')+`</g>`;
    if(b.type==='rect'){const col=(b.label||'').replace(/[^\w(),.%\s/-]/g,'')||'transparent';
      const op=/^(?:rgba|hsla)\s*\(/i.test(col)||/\//.test(col)||/^(?:rgb|hsl)\s*\([^,]+,[^,]+,[^,]+,/i.test(col)||/^transparent$/i.test(col)?'1':'.35';
      s=`<g class="el" data-kind="bstart" data-line="${b.line}"><rect class="blk rblk" x="${x0}" y="${b.y0}" width="${w}" height="${y-b.y0}" style="fill:${col};fill-opacity:${op}" pointer-events="none"/>`+
        `<rect x="${x0}" y="${b.y0}" width="${w}" height="${y-b.y0}" fill="none" stroke="transparent" stroke-width="8" pointer-events="stroke"/></g>`}
    for(const sp of b.seps){
      s+=`<g class="el" data-kind="bsep" data-line="${sp.line}"><line class="sep" x1="${x0}" x2="${x1}" y1="${sp.y}" y2="${sp.y}"/>`+
        `<line class="hit" x1="${x0}" x2="${x1}" y1="${sp.y}" y2="${sp.y}" stroke="transparent" stroke-width="12"/>`+
        (sp.label?lines('['+sp.label+']').map((l,k)=>`<text class="t" x="${x0+tabW+8}" y="${sp.y+16+k*LHT}">${esc(l)}</text>`).join(''):'')+`</g>`;
    }
    if(b.endLine!=null)s+=`<g class="el" data-kind="bend" data-line="${b.endLine}"><line class="hit" x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="transparent" stroke-width="10"/></g>`;
    bg.push({depth:b.depth,area:w*(y-b.y0),s});
    return inner;
  };
  for(let idx=0;idx<m.items.length;idx++){
    const it=m.items[idx];
    ys.push({line:it.line,y:cursor});
    if(it.k==='auto'){auto=true;num=0;continue}
    if(it.k==='create'){
      const c=it.p.idx,nx=m.items[idx+1];
      if(nx&&nx.k==='msg'&&(nx.f===it.p||nx.t===it.p)&&nx.f!==nx.t){
        const Ln=lines(formatMsgText(nx,false)).length;
        const msgY=Math.max(cursor+Ln*LHT+4,cursor+4+BH/2),boxY=msgY-BH/2;
        if(createY[c]==null)createY[c]=boxY;
        ys[ys.length-1].y=boxY;
        ys.push({line:nx.line,y:msgY});
        touch(x[c]-bw[c]/2,x[c]+bw[c]/2);minL=Math.min(minL,x[c]-bw[c]/2);maxR=Math.max(maxR,x[c]+bw[c]/2);
        drawMsg(nx,msgY,c);
        cursor=Math.max(cursor,boxY+BH+12);
        idx++;
      }else{
        const boxY=cursor+4;
        if(createY[c]==null)createY[c]=boxY;
        touch(x[c]-bw[c]/2,x[c]+bw[c]/2);minL=Math.min(minL,x[c]-bw[c]/2);maxR=Math.max(maxR,x[c]+bw[c]/2);
        cursor=boxY+BH+14;
      }
      continue;
    }
    if(it.k==='destroy'){
      const c=it.p.idx,nx=m.items[idx+1];
      if(nx&&nx.k==='msg'&&(nx.f===it.p||nx.t===it.p)){
        const my=drawMsg(nx,null,null);
        const dy=Math.max(cursor+6,my+18);
        while(act[c].length)closeBar(c,dy);
        if(destroyY[c]==null)destroyY[c]=dy;
        ys[ys.length-1].y=my;
        ys.push({line:nx.line,y:dy,ay:my});
        touch(x[c]-12,x[c]+12);
        fg.push(`<g class="el" data-kind="destroy" data-line="${it.line}"><circle cx="${x[c]}" cy="${dy}" r="14" fill="transparent"/>`+
          `<path class="destroy" d="M${x[c]-9} ${dy-9}L${x[c]+9} ${dy+9}M${x[c]+9} ${dy-9}L${x[c]-9} ${dy+9}"/></g>`);
        cursor=dy+16;
        idx++;
      }else{
        const dy=cursor+8;
        while(act[c].length)closeBar(c,dy);
        if(destroyY[c]==null)destroyY[c]=dy;
        touch(x[c]-12,x[c]+12);
        fg.push(`<g class="el" data-kind="destroy" data-line="${it.line}"><circle cx="${x[c]}" cy="${dy}" r="14" fill="transparent"/>`+
          `<path class="destroy" d="M${x[c]-9} ${dy-9}L${x[c]+9} ${dy+9}M${x[c]+9} ${dy-9}L${x[c]-9} ${dy+9}"/></g>`);
        cursor=dy+16;
      }
      continue;
    }
    if(it.k==='msg'){
      ys[ys.length-1].ay=drawMsg(it,null,null);
    }else if(it.k==='note'){
      const Ln=lines(it.text).length,W2=Math.max(70,tw(it.text)+24),h=Ln*LHT+10;
      let x0,x1;const i=it.ps[0].idx;
      if(it.pos==='left of'){x1=x[i]-8;x0=x1-W2}
      else if(it.pos==='right of'){x0=x[i]+8;x1=x0+W2}
      else{
        const a=Math.min(...it.ps.map(p=>x[p.idx])),b=Math.max(...it.ps.map(p=>x[p.idx]));
        x0=a-10;x1=b+10;if(x1-x0<W2){const c=(a+b)/2;x0=c-W2/2;x1=c+W2/2}
      }
      const y=cursor+4;
      fg.push(`<g class="el" data-kind="note" data-x0="${x0}" data-x1="${x1}" data-line="${it.line}"><rect class="note" x="${x0}" y="${y}" width="${x1-x0}" height="${h}"/>`+
        lines(it.text).map((l,k)=>`<text class="t" ${al(it.text,(x0+x1)/2)} y="${y+16+k*LHT-2}">${esc(l)}</text>`).join('')+
        `<rect class="nh" x="${x0-5}" y="${y}" width="10" height="${h}"/><rect class="nh" x="${x1-5}" y="${y}" width="10" height="${h}"/></g>`);
      touch(x0,x1);minL=Math.min(minL,x0);maxR=Math.max(maxR,x1);
      cursor=y+h+14;
    }else if(it.k==='act'){
      const i=it.p.idx;
      if(it.on)act[i].push({y0:cursor-4,line:it.line});else closeBar(i,cursor-4);
      cursor+=6;
    }else if(it.k==='bstart'){
      stack.push({depth:stack.length,type:it.type,label:it.text,line:it.line,y0:cursor,minX:Infinity,maxX:-Infinity,inner:0,seps:[]});
      cursor+=it.type==='rect'?6:30+(lines(it.text).length-1)*LHT;
    }else if(it.k==='bsep'){
      const b=stack[stack.length-1];
      if(b){b.seps.push({y:cursor+2,label:it.text,line:it.line});cursor+=28+(lines(it.text).length-1)*LHT}
    }else if(it.k==='bend'){
      const b=stack.pop();
      if(b){b.endLine=it.line;const inner=closeBlock(cursor+2,b);const par=stack[stack.length-1];
        if(par){par.inner=Math.max(par.inner,inner+1);par.minX=Math.min(par.minX,b.minX-(18+10*inner));par.maxX=Math.max(par.maxX,b.maxX+(18+10*inner))}
        cursor+=16}
    }
  }
  while(stack.length){const b=stack.pop();const inner=closeBlock(cursor+2,b);const par=stack[stack.length-1];if(par){par.inner=Math.max(par.inner,inner+1);par.minX=Math.min(par.minX,b.minX-(18+10*inner));par.maxX=Math.max(par.maxX,b.maxX+(18+10*inner))}cursor+=16}
  for(let i=0;i<n;i++)while(act[i].length)closeBar(i,cursor);
  const by=cursor+6,H=by+BH+(hasBox?18:14);
  const C={ink:cv('--ink'),l2:cv('--line-2'),mu:cv('--muted'),ac:cv('--accent'),note:cv('--note'),box:cv('--box'),bar:cv('--bar'),tab:cv('--tab')};
  /* group boxes (box ... end) */
  const pboxBg=[];
  if(hasBox){
    const boxY0=top-boxHeaderH+2,boxY1=by+BH+10;
    for(const b of m.boxes){
      if(!b.parts.length)continue;
      let x0=Math.min(...b.parts.map(p=>x[p.idx]-bw[p.idx]/2))-10;
      let x1=Math.max(...b.parts.map(p=>x[p.idx]+bw[p.idx]/2))+10;
      const twb=b.title?tw(b.title)+24:0;
      if(twb>x1-x0){const pad=(twb-(x1-x0))/2;x0-=pad;x1+=pad}
      minL=Math.min(minL,x0);maxR=Math.max(maxR,x1);
      const col=b.color?b.color.replace(/[^\w(),.%\s/-]/g,''):'';
      const op=col?(/^(?:rgba|hsla)\s*\(/i.test(col)||/\//.test(col)||/^(?:rgb|hsl)\s*\([^,]+,[^,]+,[^,]+,/i.test(col)?'1':/^transparent$/i.test(col)?'0':'.22'):'.45';
      const fill=col?`fill:${col};fill-opacity:${op}`:`fill:${C.box};fill-opacity:.45`;
      pboxBg.push(`<g class="el" data-kind="pbox" data-line="${b.line}">`+
        `<rect class="pbox" x="${x0}" y="${boxY0}" width="${x1-x0}" height="${boxY1-boxY0}" rx="6" style="${fill}" pointer-events="none"/>`+
        `<rect x="${x0}" y="${boxY0}" width="${x1-x0}" height="${boxY1-boxY0}" rx="6" fill="none" stroke="transparent" stroke-width="8" pointer-events="stroke"/>`+
        `<rect x="${x0}" y="${boxY0}" width="${x1-x0}" height="${boxHeaderH}" fill="transparent"/>`+
        (b.title?lines(b.title).map((l,k)=>`<text class="t" x="${(x0+x1)/2}" y="${boxY0+17+k*LHT}" text-anchor="middle" font-weight="600">${esc(l)}</text>`).join(''):'')+
        `</g>`);
    }
  }
  /* lifelines + boxes */
  const boxes=[];
  P.forEach((p,i)=>{
    const topY=createY[i]!=null?createY[i]:top;
    const ly0=topY+BH,ly1=destroyY[i]!=null?Math.max(ly0,destroyY[i]):by;
    if(ly1>ly0){
      life.push(`<line class="life" x1="${x[i]}" y1="${ly0}" x2="${x[i]}" y2="${ly1}"/>`+
        `<rect class="lh" data-i="${i}" x="${x[i]-12}" y="${ly0}" width="24" height="${ly1-ly0}" fill="transparent"/>`);
    }
    const drawY=destroyY[i]!=null?[topY]:[topY,by];
    for(const yy of drawY){
      const ln=p.line!=null?` data-line="${p.line}"`:'';

/* 参加者: ID / 表示名 を別々に編集(null は変更なし)。ID 変更時は参照箇所も置換 */
function setPart(n,id,label){
  const p=model.parts.find(p=>p.line===n);if(!p)return;
  const raw=model.byLine[n].raw;
  id=id==null?p.id:id.trim();
  label=label==null?(raw===p.id?id:raw):label.trim().replace(/\r?\n/g,'<br/>');
  if(!id||/\s/.test(id)||/[:,;]/.test(id)||/^(end|note|title|loop|alt|opt|par|rect|else|and|box|create|destroy)$/i.test(id)||/-[->x)]|<</.test(id)){flash('⚠ ID に使えない文字/語: '+id);return}
  if(id!==p.id&&model.parts.some(q=>q.id===id)){flash('⚠ ID 重複: '+id);return}
  const L=getL(),sw=x=>x===p.id?id:x;
  if(id!==p.id)L.forEach((l,i)=>{
    const k=model.byLine[i]&&model.byLine[i].k;let o;
    if(k==='msg'&&(o=msgP(l))){if(o.f===p.id||o.t===p.id){o.f=sw(o.f);o.t=sw(o.t);L[i]=msgS(o)}}

/* move lines a..b to the position indicated by y */
function dropTarget(y,a,b){return geo.ys.find(o=>o.y>y&&(o.line<a||o.line>b))}

/* rebuild participant declarations in the given order (preserving box...end and create) */
function reorderParts(L,from,to){
  const hasTop=p=>{const cr=model.items.find(it=>it.k==='create'&&it.p===p);return !p.created||(cr&&p.line!=null&&p.line!==cr.line)};
  const fp=model.parts[from];
  if(fp&&!hasTop(fp)){flash('⚠ 途中生成 (create) の参加者は、出現行の上下移動で順序が決まります');return null}
  const hp=model.parts.filter(hasTop);
  const fi=hp.indexOf(fp);if(fi<0)return null;
  const ti=model.parts.filter((p,idx)=>hasTop(p)&&idx!==from&&(idx<to||(to>from&&idx===to))).length;
  const isDecl=l=>/^\s*(participant|actor)\s+\S/i.test(l);
  const boxKill=new Set();
  model.boxes.forEach(b=>{boxKill.add(b.line);if(b.endLine!=null)boxKill.add(b.endLine)});
  let pos=-1,ind=topIndent(L);
  L.forEach((l,i)=>{if(pos<0&&(isDecl(l)||boxKill.has(i))){pos=i;ind=indentOf(l)}});
  if(pos<0){
    let h=L.findIndex(l=>/^\s*sequenceDiagram\b/i.test(l));
    for(let i=h+1;i<L.length&&/^\s*(title|autonumber|%%)/i.test(L[i]);i++)h=i;
    pos=h+1;
  }
  const items=hp.map(p=>({p,box:p.box!=null?model.boxes[p.box]:null,line:p.line!=null?L[p.line].trim():'participant '+p.id}));
  const [mv]=items.splice(fi,1);items.splice(ti,0,mv);
  if(mv.box&&mv.box.parts.length>1){
    const prev=items[ti-1],next=items[ti+1];
    if((!prev||prev.box!==mv.box)&&(!next||next.box!==mv.box))mv.box=null;

  if(!mv.box&&ti>0&&ti<items.length-1&&items[ti-1].box&&items[ti-1].box===items[ti+1].box)mv.box=items[ti-1].box;

    ins.push(ind+L[b.line].trim());

function parseColRGBA(col,kind){

  }
  if(/^transparent$/i.test(col))return {r:59,g:130,b:246,a:0,css:'transparent'};
  colProbe.style.color='';colProbe.style.color=col;
  if(!colProbe.style.color)return {r:59,g:130,b:246,a:defA,css:`rgba(59, 130, 246, ${defA})`};
  const m=getComputedStyle(colProbe).color.match(/rgba?\(\s*(\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);

function mapOffset(a,b,pos){
  let p=0,la=a.length,lb=b.length;
  while(p<la&&p<lb&&a.charCodeAt(p)===b.charCodeAt(p))p++;
  if(pos<=p)return pos;
  let q=0;
  while(q<la-p&&q<lb-p&&a.charCodeAt(la-1-q)===b.charCodeAt(lb-1-q))q++;
  if(pos>=la-q)return pos+(lb-la);

}

      let best=-1,bd=1e9;
      for(let i=0;i<nl.length;i++)if(nl[i]===oldSelText){const dist=Math.abs(i-oldSel);if(dist<bd){bd=dist;best=i}}
      sel=best>=0?best:Math.min(oldSel,Math.max(0,nl.length-1));
    }
  }
  const n0=mapOffset(oldBody,newBody,s0),n1=mapOffset(oldBody,newBody,s1);
  update();fillBlocks(d);
  try{ta.setSelectionRange(n0,n1,sDir)}catch(e){ta.selectionStart=n0;ta.selectionEnd=n1}
  ta.scrollTop=taST;ta.scrollLeft=taSL;lnScroll();
  stage.scrollLeft=stSL;stage.scrollTop=stST;
  flash('外部変更を反映: '+(doc.name||''));
}
async function checkFileUpdate(){
  if(!doc.handle||checkingFile||editEl)return;
  checkingFile=true;
  try{
    if(doc.handle.queryPermission){
      const p=await doc.handle.queryPermission({mode:'read'});
      if(p!==doc.perm){doc.perm=p;showName()}
      if(p!=='granted')return;
    }
    const f=await doc.handle.getFile();
    if(doc.mtime&&f.lastModified===doc.mtime&&f.size===doc.size)return;
    doc.mtime=f.lastModified;doc.size=f.size;
    const cur=await f.text();
    if(doc.orig!=null&&cur===doc.orig)return;
    if(savedSrc!=null&&ta.value!==savedSrc){
      if(cur!==doc.lastPrompted){doc.lastPrompted=cur;flash('⚠ 外部で更新されました(未保存変更があるため自動再読込を保留)')}
      return;
    }
    reloadFromExternal(cur);
  }catch(e){}finally{checkingFile=false}
}
setInterval(()=>{if(!document.hidden)checkFileUpdate()},1500);
addEventListener('focus',checkFileUpdate);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkFileUpdate()});

/* ---------- persistence ---------- */
let saveT=null,packSeq=0;
async function pack(t){
  const b=new Uint8Array(await new Response(new Blob([t]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
  let bin='';for(let i=0;i<b.length;i++)bin+=String.fromCharCode(b[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function unpack(z){
  const bin=atob(z.replace(/-/g,'+').replace(/_/g,'/')),u=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
}
function setHash(){
  const t=ta.value,plain=()=>{try{history.replaceState(null,'','#src='+encodeURIComponent(t))}catch(e){}};
  if(!window.CompressionStream)return plain();
  const q=++packSeq;pack(t).then(z=>{if(q===packSeq)history.replaceState(null,'','#z='+z)}).catch(plain);
}
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    setHash();
    try{localStorage.setItem('seqedit.src',ta.value);localStorage.setItem('seqedit.doc',JSON.stringify({pre:doc.pre,post:doc.post,name:doc.name,crlf:doc.crlf,md:doc.md,idx:doc.idx,saved:savedSrc}))}catch(e){}
  },300);
}
function update(){
  const blk=computeBlk();
  model=parse(blk?blk.L.join('\n'):ta.value);
  if(pendingSel!==null){sel=pendingSel;pendingSel=null}
  if(sel!=null&&!model.byLine[sel])sel=null;
  render();status();showName();save();$('#cAuto').checked=model.items.some(i=>i.k==='auto');
  if(pendingEdit!==null){const l=pendingEdit;pendingEdit=null;if(model.byLine[l])startEdit(l)}
}
(async function init(){
  let src=null;
  const h=location.hash.match(/^#(src|z)=(.*)$/);
  if(h){try{src=h[1]==='z'?await unpack(h[2]):decodeURIComponent(h[2])}catch(e){}}
  let ls=null;try{ls=localStorage.getItem('seqedit.src')}catch(e){}
  if(ls&&/^\s*sequenceDiagram\s+title 注文フロー\b/.test(ls))ls=null;
  if(src==null)src=ls;
  if(src!=null&&src===ls){try{const d=JSON.parse(localStorage.getItem('seqedit.doc')||'null');if(d){doc={...doc,pre:d.pre,post:d.post,name:d.name,crlf:d.crlf,md:d.md,idx:d.idx|0};savedSrc=d.saved}}catch(e){}}
  ta.value=src||SAMPLE;update();refreshBlocks();
  if(doc.name&&!doc.handle){const d0=doc;try{const h=await idb('readonly',st=>st.get('handle'));if(h&&h.name===d0.name&&doc===d0){doc.handle=h;showName();checkFileUpdate()}}catch(e){}}
})();
</script>
