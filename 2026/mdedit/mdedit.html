function tRowInsert(ctx, after){
  const table = ctx.table;
  const cols = table.querySelector("tr").children.length;
  let tbody = table.querySelector("tbody");
  if(!tbody){ tbody = document.createElement("tbody"); table.appendChild(tbody); }
  const tr = document.createElement("tr");
  for(let k = 0; k < cols; k++){ const td = document.createElement("td"); td.innerHTML = "<br>"; tr.appendChild(td); }
  if(ctx.isHeader){
    if(!after) return null;                    // ヘッダーの上には挿入できない
    tbody.insertBefore(tr, tbody.firstChild);
  }else{
    ctx.row.parentElement.insertBefore(tr, after ? ctx.row.nextSibling : ctx.row);
  }
  return tr;
}
function tRowDelete(ctx){
  if(ctx.isHeader) return false;                // ヘッダー行は削除不可
  ctx.row.remove();
  return true;
}
function tColInsert(ctx, after){
  const idx = ctx.colIndex + (after ? 1 : 0);
  tRows(ctx.table).forEach(tr => {
    const isHead = tr.parentElement.nodeName === "THEAD";
    const cell = document.createElement(isHead ? "th" : "td");
    cell.innerHTML = "<br>";
    tr.insertBefore(cell, tr.children[idx] || null);
  });
}
function tColDelete(ctx){
  const headRow = ctx.table.querySelector("tr");
  if(headRow.children.length <= 1) return false; // 最後の1列は削除不可
  const idx = ctx.colIndex;
  tRows(ctx.table).forEach(tr => { if(tr.children[idx]) tr.children[idx].remove(); });
  return true;
}
/* --- 選択中の行/列に対するまとめ操作 --- */
function tColsDelete(table, idxs){
  const headRow = table.querySelector("tr");
  if(!idxs.length || headRow.children.length - idxs.length < 1) return false;
  idxs.slice().sort((a, b) => b - a)
    .forEach(i => tRows(table).forEach(tr => { if(tr.children[i]) tr.children[i].remove(); }));
  return true;
}
function tRowsInsert(table, rows, after){
  const tbody = table.querySelector("tbody");
  if(!tbody || !rows.length) return false;
  const cols = table.querySelector("tr").children.length;
  const all = Array.from(tbody.children);
  const sorted = rows.slice().sort((a, b) => all.indexOf(a) - all.indexOf(b));
  const ref = after ? sorted[sorted.length - 1].nextSibling : sorted[0];
  for(let n = 0; n < rows.length; n++){          // 選択と同じ本数を挿入
    const tr = document.createElement("tr");
    for(let k = 0; k < cols; k++){ const td = document.createElement("td"); td.innerHTML = "<br>"; tr.appendChild(td); }
    tbody.insertBefore(tr, ref);
  }
  return true;
}
function tColsInsert(table, idxs, after){
  if(!idxs.length) return false;
  const at = after ? Math.max.apply(null, idxs) + 1 : Math.min.apply(null, idxs);
  for(let n = 0; n < idxs.length; n++){           // 選択と同じ列数を挿入
    tRows(table).forEach(tr => {
      const cell = document.createElement(tr.parentElement.nodeName === "THEAD" ? "th" : "td");
      cell.innerHTML = "<br>";
      tr.insertBefore(cell, tr.children[at] || null);
    });
  }
  return true;
}

/* --- 行/列/セル の選択状態（3種類は互いに排他） --- */
function tselClear(){
  if(tsel.table) tsel.table.querySelectorAll(".tcell-sel").forEach(c => c.classList.remove("tcell-sel", "tcell-selcell"));
  tsel = { table: null, rows: new Set(), cols: new Set(), cells: new Set() };
}
function tselPaint(){
  const t = tsel.table;
  if(!t) return;
  t.querySelectorAll(".tcell-sel").forEach(c => c.classList.remove("tcell-sel", "tcell-selcell"));
  tsel.rows.forEach(tr => { if(tr.isConnected) Array.from(tr.children).forEach(c => c.classList.add("tcell-sel")); });
  tsel.cols.forEach(i => tRows(t).forEach(tr => { if(tr.children[i]) tr.children[i].classList.add("tcell-sel"); }));
  tsel.cells.forEach(c => { if(c.isConnected) c.classList.add("tcell-sel", "tcell-selcell"); });
}
const tselRows = table => tsel.table === table ? Array.from(tsel.rows).filter(r => r.isConnected) : [];
const tselCols = table => tsel.table === table ? Array.from(tsel.cols).sort((a, b) => a - b) : [];
const tselCells = table => tsel.table === table ? Array.from(tsel.cells).filter(c => c.isConnected) : [];
function tselToggle(table, kind, key){
  if(tsel.table !== table) tselClear();
  tsel.table = table;
  const set = kind === "row" ? tsel.rows : tsel.cols;
  (kind === "row" ? tsel.cols : tsel.rows).clear();   // 行選択と列選択は排他
  tsel.cells.clear();
  if(set.has(key)) set.delete(key); else set.add(key);
  if(!tsel.rows.size && !tsel.cols.size) tselClear(); else tselPaint();
}
/* --- セル単位の選択（Ctrl+クリック / Ctrl+ドラッグ、スプレッドシート風の矩形選択） --- */
function tCellPos(table, cell){
  const row = cell.closest("tr");
  const rows = Array.from(table.querySelectorAll("tr"));
  return { r: rows.indexOf(row), c: Array.from(row.children).indexOf(cell) };
}
function tCellsInRect(table, a, b){
  const rows = Array.from(table.querySelectorAll("tr"));
  const r0 = Math.min(a.r, b.r), r1 = Math.max(a.r, b.r);
  const c0 = Math.min(a.c, b.c), c1 = Math.max(a.c, b.c);
  const out = [];
  for(let r = r0; r <= r1; r++){
    const cells = Array.from(rows[r].children);
    for(let c = c0; c <= c1; c++) if(cells[c]) out.push(cells[c]);
  }
  return out;
}
function tCellSelectRect(table, anchorCell, throughCell){
  if(tsel.table !== table){ tselClear(); tsel.table = table; }
  tsel.rows.clear(); tsel.cols.clear();               // 行/列選択とは排他
  tsel.cells = new Set(tCellsInRect(table, tCellPos(table, anchorCell), tCellPos(table, throughCell)));
  tselPaint();
  getSelection().removeAllRanges();                  // セル選択中はテキストキャレットを表示しない
}
function tCellsClearContent(cells){
  cells.forEach(c => { c.innerHTML = "<br>"; });
}

/* 選択済みセルをドラッグで移動、Ctrl+ドラッグでコピー（移動先の内容は失われる） */
function tCellMoveOrCopy(e, table, startCell, copy){
  const startPos = tCellPos(table, startCell);
  const sourceCells = tselCells(table);
  const sourcePositions = sourceCells.map(c => tCellPos(table, c));
  const sourceHTML = sourceCells.map(c => c.innerHTML);
  let delta = { r: 0, c: 0 };

  function destCellsAt(d){
    const rows = Array.from(table.querySelectorAll("tr"));
    return sourcePositions.map(p => {
      const row = rows[p.r + d.r];
      return row ? (row.children[p.c + d.c] || null) : null;
    });
  }
  const move = ev => {
    const overCell = ev.target.closest ? ev.target.closest("td,th") : null;
    if(!overCell || overCell.closest("table") !== table) return;
    const overPos = tCellPos(table, overCell);
    delta = { r: overPos.r - startPos.r, c: overPos.c - startPos.c };
  };
  const up = () => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    const dest = destCellsAt(delta);
    if(dest.length && dest.every(c => c)){
      dest.forEach((dc, i) => { dc.innerHTML = sourceHTML[i]; });
      if(!copy){
        const destSet = new Set(dest);
        sourceCells.forEach(sc => { if(!destSet.has(sc)) sc.innerHTML = "<br>"; });
      }
      tsel.cells = new Set(dest);
      tselPaint();
      syncFromPreview();
    }
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
}

let cdrag = null;                    // Ctrl+ドラッグでのセル範囲選択
mdEl.addEventListener("mousedown", e => {
  if(!previewEdit) return;
  const cell = e.target.closest ? e.target.closest("td,th") : null;
  const table = e.target.closest ? e.target.closest("table") : null;
  if(!cell || !table) return;

  if(tsel.table === table && tsel.cells.has(cell)){
    // 既に選択済みのセルをつかんだ場合: 移動（Ctrl併用でコピー）
    e.preventDefault();
    tCellMoveOrCopy(e, table, cell, e.ctrlKey);
    return;
  }
  if(!e.ctrlKey) return;              // 未選択セルへの素クリックは通常のキャレット配置

  e.preventDefault();                // 通常のキャレット配置より選択を優先
  cdrag = { table, anchor: cell };
  tCellSelectRect(table, cell, cell);
  const move = ev => {
    if(!cdrag) return;
    const c = ev.target.closest ? ev.target.closest("td,th") : null;
    if(c && c.closest("table") === cdrag.table) tCellSelectRect(cdrag.table, cdrag.anchor, c);
  };
  const up = () => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    cdrag = null;
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
});

/* --- 選択マーカー（表の上端＝列、左端＝行）／ドラッグで移動 --- */
let tmarkTable = null;
function tmarksHide(){ tmarks.hidden = true; tmarks.innerHTML = ""; tdrop.hidden = true; tmarkTable = null; }
function tmarkEl(table, kind, key, box, on){
  const b = document.createElement("button");
  b.type = "button";
  b.className = "tmark" + (on ? " on" : "");
  b.style.cssText = "left:" + box.left + "px; top:" + box.top + "px; width:" + box.width + "px; height:" + box.height + "px";
  b.title = (kind === "row" ? "行" : "列") + "を選択 / 解除（ドラッグで移動）";
  b.addEventListener("mousedown", e => e.preventDefault());     // 編集中のキャレットを保持
  b.addEventListener("pointerdown", e => tdragStart(e, b, table, kind, key));
  return b;
}
const TMARK = 18;                 // ハンドルの太さ
const TGAP = 3;                   // 表との隙間
function tmarksShow(table){
  const headRow = table.querySelector("tr");
  if(!headRow) return;
  const tRect = table.getBoundingClientRect();
  tmarks.innerHTML = "";
  Array.from(headRow.children).forEach((cell, idx) => {
    const r = cell.getBoundingClientRect();
    tmarks.appendChild(tmarkEl(table, "col", idx,
      { left: r.left, top: tRect.top - TMARK - TGAP, width: r.width, height: TMARK },
      tsel.table === table && tsel.cols.has(idx)));
  });
  Array.from(table.querySelectorAll("tbody > tr")).forEach(tr => {
    const r = tr.getBoundingClientRect();
    tmarks.appendChild(tmarkEl(table, "row", tr,
      { left: tRect.left - TMARK - TGAP, top: r.top, width: TMARK, height: r.height },
      tsel.table === table && tsel.rows.has(tr)));
  });
  tmarkTable = table;
  tmarks.hidden = false;
}

function tdragClearPreview(table){
  if(!table) return;
  table.querySelectorAll("th, td").forEach(c => {
    c.style.transform = "";
    c.style.transition = "";
    c.style.position = "";
    c.style.zIndex = "";
    c.style.boxShadow = "";
    c.classList.remove("tcell-dragging");
  });
}

function tdragLivePreview(table, kind, key, to){
  if(kind === "col"){
    const headCells = Array.from(table.querySelector("tr").children);
    const N = headCells.length;
    if(!N) return;
    const colWidths = headCells.map(c => c.getBoundingClientRect().width);
    const sel = tselCols(table);
    const moving = (sel.indexOf(key) >= 0 ? sel : [key]).slice().sort((a, b) => a - b);
    const movingSet = new Set(moving);
    const W_moving = moving.reduce((acc, m) => acc + (colWidths[m] || 0), 0);

    const xOrig = [];
    let accX = 0;
    for(let i = 0; i < N; i++){
      xOrig[i] = accX;
      accX += colWidths[i];
    }

    const dX = [];
    for(let i = 0; i < N; i++){
      let xNew;
      if(movingSet.has(i)){
        let sumBefore = 0;
        for(let k = 0; k < to; k++){
          if(!movingSet.has(k)) sumBefore += colWidths[k];
        }
        let sumMovingBefore = 0;
        for(const m of moving){
          if(m < i) sumMovingBefore += colWidths[m];
        }
        xNew = sumBefore + sumMovingBefore;
      }else{
        let sumBefore = 0;
        for(let k = 0; k < i; k++){
          if(!movingSet.has(k)) sumBefore += colWidths[k];
        }
        xNew = sumBefore + (i >= to ? W_moving : 0);
      }
      dX[i] = xNew - xOrig[i];
    }

    tRows(table).forEach(tr => {
      Array.from(tr.children).forEach((cell, i) => {
        cell.style.position = "relative";
        cell.style.transition = "transform 0.18s cubic-bezier(0.2, 0, 0, 1)";
        cell.style.transform = "translateX(" + dX[i] + "px)";
        if(movingSet.has(i)){
          cell.style.zIndex = "5";
          cell.classList.add("tcell-dragging");
        }else{
          cell.style.zIndex = "1";
          cell.classList.remove("tcell-dragging");
        }
      });
    });
  }else{
    const tbodyRows = Array.from(table.querySelectorAll("tbody > tr"));
    const M = tbodyRows.length;
    if(!M) return;
    const rowHeights = tbodyRows.map(r => r.getBoundingClientRect().height);
    const sel = tselRows(table);
    const movingRows = sel.indexOf(key) >= 0
      ? sel.slice().sort((a, b) => tbodyRows.indexOf(a) - tbodyRows.indexOf(b))
      : [key];
    const movingIndices = movingRows.map(r => typeof r === "number" ? r : tbodyRows.indexOf(r)).filter(idx => idx >= 0);
    const movingSet = new Set(movingIndices);
    const H_moving = movingIndices.reduce((acc, m) => acc + (rowHeights[m] || 0), 0);

    const yOrig = [];
    let accY = 0;
    for(let j = 0; j < M; j++){
      yOrig[j] = accY;
      accY += rowHeights[j];
    }

    const dY = [];
    for(let j = 0; j < M; j++){
      let yNew;
      if(movingSet.has(j)){
        let sumBefore = 0;
        for(let k = 0; k < to; k++){
          if(!movingSet.has(k)) sumBefore += rowHeights[k];
        }
        let sumMovingBefore = 0;
        for(const m of movingIndices){
          if(m < j) sumMovingBefore += rowHeights[m];
        }
        yNew = sumBefore + sumMovingBefore;
      }else{
        let sumBefore = 0;
        for(let k = 0; k < j; k++){
          if(!movingSet.has(k)) sumBefore += rowHeights[k];
        }
        yNew = sumBefore + (j >= to ? H_moving : 0);
      }
      dY[j] = yNew - yOrig[j];
    }

    tbodyRows.forEach((tr, j) => {
      Array.from(tr.children).forEach(cell => {
        cell.style.position = "relative";
        cell.style.transition = "transform 0.18s cubic-bezier(0.2, 0, 0, 1)";
        cell.style.transform = "translateY(" + dY[j] + "px)";
        if(movingSet.has(j)){
          cell.style.zIndex = "5";
          cell.classList.add("tcell-dragging");
        }else{
          cell.style.zIndex = "1";
          cell.classList.remove("tcell-dragging");
        }
      });
    });
  }
}

let tdrag = null;
function tdragStart(e, el, table, kind, key){
  e.preventDefault();
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  tdrag = { el, table, kind, key, x0: e.clientX, y0: e.clientY, moved: false, to: null };
  const move = ev => tdragMove(ev);
  const up = ev => {
    el.removeEventListener("pointermove", move);
    el.removeEventListener("pointerup", up);
    try{ el.releasePointerCapture(ev.pointerId); }catch(err){}
    tdragEnd();
  };
  el.addEventListener("pointermove", move);
  el.addEventListener("pointerup", up);
}
function tdragMove(e){
  if(!tdrag) return;
  if(!tdrag.moved){
    if(Math.abs(e.clientX - tdrag.x0) + Math.abs(e.clientY - tdrag.y0) < 5) return;
    tdrag.moved = true;
    tdrag.el.classList.add("dragging");
  }
  const t = tdrag.table, tRect = t.getBoundingClientRect();
  if(tdrag.kind === "col"){
    const cells = Array.from(t.querySelector("tr").children);
    let to = cells.length;
    for(let i = 0; i < cells.length; i++){
      const r = cells[i].getBoundingClientRect();
      if(e.clientX < r.left + r.width / 2){ to = i; break; }
    }
    tdrag.to = to;
    const ref = cells[Math.min(to, cells.length - 1)].getBoundingClientRect();
    const lx = to >= cells.length ? ref.right : ref.left;
    tdrop.style.cssText = "left:" + (lx - 1) + "px; top:" + tRect.top + "px; width:2px; height:" + tRect.height + "px";

    tdragLivePreview(t, "col", tdrag.key, to);
  }else{
    const rows = Array.from(t.querySelectorAll("tbody > tr"));
    let to = rows.length;
    for(let i = 0; i < rows.length; i++){
      const r = rows[i].getBoundingClientRect();
      if(e.clientY < r.top + r.height / 2){ to = i; break; }
    }
    tdrag.to = to;
    const ref = rows[Math.min(to, rows.length - 1)].getBoundingClientRect();
    const ty = to >= rows.length ? ref.bottom : ref.top;
    tdrop.style.cssText = "left:" + tRect.left + "px; top:" + (ty - 1) + "px; width:" + tRect.width + "px; height:2px";

    tdragLivePreview(t, "row", tdrag.key, to);
  }
  tdrop.hidden = false;
}
function tdragEnd(){
  if(!tdrag) return;
  const d = tdrag;
  tdrag = null;
  d.el.classList.remove("dragging");
  tdrop.hidden = true;
  tdragClearPreview(d.table);
  if(!d.moved){                                   // 動かしていなければクリック＝選択トグル
    tselToggle(d.table, d.kind, d.key);
    tmarksShow(d.table);
    return;
  }
  if(d.to === null){ tmarksShow(d.table); return; }
  const ok = d.kind === "col" ? tColDrop(d.table, d.key, d.to) : tRowDrop(d.table, d.key, d.to);
  if(ok){ syncFromPreview(); tselPaint(); }
  tmarksShow(d.table);
}
function tRowDrop(table, tr, toIdx){
  const tbody = table.querySelector("tbody");
  if(!tbody) return false;
  const rows = Array.from(tbody.children);
  const sel = tselRows(table);
  const moving = sel.indexOf(tr) >= 0
    ? sel.slice().sort((a, b) => rows.indexOf(a) - rows.indexOf(b)) : [tr];
  const ref = rows[toIdx] || null;
  if(moving.indexOf(ref) >= 0) return false;      // 選択ブロック内へのドロップは無効
  moving.forEach(r => tbody.insertBefore(r, ref));
  return true;
}
function tColDrop(table, fromIdx, toIdx){
  const sel = tselCols(table);
  const moving = sel.indexOf(fromIdx) >= 0 ? sel : [fromIdx];
  if(moving.indexOf(toIdx) >= 0) return false;
  tRows(table).forEach(tr => {
    const cells = Array.from(tr.children);
    const ref = cells[toIdx] || null;
    moving.forEach(i => { if(cells[i]) tr.insertBefore(cells[i], ref); });
  });
  if(sel.length){                                 // 選択を移動後の位置へ付け替え
    const base = toIdx - moving.filter(i => i < toIdx).length;
    tsel.cols = new Set(moving.map((_, k) => base + k));
  }
  return true;
}

/* マウスが表に乗ったらマーカーを出す（スクロール時は消す） */
addEventListener("mousemove", e => {
  if(tdrag) return;
  if(!previewEdit){ if(!tmarks.hidden) tmarksHide(); return; }
  if(tmarks.contains(e.target)) return;           // マーカー帯の上では維持
  const wrap = e.target.closest ? e.target.closest(".tablewrap") : null;
  const table = wrap && wrap.querySelector("table");
  if(table){ tmarksShow(table); return; }
  // 表の周囲（ハンドル帯＋余裕）に居る間は消さない。
  // ここで消すと、表からハンドルへ手を伸ばす途中で消えてつかめなくなる
  if(!tmarks.hidden && tmarkTable && tmarkTable.isConnected){
    const pad = TMARK + TGAP + 12;
    const r = tmarkTable.getBoundingClientRect();
    if(e.clientX >= r.left - pad && e.clientX <= r.right + pad &&
       e.clientY >= r.top - pad && e.clientY <= r.bottom + pad) return;
  }
  if(!tmarks.hidden) tmarksHide();
});
addEventListener("scroll", () => { if(!tmarks.hidden) tmarksHide(); }, true);
mdEl.addEventListener("pointerdown", e => {
  if(!tsel.table) return;
  const cell = e.target.closest ? e.target.closest("td,th") : null;
  if(cell && tsel.cells.has(cell)) return;    // 選択済みセルの再クリックはドラッグ移動/コピーの開始（mousedown 側で処理）
  tselClear();
  tmarksHide();
});
addEventListener("keydown", e => {
  if(e.key === "Escape"){ tselClear(); tmarksHide(); return; }
  const isCut = tsel.cells.size && e.key.toLowerCase() === "x" && (e.ctrlKey || e.metaKey);
  if(!isCut && (e.key !== "Delete" || (!tsel.rows.size && !tsel.cols.size && !tsel.cells.size))) return;
  e.preventDefault();
  const t = tsel.table;
  if(tsel.rows.size) tselRows(t).forEach(r => r.remove());
  else if(tsel.cols.size) tColsDelete(t, tselCols(t));
  else tCellsClearContent(tselCells(t));           // セル選択の Delete/Ctrl+X は内容クリア（行/列は削除しない）
  tselClear();
  tmarksHide();
  syncFromPreview();
});

const tmenu = $("tmenu");
function tmenuClose(){ tmenu.hidden = true; tmenu.innerHTML = ""; }
function tmenuItem(label, disabled, run){
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  b.disabled = !!disabled;
  b.setAttribute("role", "menuitem");
  if(!disabled) b.addEventListener("click", () => { tmenuClose(); run(); });
  return b;
}
function tmenuSep(){ const d = document.createElement("div"); d.className = "sep"; return d; }
function openTableMenu(x, y, ctx){
  tmenu.innerHTML = "";
  const colCount = ctx.table.querySelector("tr").children.length;
  const selR = tselRows(ctx.table), selC = tselCols(ctx.table);
  const done = () => { tselClear(); tmarksHide(); syncFromPreview(); };

  if(selC.length){                                    // 列を選択中
    tmenu.append(
      tmenuItem("選択した " + selC.length + " 列の左に挿入", false, () => { tColsInsert(ctx.table, selC, false); done(); }),
      tmenuItem("選択した " + selC.length + " 列の右に挿入", false, () => { tColsInsert(ctx.table, selC, true); done(); }),
      tmenuItem("選択した " + selC.length + " 列を削除", colCount - selC.length < 1, () => { tColsDelete(ctx.table, selC); done(); })
    );
  }else if(selR.length){                              // 行を選択中
    tmenu.append(
      tmenuItem("選択した " + selR.length + " 行の上に挿入", false, () => { tRowsInsert(ctx.table, selR, false); done(); }),
      tmenuItem("選択した " + selR.length + " 行の下に挿入", false, () => { tRowsInsert(ctx.table, selR, true); done(); }),
      tmenuItem("選択した " + selR.length + " 行を削除", false, () => { selR.forEach(r => r.remove()); done(); })
    );
  }else{                                              // 選択なし＝右クリックしたセル基準
    tmenu.append(
      tmenuItem("上に行を挿入", ctx.isHeader, () => {
        const tr = tRowInsert(ctx, false); tFocusCell(tr && tr.firstElementChild); syncFromPreview();
      }),
      tmenuItem("下に行を挿入", false, () => {
        const tr = tRowInsert(ctx, true); tFocusCell(tr && tr.firstElementChild); syncFromPreview();
      }),
      tmenuItem("この行を削除", ctx.isHeader, () => {
        const fallback = ctx.row.previousElementSibling || ctx.row.nextElementSibling || ctx.table.querySelector("tr");
        tRowDelete(ctx); tFocusCell(fallback && fallback.children[ctx.colIndex]); syncFromPreview();
      }),
      tmenuSep(),
      tmenuItem("左に列を挿入", false, () => {
        tColInsert(ctx, false); tFocusCell(ctx.row.children[ctx.colIndex]); syncFromPreview();
      }),
      tmenuItem("右に列を挿入", false, () => {
        tColInsert(ctx, true); tFocusCell(ctx.row.children[ctx.colIndex]); syncFromPreview();
      }),
      tmenuItem("この列を削除", colCount <= 1, () => {
        const idx = ctx.colIndex;
        tColDelete(ctx);
        tFocusCell(ctx.row.children[idx] || ctx.row.children[idx - 1]);
        syncFromPreview();
      })
    );
  }
  tmenu.hidden = false;
  const r = tmenu.getBoundingClientRect();
  const mx = Math.min(x, innerWidth - r.width - 8);
  const my = Math.min(y, innerHeight - r.height - 8);
  tmenu.style.left = Math.max(4, mx) + "px";
  tmenu.style.top = Math.max(4, my) + "px";
}
mdEl.addEventListener("contextmenu", e => {
  if(!previewEdit) return;
  const ctx = tableCtxAt(e.target);
  if(!ctx) return;
  e.preventDefault();
  openTableMenu(e.clientX, e.clientY, ctx);
});
addEventListener("pointerdown", e => {
  if(!tmenu.hidden && !tmenu.contains(e.target)) tmenuClose();
});
addEventListener("keydown", e => { if(e.key === "Escape" && !tmenu.hidden) tmenuClose(); });
addEventListener("scroll", tmenuClose, true);

const PACTS = {
  h:      () => { const b = blockAtCaret(); cmd("formatBlock", b === "h2" ? "h3" : b === "h3" ? "p" : "h2"); },
  bold:   () => cmd("bold"),
  italic: () => cmd("italic"),
  strike: () => cmd("strikeThrough"),
  code:   () => cmd("insertHTML", "<code>" + esc(String(getSelection()) || "code") + "</code>"),
  ul:     () => cmd("insertUnorderedList"),
  ol:     () => cmd("insertOrderedList"),
  task:   () => cmd("insertHTML", '<ul><li class="task"><input type="checkbox" contenteditable="false"> </li></ul>'),
  quote:  () => cmd("formatBlock", blockAtCaret() === "blockquote" ? "p" : "blockquote"),
  link:   async () => {
            const saved = saveSel();
            const u = await askText("リンク先 URL", "https://");
            if(!u) return;
            restoreSel(saved);
            cmd("createLink", u);
          },
  img:    async () => {
            const saved = saveSel();
            const u = await askText("画像 URL", "https://");
            if(!u) return;
            restoreSel(saved);
            cmd("insertImage", u);
          },
  fence:  () => cmd("insertHTML", '<pre class="code"><code>code</code></pre><p><br></p>'),
  table:  async () => {
            const saved = saveSel();
            const size = await promptTableSize();
            if(!size) return;
            restoreSel(saved);
            const thead = "<tr>" + Array.from({ length: size.cols }, (_, i) => "<th>見出し" + (i + 1) + "</th>").join("") + "</tr>";
            const tbody = Array.from({ length: size.rows }, () => "<tr>" + "<td>&nbsp;</td>".repeat(size.cols) + "</tr>").join("");
            cmd("insertHTML", '<div class="tablewrap"><table><thead>' + thead + "</thead><tbody>" + tbody + "</tbody></table></div><p><br></p>");
          },
  hr:     () => cmd("insertHTML", "<hr><p><br></p>")
};

mdEl.addEventListener("keydown", e => {
  if(!previewEdit) return;
  const mod = e.ctrlKey || e.metaKey;
  if(mod && !e.altKey){
    const k = e.key.toLowerCase();
    const map = { b: "bold", i: "italic", k: "link", e: "code" };
    if(map[k]){ e.preventDefault(); Promise.resolve(PACTS[map[k]]()).then(syncFromPreview); return; }
    if(/^[1-6]$/.test(e.key)){ e.preventDefault(); cmd("formatBlock", "h" + e.key); return syncFromPreview(); }
    if(k === "s" && !embedded){ e.preventDefault(); return download(); }
  }
  if(e.key === "Tab"){
    if(blockAtCaret() === "li"){
      e.preventDefault();
      cmd(e.shiftKey ? "outdent" : "indent");
      syncFromPreview();
      return;
    }
    const b = blockAtCaret();
    const sel = getSelection();
    let cur = sel.anchorNode;
    let cell = null, tableWrap = null, tableRight = null;
    while(cur && cur !== mdEl){
      if(!cell && cur.nodeType === 1 && (cur.nodeName.toLowerCase() === "td" || cur.nodeName.toLowerCase() === "th")) cell = cur;
      if(cur.nodeType === 1 && cur.classList?.contains("table-right")) tableRight = cur;
      if(cur.nodeType === 1 && (cur.classList?.contains("tablewrap") || cur.nodeName.toLowerCase() === "table")){
        tableWrap = cur.closest(".tablewrap") || cur;
        break;
      }
      cur = cur.parentNode;
    }
    if(tableRight && !tableWrap && tableRight.previousElementSibling?.classList.contains("tablewrap"))
      tableWrap = tableRight.previousElementSibling;

    if(cell && tableWrap){
      e.preventDefault();
      const allCells = Array.from(tableWrap.querySelectorAll("th, td"));
      const idx = allCells.indexOf(cell);
      if(e.shiftKey){
        // 前のセルへ
        if(idx > 0){
          const prev = allCells[idx - 1];
          const range = document.createRange();
          range.selectNodeContents(prev);
          range.collapse(false);
          sel.removeAllRanges();
          sel.addRange(range);
        }
      }else{
        // 次のセルへ
        if(idx >= 0 && idx < allCells.length - 1){
          const next = allCells[idx + 1];
          const range = document.createRange();
          range.selectNodeContents(next);
          range.collapse(false);
          sel.removeAllRanges();
          sel.addRange(range);
        }else{
          // 次がなければ、表の右（table-right）にカーソル移動
          moveCaretToTableRight(tableWrap);
        }
      }
      return;
    }

    if(tableRight && tableWrap){
      // 表の右で TAB なら行追加
      e.preventDefault();
      const table = tableWrap.querySelector("table");
      const tbody = table.querySelector("tbody") || table;
      const headRow = table.querySelector("tr");
      const colCount = headRow ? headRow.children.length : 2;
      const newTr = document.createElement("tr");
      for(let k = 0; k < colCount; k++){
        const newTd = document.createElement("td");
        newTd.innerHTML = "<br>";
        newTr.appendChild(newTd);
      }
      tbody.appendChild(newTr);
      // 追加した行の先頭セルにカーソル移動
      const firstCell = newTr.firstElementChild;
      const range = document.createRange();
      range.selectNodeContents(firstCell);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
      syncFromPreview();
      return;
    }
  }
  if(e.key === "ArrowRight" && !mod && !e.shiftKey){
    const sel = getSelection();
    let cur = sel.anchorNode;
    let cell = null, tableWrap = null;
    while(cur && cur !== mdEl){
      if(!cell && cur.nodeType === 1 && (cur.nodeName.toLowerCase() === "td" || cur.nodeName.toLowerCase() === "th")) cell = cur;
      if(cur.nodeType === 1 && (cur.classList?.contains("tablewrap") || cur.nodeName.toLowerCase() === "table")){
        tableWrap = cur.closest(".tablewrap") || cur;
        break;
      }
      cur = cur.parentNode;
    }
    if(cell && tableWrap){
      const allCells = Array.from(tableWrap.querySelectorAll("th, td"));
      const isLast = allCells.indexOf(cell) === allCells.length - 1;
      if(isLast && caretAtEnd(cell, sel)){
        e.preventDefault();
        moveCaretToTableRight(tableWrap);
        return;
      }
    }
  }
  if(e.key === "Enter"){
    const b = blockAtCaret();
    const sel = getSelection();
    let cur = sel.anchorNode;
    let cell = null, tableWrap = null, tableRight = null;
    while(cur && cur !== mdEl){
      if(!cell && cur.nodeType === 1 && (cur.nodeName.toLowerCase() === "td" || cur.nodeName.toLowerCase() === "th")) cell = cur;
      if(cur.nodeType === 1 && cur.classList?.contains("table-right")) tableRight = cur;
      if(cur.nodeType === 1 && (cur.classList?.contains("tablewrap") || cur.nodeName.toLowerCase() === "table")){
        tableWrap = cur.closest(".tablewrap") || cur;
        break;
      }
      cur = cur.parentNode;
    }
    if(tableRight && !tableWrap && tableRight.previousElementSibling?.classList.contains("tablewrap"))
      tableWrap = tableRight.previousElementSibling;

    if(tableRight && tableWrap){
      // 表の右で改行なら表の次行に改行（CR追加 / 新しい段落作成）
      e.preventDefault();
      const p = document.createElement("p");
      p.innerHTML = "<br>";
      tableWrap.insertAdjacentElement("afterend", p);
      tableRight.remove();
      mdEl.focus();
      const range = document.createRange();
      range.selectNodeContents(p);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
      syncFromPreview();
      return;
    }

    if(cell && tableWrap){
      // セル内での改行は <br> を挿入
      // Shift/Ctrl+Enter の場合は表脱出（下段落）
      if(e.shiftKey || mod){
        e.preventDefault();
        const p = document.createElement("p");
        p.innerHTML = "<br>";
        tableWrap.insertAdjacentElement("afterend", p);
        mdEl.focus();
        const range = document.createRange();
        range.selectNodeContents(p);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
        syncFromPreview();
        return;
      }
      e.preventDefault();
      document.execCommand("insertLineBreak");
      syncFromPreview();
      return;
    }
    if(b === "pre"){
      // pre 内での改行は通常改行文字
      e.preventDefault();
      const sel = getSelection();
      if(sel.rangeCount > 0){
        const range = sel.getRangeAt(0);
        range.deleteContents();
        const tn = document.createTextNode("\n");
        range.insertNode(tn);
        range.setStartAfter(tn);
        range.setEndAfter(tn);
        sel.removeAllRanges();
        sel.addRange(range);
      }
      syncFromPreview();
      return;
    }
    if(b === "li"){
      let n = getSelection().anchorNode;
      let li = null;
      while(n && n !== mdEl){
        if(n.nodeType === 1 && n.nodeName.toLowerCase() === "li"){ li = n; break; }
        n = n.parentNode;
      }
      if(li && li.classList.contains("task")){
        e.preventDefault();
        const textContent = Array.from(li.childNodes)
          .filter(node => node.nodeName.toLowerCase() !== "input")
          .map(node => node.textContent).join("").trim();
        const parentUl = li.parentNode;
        if(textContent === ""){
          // 空のタスク項目で Enter -> タスクリストを抜けて段落にする
          const p = document.createElement("p");
          p.innerHTML = "<br>";
          li.remove();
          if(parentUl && !parentUl.children.length) parentUl.remove();
          else if(parentUl) parentUl.insertAdjacentElement("afterend", p);
          else mdEl.appendChild(p);
          const range = document.createRange();
          range.selectNodeContents(p);
          range.collapse(true);
          const sel = getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        }else{
          // 新しいタスク項目 (- [ ]) を作成
          const newLi = document.createElement("li");
          newLi.className = "task";
          newLi.innerHTML = '<input type="checkbox" contenteditable="false"> <br>';
          li.insertAdjacentElement("afterend", newLi);
          const range = document.createRange();
          range.setStart(newLi.childNodes[1], 1);
          range.collapse(true);
          const sel = getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        }
        syncFromPreview();
        return;
      }
    }
  }
});

render();
cursorInfo();
setPreviewEdit(previewEdit);
renderUrlMode();
syncUrl();
</script>
