<title>クエリ Markdown エディタ</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#e9ebef; --panel:#ffffff; --panel-2:#f4f5f8; --panel-3:#eceef3;
  --ink:#14171d; --ink-2:#3c434f; --muted:#5f6875;
  --line:#d5d9e1; --line-2:#c3c9d4;
  --accent:#2d5bb9; --accent-ink:#ffffff; --accent-soft:rgba(45,91,185,.10);
  --ok:#2c7a52; --warn:#a06611; --danger:#a8362e;
  --ui:"IBM Plex Sans",ui-sans-serif,system-ui,"Yu Gothic UI","Hiragino Sans",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;
  --prose:"IBM Plex Sans","Yu Gothic UI","Yu Gothic","Hiragino Kaku Gothic ProN",
          "Noto Sans JP","Meiryo",sans-serif;
  --split:50%;
  --r:6px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101317; --panel:#181b21; --panel-2:#1e222a; --panel-3:#242932;
    --ink:#e7eaf0; --ink-2:#c3cad5; --muted:#98a1ae;
    --line:#2b3039; --line-2:#39404b;
    --accent:#82a9f0; --accent-ink:#0e1117; --accent-soft:rgba(130,169,240,.14);
    --ok:#67b98c; --warn:#d6a75a; --danger:#e2867d;
  }
}
:root[data-theme="dark"]{
  --bg:#101317; --panel:#181b21; --panel-2:#1e222a; --panel-3:#242932;
  --ink:#e7eaf0; --ink-2:#c3cad5; --muted:#98a1ae;
  --line:#2b3039; --line-2:#39404b;
  --accent:#82a9f0; --accent-ink:#0e1117; --accent-soft:rgba(130,169,240,.14);
  --ok:#67b98c; --warn:#d6a75a; --danger:#e2867d;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--ui); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden;
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

/* ---------- command bar ---------- */
.bar{
  display:flex; align-items:center; gap:8px;
  padding:8px 12px; background:var(--panel);
  border-bottom:1px solid var(--line); flex:none;
}
.brand{display:flex; align-items:baseline; gap:9px; min-width:0}
.brand b{
  font-family:var(--mono); font-weight:500; font-size:12px; color:var(--muted);
  letter-spacing:.06em; white-space:nowrap;
}
.brand b::after{content:"/"; margin-left:9px; color:var(--line-2)}
.docname{
  font-family:var(--prose); font-size:14px; font-weight:500; color:var(--ink-2);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:28vw;
}
.bar .sp{flex:1}

button{
  font:inherit; font-size:12.5px; color:var(--ink-2);
  background:var(--panel-2); border:1px solid var(--line);
  border-radius:var(--r); padding:5px 9px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
button:hover{background:var(--panel-3); color:var(--ink)}
button:active{transform:translateY(.5px)}
button.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:500}
button.primary:hover{background:var(--accent); color:var(--accent-ink); filter:brightness(1.08)}

#btn-view #view-label{font-weight:500; color:var(--ink)}
#btn-view .caret{color:var(--muted); font-size:10px}
#btn-view[aria-expanded="true"]{background:var(--accent-soft); color:var(--accent)}

/* ---------- format strip ---------- */
.tools{
  display:flex; align-items:center; gap:2px; flex-wrap:wrap;
  padding:5px 10px; background:var(--panel-2);
  border-bottom:1px solid var(--line); flex:none;
}
.tools button{
  background:transparent; border-color:transparent; padding:4px 8px;
  min-width:30px; justify-content:center; font-family:var(--mono); font-size:12px;
}
.tools button:hover{background:var(--panel-3); border-color:var(--line)}
.tools .div{width:1px; height:18px; background:var(--line-2); margin:0 6px}
.tools .hint{margin-left:auto; color:var(--muted); font-size:11.5px; font-family:var(--mono); padding-right:4px}

/* ---------- panes ---------- */
.wrap{
  flex:1; min-height:0; display:grid;
  grid-template-columns:var(--split) 7px 1fr;
  background:var(--bg);
}
/* 非表示のペインはグリッドから外れるので、単一ペイン時は 1 カラムにする */
body[data-view="write"] .wrap,
body[data-view="read"] .wrap{grid-template-columns:1fr}
body[data-view="write"] .gutter,body[data-view="read"] .gutter{display:none}
body[data-view="write"] .pane--out,body[data-view="read"] .pane--src{display:none}

.pane{min-width:0; min-height:0; display:flex; flex-direction:column; background:var(--panel)}
.pane--src{border-right:1px solid var(--line)}
.pane-head{
  display:flex; align-items:center; gap:8px; flex:none;
  padding:5px 12px; border-bottom:1px solid var(--line);
  background:var(--panel-2);
  font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
}
.pane-head .sp{flex:1}
.pane-head .k{font-family:var(--mono); letter-spacing:0; text-transform:none}
.pane-head button{padding:1px 8px; font-size:11px; letter-spacing:.04em}
button[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:500}
button[aria-pressed="true"]:hover{background:var(--accent-soft); color:var(--accent)}
.pane--out.editing .pane-head{
  color:var(--accent); background:var(--accent-soft); border-bottom-color:var(--accent);
}
#md[contenteditable="true"]{outline:none; caret-color:var(--accent); min-height:60vh}
#md[contenteditable="true"] .anchor{display:none}

#src{
  flex:1; min-height:0; width:100%; resize:none; border:0; outline:0;
  padding:16px 18px 40vh; background:var(--panel); color:var(--ink);
  font-family:var(--mono); font-size:13px; line-height:1.75; tab-size:2;
  white-space:pre-wrap; overflow-wrap:break-word;
}
#src::placeholder{color:var(--muted)}

.gutter{cursor:col-resize; background:var(--line); touch-action:none}
.gutter:hover,.gutter.on{background:var(--accent)}

/* ---------- preview ---------- */
.out{flex:1; min-height:0; overflow:auto; padding:18px 24px 45vh}
.md{
  max-width:64ch; margin:0 auto; color:var(--ink);
  font-family:var(--prose); font-size:15.5px; line-height:1.85;
}
.md>*:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{
  font-family:var(--ui); line-height:1.3; text-wrap:balance;
  margin:1.9em 0 .55em; font-weight:600; color:var(--ink);
}
.md h1{font-size:1.7em; font-weight:700; margin-top:.2em; letter-spacing:-.01em}
.md h2{font-size:1.32em; font-weight:700; padding-bottom:.28em; border-bottom:1px solid var(--line)}
.md h3{font-size:1.12em}
.md h4{font-size:1em}
.md h5,.md h6{font-size:.9em; color:var(--ink-2); letter-spacing:.04em}
.md p{margin:0 0 1.05em}
.md a{color:var(--accent); text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:2px}
.md strong{font-weight:600}
.md del{color:var(--muted)}
.md ul,.md ol{margin:0 0 1.05em; padding-left:1.5em}
.md li{margin:.28em 0}
.md li>ul,.md li>ol{margin:.28em 0}
.md li.task{list-style:none; margin-left:-1.35em; padding-left:1.35em; position:relative}
.md li.task input{position:absolute; left:0; top:.42em; margin:0; accent-color:var(--accent)}
.md blockquote{
  margin:0 0 1.05em; padding:.1em 0 .1em 1.1em;
  border-left:3px solid var(--accent); color:var(--ink-2);
}
.md blockquote>*:last-child{margin-bottom:0}
.md hr{border:0; border-top:1px solid var(--line-2); margin:2em 0}
.md code{
  font-family:var(--mono); font-size:.86em; background:var(--panel-3);
  padding:.12em .38em; border-radius:4px; border:1px solid var(--line);
}
.md pre.code{
  margin:0 0 1.2em; padding:13px 15px; overflow-x:auto; position:relative;
  background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r);
}
.md pre.code code{background:none; border:0; padding:0; font-size:12.5px; line-height:1.65}
.md pre.code[data-lang]::before{
  content:attr(data-lang); position:absolute; top:0; right:0;
  font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted); background:var(--panel-3);
  padding:2px 7px; border-left:1px solid var(--line); border-bottom:1px solid var(--line);
  border-radius:0 var(--r) 0 var(--r);
}
.md .tablewrap{overflow-x:auto; margin:0 0 1.2em; border:1px solid var(--line); border-radius:var(--r)}
.md table{border-collapse:collapse; width:100%; font-family:var(--ui); font-size:13.5px; font-variant-numeric:tabular-nums}
.md th,.md td{padding:7px 12px; border-bottom:1px solid var(--line); text-align:left}
.md th{background:var(--panel-2); font-weight:600; white-space:nowrap}
.md tr:last-child td{border-bottom:0}
.md img{max-width:100%; height:auto; border-radius:var(--r); display:block; margin:0 0 1.05em}
.md .anchor{
  float:left; margin-left:-.85em; width:.85em; color:var(--line-2);
  text-decoration:none; opacity:0; font-family:var(--mono); font-weight:400;
}
.md h1:hover .anchor,.md h2:hover .anchor,.md h3:hover .anchor,
.md h4:hover .anchor,.md h5:hover .anchor,.md h6:hover .anchor,
.md .anchor:focus-visible{opacity:1}

/* ---------- status rail ---------- */
.status{
  flex:none; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:5px 12px; background:var(--panel-2); border-top:1px solid var(--line);
  font-family:var(--mono); font-size:11.5px; color:var(--muted);
}
.status .sp{flex:1}
.status b{font-weight:500; color:var(--ink-2); font-variant-numeric:tabular-nums}
.dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--ok); margin-right:5px; vertical-align:1px}
.dot.dirty{background:var(--warn)}
#urllen.long b{color:var(--warn)}
#urllen.toolong b{color:var(--danger)}

.toast{
  position:fixed; left:50%; bottom:44px; transform:translate(-50%,8px);
  background:var(--ink); color:var(--panel); font-size:12.5px;
  padding:7px 14px; border-radius:999px; opacity:0; pointer-events:none;
  transition:opacity .16s ease, transform .16s ease; z-index:9;
}
.toast.on{opacity:1; transform:translate(-50%,0)}

/* ---------- 表：行/列 操作メニュー ---------- */
.tmenu{
  position:fixed; z-index:20; min-width:168px;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:0 6px 20px rgba(0,0,0,.2); padding:4px; font-size:12.5px;
}
.tmenu button{
  display:block; width:100%; text-align:left; background:transparent; border:0;
  padding:6px 10px; border-radius:4px; color:var(--ink-2); cursor:pointer; font:inherit;
}
.tmenu button:hover:not(:disabled){background:var(--panel-3); color:var(--ink)}
.tmenu button:disabled{color:var(--muted); opacity:.45; cursor:default}
.tmenu button[aria-checked="true"]{color:var(--accent); font-weight:500; background:var(--accent-soft)}
.tmenu button .mark{display:inline-block; width:1.1em; color:var(--accent)}
.tmenu .sep{height:1px; background:var(--line); margin:4px 2px}

/* 行/列の選択マーカー（表の上端・左端） */
.tmarks{position:fixed; inset:0; pointer-events:none; z-index:15}
.tmark{
  position:fixed; pointer-events:auto; padding:0; margin:0; min-width:0;
  background:var(--panel-3); border:1px solid var(--line-2); border-radius:4px; cursor:grab;
  /* つかみやすいように中央にグリップ（点線）を出す */
  background-image:radial-gradient(circle, var(--muted) 1px, transparent 1.2px);
  background-size:5px 5px; background-position:center;
  transition:background-color .15s ease, border-color .15s ease, transform .15s cubic-bezier(.2,0,0,1), box-shadow .15s ease;
}
.tmark:hover{background-color:var(--accent-soft); border-color:var(--accent)}
.tmark.on{background-color:var(--accent); border-color:var(--accent); background-image:none}
.tmark.dragging{
  cursor:grabbing; opacity:.95; transform:scale(1.12);
  box-shadow:0 4px 14px rgba(45,91,185,.35); z-index:20;
  background-color:var(--accent); border-color:var(--accent);
}
.tdrop{
  position:fixed; z-index:16; pointer-events:none; background:var(--accent);
  border-radius:3px; box-shadow:0 0 8px rgba(45,91,185,.55);
  transition:left .08s cubic-bezier(.2,0,0,1), top .08s cubic-bezier(.2,0,0,1), width .08s ease, height .08s ease, opacity .12s ease;
}
.md .tcell-sel{background:var(--accent-soft); transition:background-color .15s ease}
.md .tcell-selcell{cursor:grab}
.md .tcell-selcell:active{cursor:grabbing}
.md .tcell-dragging{
  background:var(--accent-soft);
  outline:1px dashed var(--accent);
  outline-offset:-1px;
}

/* ---------- 入力ダイアログ（prompt() の代替：Electron 等では prompt が使えない） ---------- */
.ask{
  position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.28);
}
.ask-box{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:0 10px 32px rgba(0,0,0,.28); padding:14px; min-width:min(330px,88vw);
}
.ask-box label{display:block; font-size:12.5px; color:var(--ink-2); margin-bottom:7px}
.ask-box input{
  width:100%; font:inherit; font-size:13px; color:var(--ink);
  background:var(--panel-2); border:1px solid var(--line-2); border-radius:var(--r); padding:6px 8px;
}
.ask-btns{display:flex; justify-content:flex-end; gap:6px; margin-top:11px}

@media (max-width:820px){
  .wrap{grid-template-columns:none!important; grid-template-rows:var(--split) 7px 1fr}
  body[data-view="write"] .wrap{grid-template-rows:1fr 0 0}
  body[data-view="read"] .wrap{grid-template-rows:0 0 1fr}
  .gutter{cursor:row-resize}
  .pane--src{border-right:0; border-bottom:1px solid var(--line)}
  .docname{max-width:40vw}
  .out{padding:14px 16px 45vh}
}
@media print{
  body{overflow:visible; display:block; background:#fff; color:#000}
  .bar,.tools,.gutter,.pane--src,.status,.toast,.pane-head{display:none!important}
  .wrap{display:block}
  .out{overflow:visible; padding:0}
  .md{max-width:none; color:#000}
  .md pre.code,.md .tablewrap{break-inside:avoid}
}
</style>

<header class="bar">
  <div class="brand">
    <b>mdedit</b>
    <span class="docname" id="docname">無題</span>
  </div>
  <span class="sp"></span>
  <button id="btn-view" aria-haspopup="menu" aria-expanded="false" title="表示形式を選ぶ">
    表示: <span id="view-label">分割</span> <span class="caret">▾</span>
  </button>
  <div class="tmenu" id="vmenu" role="menu" aria-label="表示形式" hidden></div>
  <button id="btn-theme" title="配色を切り替え">配色</button>
  <button id="btn-open" title="ローカルの .md を開く">開く</button>
  <button id="btn-dl" title="Markdown を保存 (Ctrl+S)">保存</button>
  <button id="btn-print" title="プレビューを印刷 / PDF">印刷</button>
  <button id="btn-copy" title="Markdown をクリップボードへ">MD コピー</button>
  <button id="btn-url" class="primary" title="本文入りの URL を作ってコピー">URL をコピー</button>
  <input type="file" id="file" accept=".md,.markdown,.txt,text/*" hidden>
</header>

<div class="tools">
  <button data-act="h" title="見出し (Ctrl+1〜6 でレベル指定)">H</button>
  <button data-act="bold" title="太字 (Ctrl+B)"><b>B</b></button>
  <button data-act="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
  <button data-act="strike" title="打ち消し">S&#818;</button>
  <button data-act="code" title="インラインコード (Ctrl+E)">`</button>
  <span class="div"></span>
  <button data-act="ul" title="箇条書き">- 一覧</button>
  <button data-act="ol" title="番号付き">1. 番号</button>
  <button data-act="task" title="チェックリスト">[ ] タスク</button>
  <button data-act="quote" title="引用">&gt; 引用</button>
  <span class="div"></span>
  <button data-act="link" title="リンク (Ctrl+K)">リンク</button>
  <button data-act="img" title="画像">画像</button>
  <button data-act="fence" title="コードブロック">```</button>
  <button data-act="table" title="表">表</button>
  <button data-act="hr" title="区切り線">―</button>
  <span class="hint" id="cursor">1:1</span>
</div>

<main class="wrap" id="wrap">
  <section class="pane pane--src">
    <div class="pane-head"><span>Markdown ソース</span><span class="sp"></span><span class="k" id="srcinfo"></span></div>
    <textarea id="src" spellcheck="false" autocapitalize="off" autocorrect="off"
      placeholder="ここに Markdown を書く。URL に #md=... を付けると初期本文になります。"></textarea>
  </section>
  <div class="gutter" id="gutter" role="separator" aria-label="ペインの幅" tabindex="0"></div>
  <section class="pane pane--out" id="paneout">
    <div class="pane-head">
      <span>プレビュー</span>
      <span class="sp"></span>
      <button id="btn-pedit" aria-pressed="false" title="プレビューを直接書き換える（結果はソースへ反映）">直接編集</button>
    </div>
    <div class="out" id="out"><article class="md" id="md"></article></div>
  </section>
</main>

<footer class="status">
  <span><span class="dot" id="dot"></span><span id="savestate">保存済み</span></span>
  <span>行 <b id="s-lines">0</b></span>
  <span>文字 <b id="s-chars">0</b></span>
  <span>語 <b id="s-words">0</b></span>
  <span class="sp"></span>
  <span id="urllen">URL 長 <b>0</b> 文字</span>
  <span id="urlmode">URL 反映 <b>#md=</b></span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tmenu" id="tmenu" role="menu" hidden></div>
<div class="tmarks" id="tmarks" hidden></div>
<div class="tdrop" id="tdrop" hidden></div>

<script>
"use strict";
/* =========================================================
   1. Markdown -> HTML（自己完結・入力は必ずエスケープ）
   ========================================================= */
const NUL = "\uE000";
const esc = s => String(s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function safeUrl(u){
  const t = String(u).trim().replace(/&amp;/g, "&");
  if(/^\s*(javascript|vbscript|file|about):/i.test(t)) return "#";
  if(/^data:/i.test(t) && !/^data:image\//i.test(t)) return "#";
  return t.replace(/"/g, "%22").replace(/&/g, "&amp;");
}
const slug = t => String(t).toLowerCase().trim()
  .replace(/[<>&"'`]/g, "").replace(/[^\p{L}\p{N}\s-]/gu, "")
  .replace(/\s+/g, "-").replace(/^-+|-+$/g, "") || "s";

function inline(srcText, store){
  const top = !store;
  store = store || [];
  const put = html => NUL + (store.push(html) - 1) + NUL;
  let s = srcText;
  s = s.replace(/<br\s*\/?>/gi, put("<br>"));
  s = esc(s);

  s = s.replace(/\\([\\`*_{}\[\]()#+\-.!>~|])/g, (m, c) => put(esc(c)));
  s = s.replace(/(`+)([\s\S]*?)\1(?!`)/g, (m, f, code) => put("<code>" + code.replace(/^ ([\s\S]*) $/, "$1") + "</code>"));
  s = s.replace(/!\[([^\]]*)\]\(\s*([^\s)]*)(?:\s+&quot;([^&]*)&quot;)?\s*\)/g,
    (m, alt, url, title) => put('<img src="' + safeUrl(url) + '" alt="' + alt + '"' + (title ? ' title="' + title + '"' : "") + ">"));
  s = s.replace(/\[([^\]]*)\]\(\s*([^\s)]*)(?:\s+&quot;([^&]*)&quot;)?\s*\)/g,
    (m, txt, url, title) => put('<a href="' + safeUrl(url) + '"' + (title ? ' title="' + title + '"' : "") +
      (/^#/.test(url.trim()) ? "" : ' target="_blank" rel="noopener noreferrer"') + ">" + inline(txt, store) + "</a>"));
  s = s.replace(/&lt;((?:https?|mailto):[^\s<>]+)&gt;/g,
    (m, u) => put('<a href="' + safeUrl(u) + '" target="_blank" rel="noopener noreferrer">' + u + "</a>"));
  s = s.replace(/(^|[\s(])((?:https?:\/\/|www\.)[^\s<>()\uE000]*[^\s<>().,;:!?'"\uE000])/g,
    (m, p, u) => p + put('<a href="' + safeUrl(/^www\./.test(u) ? "https://" + u : u) +
      '" target="_blank" rel="noopener noreferrer">' + u + "</a>"));

  s = s.replace(/~~(?=\S)([\s\S]*?\S)~~/g, "<del>$1</del>");
  s = s.replace(/\*\*\*(?=\S)([\s\S]*?\S)\*\*\*/g, "<strong><em>$1</em></strong>");
  s = s.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^\w*])\*(?=\S)([^*\n]*?\S)\*(?!\*)/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^\w_])___(?=\S)([\s\S]*?\S)___(?!\w)/g, "$1<strong><em>$2</em></strong>");
  s = s.replace(/(^|[^\w_])__(?=\S)([\s\S]*?\S)__(?!\w)/g, "$1<strong>$2</strong>");
  s = s.replace(/(^|[^\w_])_(?=\S)([^_\n]*?\S)_(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/ {2,}\n/g, "<br>\n").replace(/\\\n/g, "<br>\n");

  if(top){
    for(let i = 0; i < 8 && s.indexOf(NUL) >= 0; i++)
      s = s.replace(/\uE000(\d+)\uE000/g, (m, n) => store[+n]);
    s = s.split(NUL).join("");
  }
  return s;
}

const RE_ITEM  = /^( *)([-*+]|\d{1,9}[.)])(?:\s+|$)/;
const RE_FENCE = /^ {0,3}(`{3,}|~{3,})\s*([^\s`~]*)/;
const RE_HEAD  = /^ {0,3}(#{1,6})(?:\s+(.*?))?\s*#*\s*$/;
const RE_HR    = /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/;
const RE_QUOTE = /^ {0,3}>[ \t]?/;
const isBlockStart = l =>
  RE_FENCE.test(l) || RE_HEAD.test(l) || RE_HR.test(l) || RE_QUOTE.test(l) || RE_ITEM.test(l);

function isTable(lines, i){
  const h = lines[i], d = lines[i + 1];
  if(!h || !d || h.indexOf("|") < 0 || d.indexOf("-") < 0) return false;
  return /^[ \t]*:?-+:?([ \t]*\|[ \t]*:?-+:?)*[ \t]*\|?[ \t]*$/.test(d.replace(/^[ \t]*\|/, ""));
}
function cells(row){
  const s = row.trim().replace(/^\|/, "").replace(/\|[ \t]*$/, "");
  const out = [];
  let cur = "";
  for(let k = 0; k < s.length; k++){
    const ch = s[k];
    if(ch === "\\" && s[k + 1] === "|"){ cur += "|"; k++; continue; }
    if(ch === "|"){ out.push(cur); cur = ""; continue; }
    cur += ch;
  }
  out.push(cur);
  return out.map(c => c.trim());
}
function table(lines, i){
  const head = cells(lines[i]);
  const align = cells(lines[i + 1]).map(c => {
    const l = c.startsWith(":"), r = c.endsWith(":");
    return l && r ? "center" : r ? "right" : l ? "left" : "";
  });
  i += 2;
  const body = [];
  while(i < lines.length && lines[i].trim() && lines[i].indexOf("|") >= 0 && !isBlockStart(lines[i]))
    body.push(cells(lines[i++]));
  const at = k => align[k] ? ' style="text-align:' + align[k] + '"' : "";
  let h = '<div class="tablewrap"><table><thead><tr>';
  head.forEach((c, k) => { h += "<th" + at(k) + ">" + inline(c) + "</th>"; });
  h += "</tr></thead>";
  if(body.length){
    h += "<tbody>";
    body.forEach(r => {
      h += "<tr>";
      for(let k = 0; k < head.length; k++) h += "<td" + at(k) + ">" + inline(r[k] || "") + "</td>";
      h += "</tr>";
    });
    h += "</tbody>";
  }
  return { html: h + "</table></div>", i };
}
function list(lines, i){
  const m0 = lines[i].match(RE_ITEM);
  const base = m0[1].length;
  const ordered = /\d/.test(m0[2]);
  const start = ordered ? parseInt(m0[2], 10) : 1;
  const items = [];
  let cur = null, loose = false, blanks = 0;

  while(i < lines.length){
    const line = lines[i];
    if(!line.trim()){ blanks++; i++; continue; }
    const indent = line.match(/^ */)[0].length;
    const im = line.match(RE_ITEM);
    if(im && im[1].length <= base + 1){
      if(im[1].length < base) break;
      if(cur && /\d/.test(im[2]) !== ordered) break;
      if(cur && blanks) loose = true;
      cur = { body: [line.slice(im[0].length)], ci: im[0].length };
      items.push(cur); blanks = 0; i++; continue;
    }
    if(cur && indent >= cur.ci){
      if(blanks){ cur.body.push(""); loose = true; }
      cur.body.push(line.slice(cur.ci)); blanks = 0; i++; continue;
    }
    if(cur && !blanks && !isBlockStart(line)){ cur.body.push(line.trim()); i++; continue; }
    break;
  }

  let html = "", anyTask = false;
  items.forEach(it => {
    let body = it.body.join("\n"), task = "";
    const tm = body.match(/^\[([ xX])\]\s+/);
    if(tm){
      anyTask = true;
      task = '<input type="checkbox" contenteditable="false"' + (tm[1] !== " " ? " checked" : "") + "> ";
      body = body.slice(tm[0].length);
    }
    let inner = blocks(body.split("\n"));
    if(!loose) inner = inner.replace(/^<p>([\s\S]*?)<\/p>/, "$1");
    html += "<li" + (tm ? ' class="task"' : "") + ">" + task + inner + "</li>";
  });
  const tag = ordered ? "ol" : "ul";
  const attrs = (ordered && start !== 1 ? ' start="' + start + '"' : "") + (anyTask ? ' class="tasklist"' : "");
  return { html: "<" + tag + attrs + ">" + html + "</" + tag + ">", i };
}

function blocks(lines){
  const out = [];
  let i = 0, m;
  while(i < lines.length){
    const line = lines[i];
    if(!line.trim()){ i++; continue; }

    if(m = line.match(RE_FENCE)){
      const ch = m[1][0], len = m[1].length, lang = m[2] || "";
      const close = new RegExp("^ {0,3}\\" + ch + "{" + len + ",}[ \t]*$");
      const buf = [];
      i++;
      while(i < lines.length && !close.test(lines[i])) buf.push(lines[i++]);
      if(i < lines.length) i++;
      out.push('<pre class="code"' + (lang ? ' data-lang="' + esc(lang) + '"' : "") +
        "><code>" + esc(buf.join("\n")) + "</code></pre>");
      continue;
    }
    if(m = line.match(RE_HEAD)){
      const lv = m[1].length, txt = (m[2] || "").trim(), id = slug(txt);
      out.push("<h" + lv + ' id="' + esc(id) + '"><a class="anchor" href="#' + esc(id) +
        '" aria-hidden="true">#</a>' + inline(txt) + "</h" + lv + ">");
      i++; continue;
    }
    if(RE_HR.test(line)){ out.push("<hr>"); i++; continue; }
    if(RE_QUOTE.test(line)){
      const buf = [];
      while(i < lines.length && (RE_QUOTE.test(lines[i]) || (buf.length && lines[i].trim() && !isBlockStart(lines[i]))))
        buf.push(lines[i++].replace(RE_QUOTE, ""));
      out.push("<blockquote>" + blocks(buf) + "</blockquote>");
      continue;
    }
    if(RE_ITEM.test(line)){ const r = list(lines, i); out.push(r.html); i = r.i; continue; }
    if(isTable(lines, i)){ const r = table(lines, i); out.push(r.html); i = r.i; continue; }

    const buf = [line];
    i++;
    while(i < lines.length && lines[i].trim() && !isBlockStart(lines[i]) && !isTable(lines, i)) buf.push(lines[i++]);
    out.push("<p>" + inline(buf.join("\n")) + "</p>");
  }
  return out.join("\n");
}
const mdToHtml = text => blocks(
  String(text).replace(/\r\n?/g, "\n").replace(/\u200B/g, "").split(NUL).join("").replace(/\t/g, "    ").split("\n")
);

/* =========================================================
   2. 初期本文の取得（#md= または #t=base64）
   ========================================================= */
function fromB64(v){
  try{
    let s = v.replace(/-/g, "+").replace(/_/g, "/");
    while(s.length % 4) s += "=";
    const bin = atob(s);
    return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
  }catch(e){ return null; }
}
function readParams(){
  if(location.hash.length <= 1) return null;
  const p = new URLSearchParams(location.hash.slice(1).replace(/^!/, ""));
  const tB64 = p.get("t");
  if(tB64 !== null){
    const decoded = fromB64(tB64);
    if(decoded !== null) return { text: decoded, from: "#t= (Base64)" };
  }
  const v = p.get("md");
  if(v !== null) return { text: v, from: "#md=" };
  return null;
}

   3. アプリ
   ========================================================= */
const $ = id => document.getElementById(id);
const src = $("src"), mdEl = $("md"), out = $("out");

  draft: "mdedit:draft", view: "mdedit:view", split: "mdedit:split",
  theme: "mdedit:theme", pedit: "mdedit:pedit"

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};
const embedded = (() => { try{ return window.self !== window.top; }catch(e){ return true; } })();

/* 表の行/列選択の状態（マーカー UI は「5. プレビュー直接編集」側で実装） */
const tmarks = $("tmarks"), tdrop = $("tdrop");
let tsel = { table: null, rows: new Set(), cols: new Set(), cells: new Set() };

let toastTimer;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2000);

/* --- 初期化 --- */
const param = readParams();
const draft = store.get(LS.draft);
src.value = (param ? param.text : (draft !== null ? draft : SAMPLE)).replace(/\u200B/g, "").replace(/\n{3,}/g, "\n\n");
const savedTheme = store.get(LS.theme);
if(savedTheme) document.documentElement.dataset.theme = savedTheme;
const VIEWS = [
  { value: "write", label: "ソース",     hint: "ソースのみ" },
  { value: "split", label: "分割",       hint: "2ペイン" },
  { value: "read",  label: "プレビュー", hint: "プレビューのみ" }
];
const savedView = VIEWS.some(v => v.value === store.get(LS.view)) ? store.get(LS.view) : "split";
document.body.dataset.view = savedView;
$("view-label").textContent = (VIEWS.find(v => v.value === savedView) || VIEWS[1]).label;
const savedSplit = store.get(LS.split);
if(savedSplit) document.documentElement.style.setProperty("--split", savedSplit);
if(embedded){ $("btn-dl").hidden = true; $("btn-open").hidden = true; }

/* --- URL への即時反映（#md= のみ） --- */
const MAX_URL = 60000;                       // これを超えたら URL 反映を止める
let urlMode = "hash";                        // hash | off
const urlBase = () => location.href.split(/[?#]/)[0];
const shareUrl = () => urlBase() + "#md=" + encodeURIComponent(src.value);

function syncUrl(){
  const enc = encodeURIComponent(src.value);
  if(enc.length > MAX_URL){ urlMode = "off"; renderUrlMode(); return; }
  urlMode = "hash";
  try{ location.replace("#md=" + enc); }catch(e){ urlMode = "off"; }
  renderUrlMode();
}
function renderUrlMode(){
  $("urlmode").querySelector("b").textContent =
    urlMode === "hash" ? "#md=" : "停止（長すぎ）";
}

/* --- 描画 --- */
let raf = 0, dirty = false;
function renderPreview(){
  mdEl.innerHTML = mdToHtml(src.value);
  tsel = { table: null, rows: new Set(), cols: new Set(), cells: new Set() };   // DOM を作り直すので選択は解除
  tmarks.hidden = true;
  tmarks.innerHTML = "";
  tdrop.hidden = true;
}
function renderMeta(){
  const text = src.value;
  const h = text.match(/^ {0,3}#{1,6}\s+(.+?)\s*#*\s*$/m);
  const name = h ? h[1].replace(/[*`_~]/g, "").trim() : "";
  $("docname").textContent = name || "無題";
  document.title = (name ? name + " — " : "") + "クエリ Markdown エディタ";

  const lines = text ? text.split("\n").length : 0;
  const chars = text.replace(/\s/g, "").length;
  const latin = (text.match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g) || []).length;
  const cjk = (text.match(/[぀-ヿ㐀-䶿一-鿿豈-﫿]/g) || []).length;
  $("s-lines").textContent = lines.toLocaleString();
  $("s-chars").textContent = chars.toLocaleString();
  $("s-words").textContent = (latin + cjk).toLocaleString();
  $("srcinfo").textContent = text.length.toLocaleString() + " 字";

  const len = shareUrl().length;
  const box = $("urllen");
  box.querySelector("b").textContent = len.toLocaleString();
  box.className = len > 8000 ? "toolong" : len > 2000 ? "long" : "";
}
function render(skipPreview){
  if(!skipPreview) renderPreview();
  renderMeta();
}
let saveTimer;
function schedule(skipPreview){
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => render(skipPreview));
  if(!dirty){
    dirty = true;
    $("dot").classList.add("dirty");
    $("savestate").textContent = "未保存";
  }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    store.set(LS.draft, src.value);
    syncUrl();
    renderMeta();
    dirty = false;
    $("dot").classList.remove("dirty");
    $("savestate").textContent = "保存済み";
  }, 300);
}
function cursorInfo(){
  const upto = src.value.slice(0, src.selectionStart).split("\n");
  $("cursor").textContent = upto.length + ":" + (upto[upto.length - 1].length + 1);
}
src.addEventListener("input", () => { schedule(); cursorInfo(); });
src.addEventListener("keyup", cursorInfo);
src.addEventListener("click", cursorInfo);

/* --- 編集ヘルパ --- */
function apply(fn){
  const s = src.selectionStart, e = src.selectionEnd;
  const r = fn(src.value.slice(s, e), s, e);
  src.setRangeText(r.text, r.from === undefined ? s : r.from, r.to === undefined ? e : r.to, "end");
  if(r.select) src.setSelectionRange(r.select[0], r.select[1]);
  src.focus();
  schedule();
  cursorInfo();
}
const wrapSel = (pre, post, ph) => apply((sel, s) => {
  const body = sel || ph;
  return { text: pre + body + post, select: sel ? null : [s + pre.length, s + pre.length + body.length] };
});
function lineRange(){
  const v = src.value;
  const a = v.lastIndexOf("\n", src.selectionStart - 1) + 1;
  let b = v.indexOf("\n", src.selectionEnd);
  if(b < 0) b = v.length;
  return [a, b];
}
function eachLine(fn){
  const [a, b] = lineRange();
  const body = src.value.slice(a, b).split("\n").map(fn).join("\n");
  src.setRangeText(body, a, b, "end");
  src.focus();
  schedule();
  cursorInfo();
}
const togglePrefix = p => eachLine(l => l.startsWith(p) ? l.slice(p.length) : p + l);
function headingCycle(level){
  eachLine(l => {
    const m = l.match(/^(#{1,6})\s+/);
    if(level) return "#".repeat(level) + " " + l.replace(/^#{1,6}\s+/, "");
    if(!m) return "## " + l;
    return m[1].length >= 6 ? l.replace(/^#{1,6}\s+/, "") : "#" + l;
  });
}
function insertBlock(text){
  const v = src.value, s = src.selectionStart;
  const lead = s === 0 ? "" : v[s - 1] !== "\n" ? "\n\n" : (s > 1 && v[s - 2] !== "\n" ? "\n" : "");
  apply(() => ({ text: lead + text + "\n" }));
}
/* prompt() は Electron 系ブラウザで throw するのでアプリ内ダイアログで代替。
   ダイアログ表示中は asking>0。この間 mdEl の blur による再描画を止める
   （再描画すると DOM が作り直されて保存したキャレット位置が無効になる） */
let asking = 0;
function askText(label, value){
  asking++;
  return new Promise(resolve => {
    const back = document.createElement("div");
    back.className = "ask";
    const box = document.createElement("div");
    box.className = "ask-box";
    const lab = document.createElement("label");
    lab.textContent = label;
    const inp = document.createElement("input");
    inp.type = "text";
    inp.value = value == null ? "" : value;
    const btns = document.createElement("div");
    btns.className = "ask-btns";
    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.textContent = "キャンセル";
    const ok = document.createElement("button");
    ok.type = "button";
    ok.className = "primary";
    ok.textContent = "OK";
    btns.append(cancel, ok);
    box.append(lab, inp, btns);
    back.appendChild(box);
    let done = false;
    const close = v => { if(done) return; done = true; asking--; back.remove(); resolve(v); };
    ok.addEventListener("click", () => close(inp.value));
    cancel.addEventListener("click", () => close(null));
    back.addEventListener("mousedown", e => { if(e.target === back) close(null); });
    inp.addEventListener("keydown", e => {
      if(e.key === "Enter"){ e.preventDefault(); close(inp.value); }
      else if(e.key === "Escape"){ e.preventDefault(); close(null); }
    });
    document.body.appendChild(back);
    inp.focus();
    inp.select();
  });
}
async function promptTableSize(){
  const raw = await askText("行数,列数（見出し行を除く本文の行数）", "2,3");
  if(raw === null) return null;
  const m = raw.match(/(\d+)\D+(\d+)/);
  return {
    rows: Math.max(1, Math.min(50, m ? parseInt(m[1], 10) : 2)),
    cols: Math.max(1, Math.min(20, m ? parseInt(m[2], 10) : 3))
  };
}
const ACTS = {
  h:      () => headingCycle(0),
  bold:   () => wrapSel("**", "**", "太字"),
  italic: () => wrapSel("*", "*", "斜体"),
  strike: () => wrapSel("~~", "~~", "打ち消し"),
  code:   () => wrapSel("`", "`", "code"),
  ul:     () => togglePrefix("- "),
  ol:     () => eachLine((l, k) => /^\d+\.\s/.test(l) ? l.replace(/^\d+\.\s/, "") : (k + 1) + ". " + l),
  task:   () => togglePrefix("- [ ] "),
  quote:  () => togglePrefix("> "),
  link:   () => apply((sel, s) => {
            if(/^(https?:\/\/|mailto:)\S*$/i.test(sel))
              return { text: "[リンク](" + sel + ")", select: [s + 1, s + 4] };
            const body = sel || "リンク";
            return { text: "[" + body + "](https://)", select: [s + body.length + 3, s + body.length + 11] };
          }),
  img:    () => apply((sel, s) => {
            const alt = sel || "画像";
            return { text: "![" + alt + "](https://)", select: [s + alt.length + 4, s + alt.length + 12] };
          }),
  fence:  () => apply((sel, s) => ({ text: "```\n" + sel + "\n```", select: sel ? null : [s + 4, s + 4] })),
  table:  async () => {
            const a = src.selectionStart, b = src.selectionEnd;
            const size = await promptTableSize();
            if(!size) return;
            src.focus();
            src.setSelectionRange(a, b);              // ダイアログ表示中に移った選択を戻す
            const head = "| " + Array.from({ length: size.cols }, (_, i) => "見出し" + (i + 1)).join(" | ") + " |";
            const sep  = "|" + "---|".repeat(size.cols);
            const body = Array.from({ length: size.rows }, () => "|" + " |".repeat(size.cols)).join("\n");
            insertBlock([head, sep, body].join("\n"));
          },
  hr:     () => insertBlock("---")
};
document.querySelectorAll(".tools button").forEach(b => {
  b.addEventListener("mousedown", e => e.preventDefault());   // 編集中の選択を保持
  b.addEventListener("click", async () => {
    const act = b.dataset.act;

    await ACTS[act]();

/* --- キーボード --- */
src.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey;
  if(mod && !e.altKey){
    const k = e.key.toLowerCase();
    if(k === "b"){ e.preventDefault(); return ACTS.bold(); }
    if(k === "i"){ e.preventDefault(); return ACTS.italic(); }
    if(k === "k"){ e.preventDefault(); return ACTS.link(); }
    if(k === "e"){ e.preventDefault(); return ACTS.code(); }
    if(/^[1-6]$/.test(e.key)){ e.preventDefault(); return headingCycle(+e.key); }
    if(k === "s" && !embedded){ e.preventDefault(); return download(); }
  }
  if(e.key === "Tab"){
    e.preventDefault();
    const multi = src.value.slice(src.selectionStart, src.selectionEnd).indexOf("\n") >= 0;
    if(multi || e.shiftKey) return eachLine(l => e.shiftKey ? l.replace(/^ {1,2}/, "") : "  " + l);
    return apply(() => ({ text: "  " }));
  }
  if(e.key === "Enter" && !e.shiftKey && !mod){
    const v = src.value;
    const a = v.lastIndexOf("\n", src.selectionStart - 1) + 1;
    const line = v.slice(a, src.selectionStart);
    const m = line.match(/^(\s*)([-*+]|\d{1,9}[.)])\s+(\[[ xX]\]\s+)?/);
    if(m){
      e.preventDefault();
      if(line.length === m[0].length){            // 空項目 -> リストを終了
        src.setRangeText("", a, src.selectionStart, "end");
        return apply(() => ({ text: "\n" }));
      }
      const marker = /\d/.test(m[2]) ? (parseInt(m[2], 10) + 1) + m[2].slice(-1) : m[2];
      return apply(() => ({ text: "\n" + m[1] + marker + " " + (m[3] ? "[ ] " : "") }));
    }
    const q = line.match(/^(\s*>[ \t]?)+/);
    if(q && line.trim() !== q[0].trim()){
      e.preventDefault();
      return apply(() => ({ text: "\n" + q[0] }));
    }
  }
});

/* --- スクロール同期 --- */
let lock = null, lockTimer;
function sync(from, to){
  if(lock && lock !== from) return;
  lock = from;
  const a = from.scrollHeight - from.clientHeight;
  const b = to.scrollHeight - to.clientHeight;
  if(a > 0 && b > 0) to.scrollTop = (from.scrollTop / a) * b;
  clearTimeout(lockTimer);
  lockTimer = setTimeout(() => { lock = null; }, 90);
}

out.addEventListener("scroll", () => sync(out, src));

/* =========================================================
   4. HTML -> Markdown（プレビュー直接編集の書き戻し）
   ========================================================= */
function mdEsc(t){
  return t.replace(/\u200B/g, "")
          .replace(/([\\`*\[\]])/g, "\\$1")
          .replace(/(^|[^\w\\])_/g, "$1\\_")
          .replace(/~~/g, "\\~\\~");
}
const escLineStart = t =>
  t.replace(/^(\s*)(#{1,6} |>|[-*+] |\d{1,9}[.)] |\||```|~~~|---)/, "$1\\$2");

function inlNode(n){
  if(n.nodeType === 3) return mdEsc(n.nodeValue.replace(/\s+/g, " "));
  if(n.nodeType !== 1) return "";
  const tag = n.nodeName.toLowerCase();
  if(n.classList && (n.classList.contains("anchor") || n.classList.contains("table-right"))) return "";
  if(tag === "code") return "`" + n.textContent.replace(/`/g, "") + "`";
  if(tag === "br") return "  \n";
  if(tag === "input" || tag === "button" || tag === "style" || tag === "script") return "";
  if(tag === "img") return "![" + (n.getAttribute("alt") || "") + "](" + (n.getAttribute("src") || "") + ")";
  if(tag === "a"){
    const href = (n.getAttribute("href") || "").trim();
    const t = inlOf(n).trim();
    if(!href) return t;
    if(!t || t === href) return "<" + href + ">";
    return "[" + t + "](" + href + ")";
  }
  const t = inlOf(n);
  const w = (tag === "strong" || tag === "b") ? "**"
          : (tag === "em" || tag === "i") ? "*"
          : (tag === "del" || tag === "s" || tag === "strike") ? "~~" : "";
  if(!w) return t;
  const m = t.match(/^(\s*)([\s\S]*?)(\s*)$/);
  return m[2] ? m[1] + w + m[2] + w + m[3] : t;
}
const inlOf = el => Array.from(el.childNodes).map(inlNode).join("");

const HAS_BLOCK = "p,div,ul,ol,pre,table,blockquote,hr,h1,h2,h3,h4,h5,h6";

function blockNode(n){
  if(n.nodeType === 3){
    const t = n.nodeValue.replace(/\u200B/g, "").replace(/\s+/g, " ").trim();
    return t ? escLineStart(mdEsc(t)) : "";
  }
  if(n.nodeType !== 1) return "";
  const tag = n.nodeName.toLowerCase();
  if(/^h[1-6]$/.test(tag)){
    const t = inlOf(n).replace(/\u200B/g, "").trim();
    return t ? "#".repeat(+tag[1]) + " " + t : "";
  }
  if(tag === "pre"){
    const codeEl = n.querySelector("code");
    const code = ((codeEl || n).textContent || "").replace(/\n+$/, "");
    const lang = n.getAttribute("data-lang") ||
      (codeEl && (String(codeEl.className).match(/language-([\w+#.-]+)/) || [])[1]) || "";
    const f = /^|\n```/.test("\n" + code) && /```/.test(code) ? "~~~" : "```";
    return f + lang + "\n" + code + "\n" + f;
  }
  if(tag === "blockquote")
    return blocksOf(n).split("\n").map(l => l ? "> " + l : ">").join("\n");
  if(tag === "ul" || tag === "ol") return listMd(n);
  if(tag === "hr") return "---";
  if(tag === "table") return tableMd(n);
  if(tag === "div" && n.classList && n.classList.contains("tablewrap")){
    const t = n.querySelector("table");
    return t ? tableMd(t) : "";
  }
  if(tag === "img") return "![" + (n.getAttribute("alt") || "") + "](" + (n.getAttribute("src") || "") + ")";
  if(tag === "br" || tag === "style" || tag === "script") return "";
  if(tag === "p" || !n.querySelector(HAS_BLOCK)){
    const t = inlOf(n).replace(/\u200B/g, "").replace(/[ \t]+$/, "");
    return t.trim() ? escLineStart(t) : "";
  }
  return blocksOf(n);                                  // div などの入れ物
}
const blocksOf = el => Array.from(el.childNodes).map(blockNode).filter(s => s !== "").join("\n\n");

function listMd(el){
  const ordered = el.nodeName.toLowerCase() === "ol";
  let num = parseInt(el.getAttribute("start") || "1", 10) || 1;
  const lines = [];
  Array.from(el.children).forEach(li => {
    if(li.nodeName.toLowerCase() !== "li") return;
    const cb = Array.from(li.children).find(c =>
      c.nodeName.toLowerCase() === "input" && c.getAttribute("type") === "checkbox");
    let marker = ordered ? (num++) + ". " : "- ";
    if(cb) marker += cb.checked ? "[x] " : "[ ] ";
    const pad = " ".repeat(marker.length);
    const body = (liMd(li) || "").split("\n");
    const firstLine = body[0] !== undefined ? body[0] : "";
    lines.push(marker + firstLine);
    for(let k = 1; k < body.length; k++) lines.push(body[k] ? pad + body[k] : "");
  });
  return lines.join("\n");
}
function liMd(li){
  const parts = [];
  let buf = "";
  const flush = () => {
    const t = buf.replace(/^\s+|\s+$/g, "");
    if(t) parts.push({ tight: true, text: escLineStart(t) });
    buf = "";
  };
  Array.from(li.childNodes).forEach(n => {
    const tag = n.nodeType === 1 ? n.nodeName.toLowerCase() : "";
    if(tag === "input") return;
    if(tag === "ul" || tag === "ol"){ flush(); parts.push({ tight: true, text: listMd(n) }); return; }
    if(/^(p|pre|blockquote|table|div|hr|h[1-6])$/.test(tag)){
      flush();
      const t = blockNode(n);
      if(t) parts.push({ tight: false, text: t });
      return;
    }
    buf += inlNode(n);
  });
  flush();
  return parts.map((p, k) => (k === 0 ? "" : p.tight ? "\n" : "\n\n") + p.text).join("");
}
function tableMd(t){
  const rows = Array.from(t.querySelectorAll("tr"));
  if(!rows.length) return "";
  const cell = c => {
    const clone = c.cloneNode(true);
    clone.querySelectorAll("br").forEach(br => br.replaceWith(" <br> "));
    let text = inlOf(clone).trim().replace(/\|/g, "\\|").replace(/\s*<br>\s*/gi, "<br>").replace(/\n/g, " ");
    // セル末尾・先頭の余分な <br> や空白を除去（空セルやブラウザの末尾改行プレースホルダー対策）
    text = text.replace(/^(?:<br>|\s)+/gi, "").replace(/(?:<br>|\s)+$/gi, "").trim();
    return text;
  };
  const head = Array.from(rows[0].children).map(cell);
  const align = Array.from(rows[0].children).map(c => {
    const a = (c.style && c.style.textAlign) || "";
    return a === "center" ? ":---:" : a === "right" ? "---:" : a === "left" ? ":---" : "---";
  });
  const lines = ["| " + head.join(" | ") + " |", "| " + align.join(" | ") + " |"];
  rows.slice(1).forEach(r => {
    const cs = Array.from(r.children).map(cell);
    while(cs.length < head.length) cs.push("");
    lines.push("| " + cs.join(" | ") + " |");
  });
  return lines.join("\n");
}

/* 入力ダイアログでフォーカスが移る間、プレビュー側のキャレットを保持する。

let lastMdRange = null;

/* 表の直後（.table-right）へカーソルを送る。Tab と → キーで共有

function tableRightTarget(tableWrap){
  let trg = tableWrap.nextElementSibling;
  if(!trg || !trg.classList.contains("table-right")){
    trg = document.createElement("span");
    trg.className = "table-right";
    trg.innerHTML = "​";
    tableWrap.insertAdjacentElement("afterend", trg);
  }
  return trg;

function moveCaretToTableRight(tableWrap){
  const range = document.createRange();
  range.selectNodeContents(tableRightTarget(tableWrap));
  range.collapse(false);
  const sel = getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

function caretAtEnd(el, sel){
  if(!sel.rangeCount || !sel.isCollapsed) return false;
  const r = document.createRange();
  r.selectNodeContents(el);
  r.setStart(sel.focusNode, sel.focusOffset);

/* =========================================================
   表：行/列の追加・削除・移動（セル上で右クリック）
   ========================================================= */
function tableCtxAt(node){
  let cur = node, cell = null, row = null, table = null, tableWrap = null;
  while(cur && cur !== mdEl){
    if(!cell && cur.nodeType === 1 && /^(TD|TH)$/.test(cur.nodeName)) cell = cur;
    if(!row && cur.nodeType === 1 && cur.nodeName === "TR") row = cur;
    if(!table && cur.nodeType === 1 && cur.nodeName === "TABLE") table = cur;
    if(cur.nodeType === 1 && cur.classList?.contains("tablewrap")){ tableWrap = cur; break; }
    cur = cur.parentNode;
  }
  if(!cell || !row || !table || !tableWrap) return null;
  return { cell, row, table, tableWrap, isHeader: row.parentElement.nodeName === "THEAD",
    colIndex: Array.from(row.children).indexOf(cell) };
}
const tRows = table => Array.from(table.querySelectorAll("tr"));
function tFocusCell(cell){
  if(!cell) return;
  const range = document.createRange();
  range.selectNodeContents(cell);
  range.collapse(true);
  const sel = getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
